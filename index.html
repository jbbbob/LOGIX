<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIX</title>
    <meta name="color-scheme" content="light dark" />
    <!-- Favicon inline (data URI) : aucun fichier externe, aucun appel réseau. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e15'/%3E%3Cpath d='M9 8v16h13' stroke='%2322d3ee' stroke-width='3.2' fill='none' stroke-linecap='square'/%3E%3Ccircle cx='23' cy='9.5' r='2.6' fill='%2322d3ee'/%3E%3C/svg%3E"
    />

    <script>
      // Mode JOUR / NUIT : dernier choix retenu dans ce navigateur (préférence
      // d'affichage uniquement, aucune donnée de dossier).
      try {
        if (localStorage.getItem("logix-theme") === "nuit") {
          document.documentElement.setAttribute("data-theme", "nuit");
        }
      } catch (e) { /* stockage indisponible : on reste en mode jour */ }
    </script>
    <style>
      /* =========================================================================
         LOGIX — feuille de style unique (aucune dépendance externe, 100 % offline)
         -------------------------------------------------------------------------
         Sommaire :
           1. Jetons (variables CSS) : couleurs, typographie, rayons
           2. Reset minimal + règles globales (police, majuscules, animations)
           3. Utilitaires (remplacent les quelques classes Tailwind utilisées)
           4. Coque de page : header / sidebar / colonne principale
           5. Panneau CHEMIN / TODO
           6. Composants du parcours : card-row, pill-btn, inputs, image
           7. Blocs résultat
           8. Toast
           9. Responsive
         ========================================================================= */

      /* ---------- 1. Jetons ---------------------------------------------------- */
      :root {
        /* COULEURS — thème PAPIER CRÈME + VERT CANARD.
           Deux modes, mêmes noms de jetons :
             - JOUR (défaut, ici) : fond crème, cartes blanches ;
             - NUIT ([data-theme="nuit"], section 1 bis) : même palette en
               sombre, le blanc devient une teinte foncée assortie, les
               textes restent crème (pas de blanc pur qui éblouit).
           Toutes les couleurs de la page passent par ces jetons : pour
           changer une couleur, c'est ici (et dans le bloc NUIT). */
        color-scheme: light;

        /* Fonds : page → carte → contrôle */
        --bg-1: #f1ebe0;          /* fond général (crème) */
        --bg-2: #e9e1d3;
        --surface: #fffdf8;       /* les CARTES */
        --surface-strong: #fffdf8;
        --surface-raised: #f4ede1; /* boutons et champs DANS une carte */
        --surface-hover: #ebe2d2;  /* survol d'un contrôle */
        --surface-input: #fffefb;
        --surface-input-focus: #ffffff;

        /* Textes */
        --ink: #2b2419;
        --muted: #7a6c58;
        --muted-strong: #1a140c;
        --brand-ink: #1a140c;      /* la marque LOGIX */
        --brand-sub-ink: #7a6c58;  /* « OUTIL RECOUVREMENT » */
        --header-line: rgba(80, 60, 30, 0.2); /* filet à côté de la marque */

        /* Accent : vert canard */
        --accent: #0f766e;
        --accent-strong: #0b5e58;
        --accent-deep: #084842;
        --accent-ink: #ffffff;     /* texte posé SUR l'accent */
        --accent-tint: rgba(15, 118, 110, 0.06); /* bandeaux titre */
        --accent-wash: rgba(15, 118, 110, 0.08);
        --accent-wash-2: rgba(15, 118, 110, 0.15);

        /* Bordures et filets */
        --border: rgba(80, 60, 30, 0.2);
        --border-strong: rgba(15, 118, 110, 0.5);
        --hairline: rgba(80, 60, 30, 0.11);
        --hairline-soft: rgba(80, 60, 30, 0.06);

        /* Aplats très légers, ombre, voile */
        --wash: rgba(80, 60, 30, 0.035);
        --wash-hover: rgba(80, 60, 30, 0.07);
        --shadow-card: 0 1px 2px rgba(80, 60, 30, 0.12);
        --overlay: rgba(255, 253, 248, 0.9);

        /* Fond de page (le header réutilise la même valeur, voir .app-header) */
        --page-bg: var(--bg-1);

        /* États : fait / à faire / danger (+ fonds et bordures assortis) */
        --ok: #2f855a;
        --ok-ink: #ffffff;
        --ok-wash: rgba(47, 133, 90, 0.1);
        --ok-border: rgba(47, 133, 90, 0.45);
        --todo: #b45309;
        --todo-wash: rgba(180, 83, 9, 0.08);
        --todo-border: rgba(180, 83, 9, 0.4);
        --danger: #c53030;
        --danger-ink: #8f1d1d;
        --danger-wash: rgba(197, 48, 48, 0.08);
        --danger-border: rgba(197, 48, 48, 0.45);

        /* Anciens jetons conservés (référencés par .brand-button) */
        --button-bg: #e8f4f8;
        --button-text: #0a0e15;
        --button-hover: #ffffff;

        /* Échelle typographique — remplace l'ancien font-size: 13pt !important.
           --fs-body est la TAILLE HISTORIQUE : elle est conservée à l'identique
           pour les blocs résultat, pour ne rien changer à ta lecture. */
        --fs-micro: 9.5pt;
        --fs-label: 10.5pt;
        --fs-choice: 11pt;
        --fs-body: 13pt;
        --fs-title: 14pt;
        --fs-brand: 17pt;

        /* Échelle d'interlettrage — RÉFÉRENCE TYPOGRAPHIQUE DE L'INTERFACE.
           Le style de « CATÉGORIE » et « OUTIL RECOUVREMENT » (petites
           capitales largement espacées) est la langue commune de toute l'UI.
           L'espacement suit la taille, comme en typographie soignée : plus le
           texte est petit, plus il respire. C'est ce qui donne une identité
           unique et évite l'effet « texte de bouton banal ».
             --ls-wide   : 9.5pt  → titres de section, titres de blocs, boutons
             --ls-mid    : 10.5pt → valeurs affichées (CHEMIN)
             --ls-choice : 11pt   → les choix de la cascade
             --ls-ui     : base, et données saisies (dates, montants) */
        --ls-wide: 0.18em;
        --ls-mid: 0.13em;
        --ls-choice: 0.12em;
        --ls-ui: 0.08em;

        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 8px;

        --ctrl-h: 2.5rem; /* hauteur commune boutons + champs */

        /* Durée unique pour TOUTES les transitions autorisées (≤ 120 ms) */
        --t: 110ms;
      }

      /* ---------- 1 bis. Mode NUIT : thème LOGIX d'origine ------------------ */
      /* Le premier thème de LOGIX : fond encre légèrement bleuté, accent cyan.
         Mêmes valeurs qu'avant la refonte « papier crème » (y compris les
         couleurs qui étaient alors écrites en dur, devenues des jetons).
         Activé par le bouton ☾ NUIT / ☀ JOUR de l'en-tête. */
      :root[data-theme="nuit"] {
        color-scheme: dark;

        --bg-1: #090d14;
        --bg-2: #0d1220;
        --surface: #101825;
        --surface-strong: #101825;
        --surface-raised: #19212f;
        --surface-hover: #202a3a;
        --surface-input: #0c1220;
        --surface-input-focus: #0e1724;

        --ink: #dbe5f2;
        --muted: #7f93ad;
        --muted-strong: #eef4fb;
        --brand-ink: #f2f7ff;
        --brand-sub-ink: #7f93ad;
        --header-line: rgba(138, 182, 222, 0.15);

        --accent: #22d3ee;
        --accent-strong: #7ce9f8;
        --accent-deep: #0e7490;
        --accent-ink: #04161c;
        --accent-tint: rgba(34, 211, 238, 0.055);
        --accent-wash: rgba(34, 211, 238, 0.09);
        --accent-wash-2: rgba(34, 211, 238, 0.16);

        --border: rgba(138, 182, 222, 0.15);
        --border-strong: rgba(34, 211, 238, 0.4);
        --hairline: rgba(138, 182, 222, 0.09);
        --hairline-soft: rgba(138, 182, 222, 0.06);

        --wash: rgba(255, 255, 255, 0.025);
        --wash-hover: rgba(255, 255, 255, 0.055);
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);
        --overlay: rgba(8, 12, 20, 0.85);

        --page-bg:
          radial-gradient(1100px 620px at 22% -12%, #14243a 0%, rgba(20, 36, 58, 0) 62%),
          radial-gradient(900px 520px at 108% 4%, #0f2b34 0%, rgba(15, 43, 52, 0) 58%),
          var(--bg-1);

        --ok: #34d399;
        --ok-ink: #04241a;
        --ok-wash: rgba(52, 211, 153, 0.12);
        --ok-border: rgba(52, 211, 153, 0.4);
        --todo: #f0a92e;
        --todo-wash: rgba(240, 169, 46, 0.1);
        --todo-border: rgba(240, 169, 46, 0.42);
        --danger: #fb7185;
        --danger-ink: #ffd8de;
        --danger-wash: rgba(251, 113, 133, 0.1);
        --danger-border: rgba(251, 113, 133, 0.45);
      }

      /* ---------- 2. Reset minimal + globales --------------------------------- */
      /* Barres de défilement fines, en pilule, couleur du thème (page, panneau
         tuto, listes). Chrome / Edge : ::-webkit-scrollbar ; Firefox : scrollbar-color. */
      ::-webkit-scrollbar {
        width: 12px;
        height: 12px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: color-mix(in srgb, var(--accent) 35%, transparent);
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: padding-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: color-mix(in srgb, var(--accent) 60%, transparent);
      }

      ::-webkit-scrollbar-thumb:active {
        background-color: var(--accent);
      }

      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      @supports not selector(::-webkit-scrollbar) {
        * {
          scrollbar-width: thin;
          scrollbar-color: color-mix(in srgb, var(--accent) 45%, transparent) transparent;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        overflow-anchor: none;
      }

      html {
        overflow-anchor: none;
        scroll-behavior: auto;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif;
        font-size: var(--fs-choice);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: var(--ls-ui);
        line-height: 1.25;
        color: var(--ink);
        background: var(--page-bg);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* La police est imposée partout (contrainte poste de travail).
         La TAILLE, elle, n'est plus imposée : c'est ce qui permet une vraie
         hiérarchie typographique. */
      body,
      body * {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif !important;
      }

      h1,
      h2,
      h3,
      p,
      figure,
      ul,
      ol {
        margin: 0;
        padding: 0;
      }

      ul,
      ol {
        list-style: none;
      }

      button,
      input,
      textarea,
      select {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif !important;
        font-size: inherit;
        font-weight: 700;
        text-transform: inherit;
        letter-spacing: inherit;
        color: inherit;
        margin: 0;
        border: 0;
        background: none;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      /* ANIMATIONS — règle stricte.
         Interdit  : tout ce qui DÉPLACE, REDIMENSIONNE ou fait APPARAÎTRE
                     (transform, width, height, opacity, keyframes, delay).
         Autorisé  : uniquement les couleurs / bordures / ombres, ≤ 120 ms,
                     ce qui ne retarde jamais l'action de l'utilisateur.
         Les propriétés autorisées sont déclarées composant par composant
         (recherche « transition: » plus bas), jamais globalement. */
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-property: background-color, border-color, box-shadow, color;
        transition-duration: var(--t);
        transition-timing-function: linear;
        transition-delay: 0s !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- 3. Utilitaires (ex-Tailwind) -------------------------------- */
      /* .hidden est manipulée par le JS (classList.toggle("hidden", …)) : elle
         venait de Tailwind, elle doit donc exister ici maintenant qu'il est retiré. */
      .hidden {
        display: none !important;
      }

      /* À l'intérieur d'une carte, les lignes s'enchaînent sans écart : c'est
         le filet des card-row qui sépare. Entre les CARTES, on remet une
         gouttière (voir #mainPanel plus bas). */
      .stack {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* #mainPanel n'est pas une carte : c'est l'empilement des cartes du
         parcours (TOGGLES, CASCADE, QUESTIONS). Il lui faut donc une gouttière. */
      #mainPanel {
        gap: 10px;
      }

      .text-muted {
        color: var(--muted);
      }

      .text-strong {
        color: var(--muted-strong);
      }

      .surface-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
      }

      .surface-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
      }

      .brand-button {
        background: var(--button-bg);
        color: var(--button-text);
      }

      .brand-button:hover {
        background: var(--button-hover);
      }

      /* Classes historiques conservées (référencées par CLAUDE.md / le JS).
         Neutres par choix : aucune animation d'apparition n'est autorisée. */
      .fade-in,
      .pop-in {
        opacity: 1;
      }

      .page-shell {
        width: 100%;
        position: relative;
      }

      .choice-grid-root {
        width: 100%;
        display: flex;
        justify-content: flex-start;
      }

      /* Conservée pour compatibilité : plus aucun bouton flottant aujourd'hui,
         COPIER LE CHEMIN est désormais dans le panneau CHEMIN. */
      .floating-reset {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 50;
      }

      /* ---------- 4. Coque de page + système de CARTES ------------------------- */
      /* Hiérarchie visuelle à 3 niveaux, jamais plus :
         1. le fond de page         (--bg-1)
         2. la CARTE de section     (--surface + bordure 1px + radius 8px)
         3. les contrôles dedans    (--surface-raised + bordure 1px + radius 6px)
         Les lignes à l'intérieur d'une carte ne sont pas des cartes : elles sont
         séparées par un filet. C'est ce qui évite l'effet « boîte dans boîte »
         tout en gardant des rectangles nets et lisibles. */

      .app {
        max-width: 1680px;
        margin: 0 auto;
        padding: 0 0 36px;
      }

      /* --- Header : PAS de carte, fondu dans le décor ------------------------- */
      /* Volontairement sans fond propre, sans cadre et sans ombre : c'est une
         barre d'application posée directement sur le fond de la page.
         Le `background: var(--page-bg)` + `fixed` reproduit exactement le fond
         général (voir le commentaire du jeton --page-bg) : invisible à l'œil,
         mais opaque, ce qui évite que le contenu transparaisse au défilement.
         Seul un filet horizontal très léger marque la limite. */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        height: 58px;
        padding: 0 22px;
        margin-bottom: 14px;
        background: var(--page-bg);
        background-attachment: fixed;
        border: 0;
        border-bottom: 1px solid var(--hairline-soft);
        box-shadow: none;
      }

      /* Touche cyan : un trait court sous la marque, rien de plus. */
      .app-header::after {
        content: "";
        position: absolute;
        left: 22px;
        bottom: -1px;
        width: 86px;
        height: 1px;
        background: var(--accent);
        opacity: 0.6;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
        font-size: var(--fs-brand);
        font-weight: 700;
        letter-spacing: 0.26em;
        /* Élément le plus lumineux de la page : posé à même le fond, il doit
           porter seul, sans cadre pour le soutenir. */
        color: var(--brand-ink);
        user-select: none;
      }

      .brand-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex: 0 0 auto;
      }

      /* Nettement plus discret que LOGIX : plus petit, gris, et il se tronque
         plutôt que de pousser les boutons hors du header. */
      .brand-sub {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        color: var(--brand-sub-ink);
        font-weight: 600;
        opacity: 0.75;
        padding-left: 14px;
        border-left: 1px solid var(--header-line);
      }

      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .hdr-btn {
        flex: 0 0 auto;
        height: 2.1rem;
        padding: 0 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--ink);
      }

      .hdr-btn:hover:not(:disabled) {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--muted-strong);
      }

      .hdr-btn:disabled {
        opacity: 0.32;
      }

      .hdr-btn-strong:hover:not(:disabled) {
        border-color: var(--danger-border);
        background: var(--danger-wash);
        color: var(--danger-ink);
      }

      /* --- Corps : sidebar + colonne principale ------------------------------ */
      .app-body {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 0 22px;
      }

      /* Colonne de gauche (CONTEXTE + CHEMIN) retirée de l'écran : le compte et
         le statut se choisissent dans les modes opératoires (ou sur la ligne
         du haut de DÉLAI / RÉEXÉCUTION). Le DOM reste (ids protégés). */
      .sidebar {
        display: none !important;
      }

      .sidebar-ancienne {
        width: 320px;
        flex: 0 0 320px;
        min-width: 0;
        position: sticky;
        top: 74px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .main-col {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* --- LA CARTE ---------------------------------------------------------- */
      /* Toutes les grandes sections partagent exactement le même rectangle. */
      .panel,
      #categoryTabs,
      #togglesContainer,
      #cascadeFlow,
      #leafQuestionsContainer,
      #checklistContainer,
      #checklistContainerBas,
      #checklistContainerFin,
      .result-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card);
      }

      /* Une section vide ne doit pas laisser une carte fantôme à l'écran.
         (Le contenu généré par ::before ne compte pas pour :empty.) */
      #togglesContainer:empty,
      #cascadeFlow:empty,
      #leafQuestionsContainer:empty,
      #checklistContainer:empty,
      #checklistContainerBas:empty,
      #checklistContainerFin:empty {
        display: none;
      }

      .panel {
        padding: 11px 13px 12px;
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        margin-bottom: 9px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--hairline);
      }

      .panel-title::before {
        content: "";
        width: 2px;
        height: 10px;
        border-radius: 1px;
        background: var(--accent);
        flex: 0 0 auto;
      }

      .panel-title .panel-count {
        margin-left: auto;
        letter-spacing: 0.05em;
        color: var(--muted);
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }

      .crumbs {
        padding: 7px 13px;
        font-size: var(--fs-label);
      }

      #breadcrumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ---------- 5. Panneau CHEMIN / TODO ------------------------------------ */
      /* Timeline compacte : une colonne de marqueurs reliés par un filet. */
      .path-list {
        display: flex;
        flex-direction: column;
      }

      /* Une étape = une ligne « LIBELLÉ : VALEUR », exactement le format copié. */
      .path-step {
        position: relative;
        display: flex;
        align-items: flex-start;
        gap: 9px;
        width: 100%;
        text-align: left;
        padding: 3px 6px;
        border-radius: var(--r-sm);
        border: 0;
        background: none;
        font-weight: 600;
      }

      .path-text {
        flex: 1 1 auto;
        min-width: 0;
        line-height: 1.4;
        overflow-wrap: anywhere;
      }

      .path-sep {
        font-size: var(--fs-micro);
        color: var(--muted);
        opacity: 0.55;
      }

      /* Flèche de progression entre deux étapes : discrète, alignée sur la
         colonne des pastilles. */
      .path-arrow {
        font-size: var(--fs-micro);
        line-height: 1;
        color: var(--muted);
        opacity: 0.4;
        margin-left: 11px;
        padding: 1px 0;
        user-select: none;
      }

      .path-mark {
        flex: 0 0 auto;
        align-self: flex-start;
        margin-top: 2px;
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-micro);
        font-weight: 700;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--muted);
        line-height: 1;
        flex: 0 0 auto;
      }

      .path-label {
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        line-height: 1.4;
      }

      .path-value {
        font-size: var(--fs-label);
        letter-spacing: var(--ls-mid);
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      /* Étape franchie */
      .path-step.is-done .path-mark {
        border-color: var(--ok-border);
        background: var(--ok-wash);
        color: var(--ok);
      }
      .path-step.is-done .path-value {
        color: var(--muted-strong);
      }

      /* Étape en cours */
      .path-step.is-current {
        background: var(--accent-wash);
      }
      .path-step.is-current .path-mark {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      .path-step.is-current .path-label,
      .path-step.is-current .path-value {
        color: var(--accent-strong);
      }

      /* Étape restante */
      .path-step.is-todo .path-mark {
        border-style: dashed;
        border-color: var(--todo-border);
        background: none;
        color: var(--todo);
      }
      .path-step.is-todo .path-label,
      .path-step.is-todo .path-value {
        color: var(--muted);
      }
      .path-step.is-todo .path-value {
        opacity: 0.8;
      }

      /* Étape cliquable = on peut y revenir directement */
      button.path-step {
        cursor: pointer;
      }
      button.path-step:hover {
        background: var(--surface-hover);
      }
      button.path-step:hover .path-value {
        color: var(--accent-strong);
      }

      .path-empty {
        padding: 6px;
        font-size: var(--fs-label);
        color: var(--muted);
        font-weight: 600;
      }

      .path-copy-btn {
        margin-top: 10px;
        width: 100%;
        height: 2.05rem;
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--muted);
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
      }

      .path-copy-btn:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--accent-strong);
      }

      /* ---------- 6. Composants du parcours ----------------------------------- */
      /* Une ligne DANS une carte : libellé à gauche, contrôles à droite,
         séparée de la suivante par un filet. Jamais de cadre par ligne. */
      .card-row {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--hairline);
        border-radius: 0;
        padding: 9px 13px;
        min-height: 0;
      }

      .card-row:last-child {
        border-bottom: 0;
      }

      .card-row-label {
        flex: 0 0 164px;
        width: 164px;
        min-width: 0;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .card-row-content {
        flex: 1 1 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .card-row-inline {
        gap: 18px;
      }

      /* Sidebar : colonne étroite, on empile libellé puis options. */
      .context-dock {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .context-dock .card-row {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 8px 0;
      }

      .context-dock .card-row:first-child {
        padding-top: 0;
      }

      .context-dock .card-row-label {
        flex: none;
        width: 100%;
      }

      .context-dock .pill-btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 0 0.5rem;
        height: 2.05rem;
      }

      /* --- Boutons de choix -------------------------------------------------- */
      /* Normal : fond légèrement plus clair que la carte + bordure subtile.
         Survol : bordure cyan un peu plus visible, fond éclairci.
         Sélectionné : fond cyan très légèrement teinté + bordure cyan nette. */
      .pill-btn {
        height: var(--ctrl-h);
        max-width: 100%;
        padding: 0 0.8rem;
        border-radius: var(--r-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        font-size: var(--fs-choice);
        /* Même langage que « CATÉGORIE » : capitales espacées, graisse sobre. */
        letter-spacing: var(--ls-choice);
        font-weight: 600;
        line-height: 1;
      }

      .context-option {
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--ink);
      }

      .context-option:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--muted-strong);
      }

      .context-option.is-selected,
      .context-option.is-selected:hover {
        border-color: var(--accent);
        background: var(--accent-wash-2);
        color: var(--accent-strong);
        /* Graisse volontairement inchangée : la sélection se lit déjà à la
           couleur, au fond et à la bordure. Passer en gras alourdirait le texte
           et ferait légèrement bouger la mise en page à chaque clic. */
        /* Épaissit la bordure sans décaler la mise en page. */
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .context-option.is-selected .motif-code {
        background: var(--accent-wash-2);
        color: var(--accent-strong);
      }

      .pill-btn.empty-choice {
        opacity: 0.4;
        cursor: not-allowed;
        border-style: dashed;
      }

      .pill-btn .empty-tag {
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        padding: 0.1rem 0.35rem;
        border-radius: var(--r-sm);
        color: var(--todo);
        background: var(--todo-wash);
        border: 1px solid var(--todo-border);
      }

      /* MOTIF : code discret dans une pastille sobre, puis intitulé. */
      .motif-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        text-align: left;
        font-weight: inherit;
        width: auto;
      }

      .motif-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.45rem;
        height: 1.35rem;
        padding: 0 0.3rem;
        border-radius: var(--r-sm);
        background: var(--wash-hover);
        color: var(--muted);
        font-size: var(--fs-micro);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        flex: 0 0 auto;
      }

      .motif-text {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        line-height: 1;
        font-weight: inherit;
        flex: 0 1 auto;
      }

      /* --- Champs de saisie -------------------------------------------------- */
      .card-input {
        height: var(--ctrl-h);
        max-width: 100%;
        padding: 0 0.7rem;
        border-radius: var(--r-md);
        background: var(--surface-input);
        border: 1px solid var(--border);
        color: var(--muted-strong);
        outline: none;
        min-width: 11rem;
      }

      /* Les champs contiennent des DONNÉES (dates, montants, adresses) :
         graisse allégée et interlettrage de base, la lisibilité prime sur le
         style. C'est la hiérarchie voulue : chrome espacé, données sobres. */
      .card-input,
      .card-textarea {
        font-weight: 600;
        letter-spacing: var(--ls-ui);
      }

      .card-input::placeholder,
      .card-textarea::placeholder {
        color: var(--muted);
        opacity: 0.55;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 600;
      }

      .card-input:hover,
      .card-textarea:hover {
        border-color: var(--border-strong);
      }

      .card-input:focus,
      .card-textarea:focus {
        border-color: var(--accent);
        background: var(--surface-input-focus);
      }

      .card-textarea {
        min-height: 6.2rem;
        padding: 0.55rem 0.7rem;
        border-radius: var(--r-md);
        background: var(--surface-input);
        border: 1px solid var(--border);
        color: var(--muted-strong);
        outline: none;
        width: 100%;
        max-width: 100%;
        flex: 1 1 100%;
        resize: vertical;
        line-height: 1.45;
      }

      /* Zone de collage d'image (Ctrl+V) */
      .image-paste-zone {
        width: 100%;
        max-width: 100%;
        min-height: 5.2rem;
        padding: 0.55rem;
        border-radius: var(--r-md);
        border: 1px dashed var(--border-strong);
        background: var(--surface-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        flex: 1 1 100%;
      }

      .image-paste-zone:hover {
        border-color: var(--accent);
        background: var(--surface-input-focus);
      }

      .image-paste-zone:focus {
        border-color: var(--accent);
        border-style: solid;
        background: var(--surface-input-focus);
      }

      .image-paste-zone .image-placeholder {
        color: var(--muted);
        font-size: var(--fs-label);
        text-transform: none;
        letter-spacing: normal;
        font-weight: 600;
        text-align: center;
      }

      .image-paste-zone img {
        max-width: 100%;
        max-height: 28rem;
        display: block;
        border-radius: var(--r-sm);
      }

      .image-clear-btn {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: var(--overlay);
        color: var(--ink);
        font-size: var(--fs-label);
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-clear-btn:hover {
        border-color: var(--danger-border);
        background: var(--danger-wash);
        color: var(--danger-ink);
      }

      .back-arrow-btn {
        flex: 0 0 auto;
        height: var(--ctrl-h);
        width: var(--ctrl-h);
        border-radius: var(--r-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: var(--surface-raised);
        border: 1px solid var(--border);
      }

      .back-arrow-btn:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--accent-strong);
      }

      .leaf-input-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        margin-left: 0.25rem;
      }

      .leaf-input-label {
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        white-space: nowrap;
      }

      /* ---------- 7. Blocs résultat ------------------------------------------- */
      .results-stack {
        gap: 12px;
        margin-top: 4px;
      }

      /* Un résultat = une carte, comme les autres sections, mais avec un
         bandeau titre légèrement teinté cyan pour l'identifier comme le
         livrable final. */
      .result-card {
        overflow: hidden;
      }

      .result-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: var(--accent-tint);
        border-bottom: 1px solid var(--border);
      }

      .result-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--accent-strong);
        overflow-wrap: anywhere;
      }

      .result-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .result-sub {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .result-sub + .result-sub {
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
      }

      .result-content {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--muted-strong);
        line-height: 1.5;
      }

      /* Bouton COPIER : action principale, aplat cyan plein, sans halo. */
      .copy-btn {
        flex: 0 0 auto;
        height: 1.95rem;
        padding: 0 0.85rem;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        font-weight: 700;
        white-space: nowrap;
        border-radius: var(--r-md);
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }

      .copy-btn:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }

      .copy-success,
      .copy-success:hover {
        background: var(--ok) !important;
        border-color: var(--ok) !important;
        color: var(--ok-ink) !important;
      }

      /* Les textes du bloc résultat gardent leur casse d'origine (= ce qui sera
         copié dans Word) ET leur taille historique (--fs-body = 13pt).
         Ne pas toucher : c'est ce qui garantit que l'aperçu ressemble au collage. */
      .result-header,
      .result-content,
      .result-content * {
        text-transform: none !important;
        letter-spacing: normal !important;
      }

      .result-content,
      .result-content * {
        font-size: var(--fs-body);
      }

      /* Graisse normale : l'aperçu doit ressembler au texte tel qu'il arrivera
         dans Word, où seuls les <strong> ressortent. */
      .result-content {
        font-weight: 400;
      }

      /* Blocs « note » (commentaires WATT, post-it, ESDC…) : même style que
         le reste de la page (majuscules, lettres espacées, gras). Seulement à
         l'affichage : le texte copié garde sa casse d'origine. Les courriers
         (TEXTE DU COURRIER, OBJET) gardent le rendu fidèle à Word ci-dessus. */
      .result-card.is-note .result-content,
      .result-card.is-note .result-content * {
        text-transform: uppercase !important;
        letter-spacing: var(--ls-mid) !important;
        font-size: var(--fs-label);
      }

      .result-card.is-note .result-content {
        font-weight: 700;
        line-height: 1.6;
      }

      /* Styles natifs des balises de mise en forme dans l'aperçu, pour qu'il
         ressemble visuellement au rendu Word. */
      .result-content p {
        margin: 0 0 0.6em 0;
      }
      .result-content p:last-child {
        margin-bottom: 0;
      }
      .result-content ul {
        list-style: disc;
        padding-left: 1.5em;
        margin: 0 0 0.6em 0;
      }
      .result-content ul ul {
        list-style: circle;
        margin-bottom: 0;
      }
      .result-content li {
        margin: 0.2em 0;
      }
      .result-content strong,
      .result-content b {
        font-weight: 800;
      }
      .result-content em,
      .result-content i {
        font-style: italic;
      }
      .result-content u {
        text-decoration: underline;
      }
      .result-content img {
        max-width: 100%;
        height: auto;
        border-radius: var(--r-sm);
      }

      /* ---------- 7 bis. Checklist MODE OPÉRATOIRE (DCD) ----------------------- */
      /* Même carte que le reste. Une section = un titre discret + des lignes.
         Ligne cochée : texte grisé et barré, rien ne bouge (couleurs seules). */
      #checklistContainer,
      #checklistContainerBas,
      #checklistContainerFin {
        gap: 0;
      }

      /* Textes à copier DANS le bloc ANV : un peu d'air autour des cartes. */
      /* Vide (textes rangés dans les étapes) : il ne doit laisser aucune bande. */
      #processBloc > #resultsContainer {
        margin-top: 0;
      }

      #processBloc > #resultsContainer:empty {
        display: none;
      }

      #processBloc > #resultsContainer:not(:empty) {
        padding: 10px 13px;
      }

      /* ANV : une seule carte pour tout le process (étapes, motifs, fin). */
      #processBloc {
        display: flex;
        flex-direction: column;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card);
      }

      #processBloc > section {
        border: 0;
        border-radius: 0;
        box-shadow: none;
        background: transparent;
      }

      /* Pas de trait entre les morceaux du bloc : les lignes se suivent
         collées, séparées seulement par leur propre filet. */
      #processBloc > section:not(:first-child) {
        border-top: 0;
      }

      #processBloc .chk-section {
        border-bottom: 0;
      }

      /* Bandeaux de la checklist sur toute la largeur de la carte (pas un
         encadré en retrait), comme une ligne. */
      .chk-section > .chk-alert {
        margin: 0;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        padding: 9px 13px;
      }

      /* Barre MODE OPÉRATOIRE collée sous l'en-tête (58 px) quand on défile :
         compteur et progression toujours visibles. Fond opaque (teinte posée
         sur la carte) pour que le contenu ne transparaisse pas dessous. */
      .chk-head {
        position: sticky;
        top: 58px;
        z-index: 30;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 12px;
        padding: 10px 13px;
        background: linear-gradient(var(--accent-tint), var(--accent-tint)), var(--surface);
        border-bottom: 1px solid var(--border);
        border-radius: var(--r-lg) var(--r-lg) 0 0;
      }

      .chk-head-go {
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--todo);
        background: var(--todo-wash);
        border: 1px solid var(--todo-border);
        border-radius: var(--r-md);
        padding: 3px 9px;
        cursor: pointer;
      }

      .chk-head-go:hover {
        border-color: var(--todo);
      }

      /* Bilan de fin de checklist */
      /* Bilan : sur toute la largeur de la carte, comme une dernière ligne. */
      .chk-recap {
        margin: 0;
        padding: 12px 13px;
        border-radius: 0 0 var(--r-lg) var(--r-lg);
        border: 0;
        border-top: 1px solid;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .chk-recap.is-ok {
        border-color: rgba(15, 118, 110, 0.3);
        background: #dbe9e3;
        color: #0b5e58;
        /* Tout fait : titre à gauche, gros bouton RÉCAP à droite. */
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
      }

      .chk-recap.is-ok .chk-recap-go {
        align-self: center;
        padding: 9px 16px;
        font-size: var(--fs-label);
        background: #0f766e;
        border-color: #0f766e;
        color: #ffffff;
      }

      .chk-recap.is-ok .chk-recap-go:hover {
        background: #0b5e58;
      }

      .chk-recap.is-todo {
        border-color: var(--todo-border);
        background: var(--todo-wash);
        color: var(--todo);
      }

      .chk-recap-title {
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
      }

      .chk-recap-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .chk-recap-item {
        text-align: left;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: var(--ink);
        background: transparent;
        border: 0;
        padding: 3px 0;
        cursor: pointer;
      }

      .chk-recap-item::before {
        content: "○ ";
        color: var(--todo);
      }

      .chk-recap-item:hover {
        color: var(--todo);
        text-decoration: underline;
      }

      .chk-recap-go {
        align-self: flex-start;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: #ffffff;
        background: var(--todo);
        border: 1px solid var(--todo);
        border-radius: var(--r-md);
        padding: 6px 11px;
        cursor: pointer;
      }

      /* Étape atteinte via le bilan : surlignée un instant (couleur seule). */
      .chk-row.is-flash {
        background: var(--todo-wash);
        box-shadow: inset 4px 0 0 var(--todo);
      }

      .chk-head-title {
        flex: 1 1 auto;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--accent-strong);
      }

      .chk-head-count {
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: var(--todo);
        font-variant-numeric: tabular-nums;
      }

      .chk-head-count.is-complete {
        color: var(--ok);
      }

      .chk-bar {
        flex: 1 1 100%;
        height: 4px;
        border-radius: 2px;
        background: var(--hairline);
        overflow: hidden;
      }

      .chk-bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
      }

      /* Pas de marge haut / bas : deux lignes vertes de deux sections se
         touchent sans bande vide (le titre de section a son propre espace). */
      .chk-section {
        padding: 0;
        /* Pas de filet entre sections (il se voyait en trait sombre entre deux
           lignes vertes en mode nuit) : les titres de section suffisent. */
        border-bottom: 0;
      }

      .chk-section:last-child {
        border-bottom: 0;
      }

      .chk-section-title {
        padding: 9px 13px 5px;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
      }

      .chk-row {
        display: flex;
        align-items: flex-start;
        gap: 11px;
        padding: 7px 13px;
        border-bottom: 1px solid var(--hairline-soft);
      }

      .chk-row:last-child {
        border-bottom: 0;
      }

      /* Case « LIGNE SURLIGNÉE » : carré arrondi dessiné à la main
         (appearance: none efface la case du navigateur). Vide : contour gris.
         Cochée : vert canard plein + coche blanche, et toute la ligne passe
         en vert pâle avec le libellé barré. Même vert dans les deux modes. */
      .chk-box {
        appearance: none;
        -webkit-appearance: none;
        flex: 0 0 auto;
        display: inline-grid;
        place-content: center;
        width: 20px;
        height: 20px;
        margin: 0;
        border-radius: 5px;
        border: 2px solid var(--muted);
        background: var(--surface-input);
        cursor: pointer;
      }

      .chk-box:hover {
        border-color: #0f766e;
      }


      .chk-box:checked {
        background: #0f766e;
        border-color: #0f766e;
      }

      .chk-box:checked::after {
        content: "✓";
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
      }

      .chk-box:focus-visible {
        outline: 2px solid #0f766e;
        outline-offset: 2px;
      }

      /* Ligne cochée : fond vert pâle (libellé barré). Question répondue et,
         dans le bloc ANV, motif / sous-motif choisis : même fond vert, SANS
         barrer (ce sont des choix, pas des tâches). Dans cette ligne, on remet les couleurs
         du mode jour (textes foncés, champs clairs) pour que tout reste lisible
         sur le vert pâle, y compris en mode nuit. */
      .chk-row.is-checked:not(.chk-question),
      .chk-row.chk-question.is-checked,
      #processBloc .card-row.is-done {
        background: #dbe9e3;
        --surface: #fffdf8;
        --surface-raised: #f4ede1;
        --surface-hover: #ebe2d2;
        --border-strong: rgba(15, 118, 110, 0.5);
        --accent-wash-2: rgba(15, 118, 110, 0.15);
        --wash: rgba(80, 60, 30, 0.035);
        --ink: #2b2419;
        --muted: #4f6560;
        --muted-strong: #1a140c;
        --surface-input: #fffefb;
        --surface-input-focus: #ffffff;
        --border: rgba(15, 118, 110, 0.3);
        --hairline: rgba(15, 118, 110, 0.15);
        --hairline-soft: rgba(15, 118, 110, 0.12);
        --accent: #0f766e;
        --accent-strong: #0b5e58;
        --accent-ink: #ffffff;
        --accent-wash: rgba(15, 118, 110, 0.08);
        --ok: #2f855a;
        --todo: #b45309;
      }

      .chk-body {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .chk-line {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px 10px;
      }

      .chk-label {
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: var(--muted-strong);
        line-height: 1.4;
        cursor: pointer;
      }

      .chk-question .chk-label {
        cursor: default;
        margin-right: 4px;
      }

      .chk-row.is-checked:not(.chk-question) .chk-label {
        color: #0b5e58;
        text-decoration: line-through;
        text-decoration-color: #0f766e;
      }

      /* Phrases d'aide : assez visibles pour ne pas passer à côté
         (filet cyan à gauche, texte clair, taille des libellés). */
      .chk-aide {
        font-size: var(--fs-label);
        letter-spacing: 0.04em;
        color: var(--ink);
        line-height: 1.45;
        padding: 2px 0 2px 9px;
        border-left: 2px solid var(--accent);
      }

      .chk-fields {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 18px;
        padding: 10px;
        border: 1px dashed var(--todo);
        border-radius: var(--r-md);
        background: var(--todo-wash);
      }

      .chk-fields .card-input.is-large {
        width: 22rem;
      }

      /* Adresse sur plusieurs lignes : champ assez large pour une adresse. */
      .chk-fields .card-textarea {
        min-width: 18rem;
        min-height: 4.6rem;
      }

      .chk-fields.is-filled {
        border-style: solid;
        border-color: var(--ok);
        background: var(--ok-wash);
      }

      .chk-fields-tag {
        flex-basis: 100%;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--todo);
      }

      .chk-fields.is-filled .chk-fields-tag {
        color: var(--ok);
      }

      .chk-fields-row {
        padding-top: 9px;
        padding-bottom: 9px;
      }

      .chk-alert {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
      }

      .chk-alert > span {
        flex: 1 1 260px;
      }

      /* Bandeau rouge = on s'arrête là : repérable avant même de le lire. */
      .chk-alert.is-danger > span::before {
        content: "⛔ ";
      }

      /* Bandeau dont l'action est faite : vert, avec une coche. */
      .chk-alert.is-ok {
        background: #dbe9e3;
        color: #0b5e58;
        border-color: rgba(15, 118, 110, 0.3);
      }

      .chk-alert.is-ok > span::before {
        content: "✓ ";
      }

      /* Bandeau orange = attention / action à faire (pas un arrêt). */
      .chk-alert.is-warning > span::before {
        content: "⚠ ";
      }

      .chk-tag {
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--todo);
        border: 1px solid var(--todo);
        border-radius: var(--r-md);
        padding: 1px 6px;
      }

      .chk-tools {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      /* Texte à copier : on garde sa casse réelle (= ce qui sera collé). */
      .chk-copy {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 6px 5px 10px;
        border-radius: var(--r-md);
        background: var(--surface-input);
        border: 1px solid var(--border);
      }

      .chk-copy-rappel {
        display: inline-block;
        margin-left: 6px;
        padding: 1px 7px;
        border-radius: var(--r-md);
        border: 1px solid var(--todo);
        background: var(--todo-wash);
        color: var(--todo);
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        white-space: nowrap;
      }

      .chk-copy-label {
        flex: 0 0 auto;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
      }

      /* Textes à copier de la checklist : même style que la page (visuel
         seulement, la copie garde le texte d'origine). */
      .chk-copy-text {
        flex: 1 1 auto;
        min-width: 0;
        text-transform: uppercase;
        letter-spacing: var(--ls-mid);
        font-size: var(--fs-label);
        font-weight: 700;
        line-height: 1.5;
        color: var(--ink);
        overflow-wrap: anywhere;
      }

      .chk-link {
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--accent);
        text-decoration: none;
        border: 1px solid var(--accent);
        border-radius: var(--r-md);
        padding: 3px 8px;
        white-space: nowrap;
      }

      .chk-link:hover {
        background: var(--accent-wash);
      }

      /* ---------- Tutos en images (bouton « i » + panneau accroché) -------- */
      .tuto-wrap {
        position: relative;
        display: inline-flex;
        vertical-align: middle;
        margin-left: 6px;
      }

      .tuto-i {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 1.5px solid var(--accent);
        background: transparent;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        font-style: italic;
        text-transform: lowercase;
        letter-spacing: 0;
        display: grid;
        place-content: center;
        padding: 0;
        cursor: pointer;
      }

      .tuto-i:hover {
        background: var(--accent);
        color: var(--accent-ink);
      }

      /* « i » du tuto en cours de lecture : rouge plein + anneau. */
      .tuto-i.is-on {
        background: var(--danger);
        border-color: var(--danger);
        color: #ffffff;
        box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--danger);
      }

      /* Panneau tout à droite, à hauteur du « i » ; déplaçable par son titre. */
      .tuto-panel {
        position: absolute;
        z-index: 45;
        right: 16px;
        width: 360px;
        max-height: 75vh;
        overflow: auto;
        padding: 12px 12px 14px;
        background: var(--surface);
        border: 1.5px solid var(--accent);
        border-radius: var(--r-lg);
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.28);
        text-transform: none;
        letter-spacing: 0.02em;
        cursor: default;
        text-align: left;
      }

      .tuto-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: -12px -12px 10px;
        padding: 10px 12px 8px;
        border-bottom: 1px solid var(--hairline);
        background: var(--accent-tint);
        cursor: move;
        user-select: none;
      }

      .tuto-head .tuto-x {
        cursor: pointer;
      }

      .tuto-play {
        display: block;
        width: 100%;
        margin: 0 0 10px;
        padding: 7px 10px;
        border: 1.5px solid var(--accent);
        border-radius: var(--r-sm);
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        letter-spacing: 0.1em;
        cursor: pointer;
      }

      .tuto-big-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .tuto-big-dots button {
        width: 14px;
        height: 14px;
        padding: 0;
        border-radius: 50%;
        border: 2px solid #ffffff;
        background: transparent;
        cursor: pointer;
      }

      .tuto-big-dots button.is-done {
        background: rgba(255, 255, 255, 0.55);
      }

      .tuto-big-dots button.is-here {
        background: var(--accent);
        border-color: #ffffff;
        box-shadow: 0 0 0 2px var(--accent);
      }

      .tuto-title {
        flex: 1 1 auto;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--accent-strong);
        text-transform: uppercase;
      }

      .tuto-x {
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--ink);
        border-radius: var(--r-sm);
        font-weight: 700;
        padding: 1px 8px;
        cursor: pointer;
      }

      .tuto-step {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin-top: 10px;
      }

      .tuto-n {
        flex: 0 0 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        display: grid;
        place-content: center;
        font-weight: 700;
        font-size: 11px;
      }

      .tuto-shot-wrap {
        position: relative;
      }

      .tuto-shot {
        display: block;
        width: 300px;
        max-width: 100%;
        height: auto;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: #ffffff;
      }

      .tuto-zoom {
        position: absolute;
        top: 4px;
        right: 4px;
        border: 0;
        border-radius: var(--r-sm);
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 700;
        padding: 1px 6px;
        cursor: pointer;
      }

      .tuto-cap {
        margin-top: 4px;
        font-size: var(--fs-label);
        line-height: 1.35;
        color: var(--ink);
      }

      /* Image en grand (bouton ⤢) */
      .tuto-big {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(0, 0, 0, 0.78);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .tuto-big.hidden {
        display: none;
      }

      .tuto-big-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        max-width: 86vw;
      }

      .tuto-big img {
        max-width: 86vw;
        max-height: 74vh;
        border-radius: var(--r-md);
        background: #ffffff;
      }

      .tuto-big-count {
        padding: 4px 12px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: var(--fs-micro);
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .tuto-big-cap {
        max-width: 70vw;
        padding: 8px 14px;
        border-radius: var(--r-md);
        background: var(--surface);
        color: var(--ink);
        font-weight: 700;
        text-align: center;
      }

      /* Flèches haut / bas, colonne à droite. */
      .tuto-big-nav {
        position: fixed;
        right: 22px;
        top: 50%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: -54px;
      }

      .tuto-big-nav button {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--accent);
        background: var(--surface);
        color: var(--accent);
        font-size: 20px;
        font-weight: 800;
        cursor: pointer;
      }

      .tuto-big-nav button:hover {
        background: var(--accent);
        color: var(--accent-ink);
      }

      .tuto-big-nav button:disabled {
        opacity: 0.35;
        cursor: default;
        background: var(--surface);
        color: var(--accent);
      }

      .tuto-big-hint {
        position: fixed;
        bottom: 14px;
        left: 0;
        right: 0;
        text-align: center;
        color: #ffffff;
        font-size: var(--fs-micro);
        letter-spacing: 0.12em;
        opacity: 0.8;
      }

      /* Page de fin. */
      .tuto-big-end {
        min-width: 340px;
        padding: 30px 34px;
        border-radius: var(--r-lg);
        background: var(--surface);
        border: 2px solid var(--accent);
        text-align: center;
        color: var(--ink);
      }

      .tuto-big-end .ok {
        width: 64px;
        height: 64px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 34px;
        line-height: 64px;
        font-weight: 800;
      }

      .tuto-big-end .t1 {
        font-size: var(--fs-title);
        font-weight: 800;
        letter-spacing: 0.12em;
      }

      .tuto-big-end .t2 {
        margin: 6px 0 18px;
        color: var(--muted);
      }

      .tuto-big-end .row {
        display: flex;
        gap: 10px;
        justify-content: center;
      }

      .tuto-shot {
        cursor: zoom-in;
      }

      .tuto-big-x {
        position: fixed;
        top: 16px;
        right: 16px;
      }

      /* Bouton d'action dans une ligne de checklist (ex : FAIRE L'AMIABLE RELDET). */
      .chk-action {
        margin-left: 18px;
        min-height: 2.4rem;
        padding: 0 16px;
        border: 1.5px solid var(--danger);
        border-radius: var(--r-md);
        background: var(--danger);
        color: #ffffff;
        font-weight: 800;
        letter-spacing: var(--ls-mid);
        cursor: pointer;
      }

      .chk-action:hover {
        box-shadow: 0 0 0 3px var(--danger-wash), 0 0 0 4px var(--danger-border);
      }

      #toggleEtapes:not(:empty),
      #toggleEtapesApres:not(:empty) {
        padding: 0;
        border-bottom: 0;
      }

      /* Bandeau d'un toggle actif, à droite de son bouton (même ligne). */
      .toggle-bandeau {
        flex: 1 1 360px;
        margin: 0;
        padding: 6px 6px 6px 12px;
      }

      .chk-aide-lien {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 10px;
      }

      /* Petites cases de contrôle sous une étape (ex : documents rattachés). */
      .chk-sous {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 18px;
        padding-left: 2px;
      }

      .chk-sous-item {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: var(--muted-strong);
        cursor: pointer;
      }

      .chk-sous-item input {
        width: 15px;
        height: 15px;
        margin: 0;
        accent-color: #0f766e;
      }

      .chk-sous-item.is-on {
        color: #0b5e58;
      }

      .chk-ajout.is-fini {
        background: #dbe9e3;
        align-items: center;
        --ink: #2b2419;
        --surface-raised: #f4ede1;
        --surface-hover: #ebe2d2;
        --border: rgba(15, 118, 110, 0.3);
      }

      .chk-ajout-ok {
        flex: 1 1 auto;
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: #0b5e58;
      }

      .chk-ajout {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0;
        padding: 8px 13px;
        border-top: 1px solid var(--hairline);
      }

      /* Groupe (CONTRAINTE 1, COURRIER AUX HÉRITIERS…) : pleine largeur, collé
         aux lignes autour, juste un bandeau titre (pas d'encadré en retrait). */
      .chk-group {
        margin: 0;
        border: 0;
        /* Pas de trait au-dessus : un trait sur fond transparent laisse voir
           le fond sombre de la carte (mode nuit) entre deux lignes vertes. */
        border-top: 0;
        border-radius: 0;
        background: transparent;
      }

      .chk-group-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px 10px;
        padding: 8px 13px;
        background: var(--wash);
        border-bottom: 1px solid var(--hairline);
      }

      /* Groupe terminé : bandeau titre vert, comme les lignes cochées. */
      .chk-group.is-done > .chk-group-head,
      .chk-group.is-done > .chk-aide {
        background: #dbe9e3;
        --accent: #0f766e;
        --surface: #fffdf8;
        --surface-raised: #f4ede1;
        --accent-strong: #0b5e58;
        --muted: #4f6560;
        --ink: #2b2419;
        --hairline: rgba(15, 118, 110, 0.15);
      }

      .chk-group.is-done > .chk-group-head .chk-group-title::before {
        content: "✓ ";
      }

      .chk-group-title {
        flex: 1 1 auto;
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        color: var(--accent-strong);
      }

      .chk-group > .chk-aide {
        padding: 6px 13px;
        border-left: 0;
      }

      .chk-group .chk-row {
        padding-left: 10px;
        padding-right: 10px;
      }

      .chk-alert {
        margin: 6px 13px;
        padding: 8px 11px;
        border-radius: var(--r-md);
        border: 1px solid;
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        line-height: 1.45;
      }

      .chk-alert.is-danger {
        color: var(--danger);
        border-color: var(--danger);
        background: var(--danger-wash);
      }

      .chk-alert.is-warning {
        color: var(--todo);
        border-color: var(--todo);
        background: var(--todo-wash);
      }

      .chk-alert.is-info {
        color: var(--muted-strong);
        border-color: var(--border-strong);
        background: var(--wash);
      }

      /* ---------- 8. Toast ----------------------------------------------------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        margin-left: -170px;
        width: 340px;
        max-width: calc(100vw - 32px);
        text-align: center;
        z-index: 60;
        padding: 11px 14px;
        border-radius: var(--r-lg);
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
        color: var(--muted-strong);
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      }

      /* ---------- 9. Responsive ------------------------------------------------ */
      @media (max-width: 1400px) {
        .sidebar {
          width: 290px;
          flex-basis: 290px;
        }
        .card-row-label {
          flex-basis: 148px;
          width: 148px;
        }
      }

      @media (max-width: 1200px) {
        .app-header,
        .app-body {
          padding-left: 16px;
          padding-right: 16px;
        }
        .app-header::after {
          left: 16px;
        }
        .sidebar {
          width: 260px;
          flex-basis: 260px;
        }
        .card-row-label {
          flex-basis: 132px;
          width: 132px;
        }
        .pill-btn {
          padding: 0 0.65rem;
        }
      }

      @media (max-width: 980px) {
        .app-body {
          flex-direction: column;
          gap: 10px;
        }
        .sidebar {
          position: static;
          width: 100%;
          flex-basis: auto;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .sidebar .panel {
          flex: 1 1 260px;
          min-width: 0;
        }
        .main-col {
          width: 100%;
        }
      }

      @media (max-width: 680px) {
        .app-header {
          height: auto;
          flex-wrap: wrap;
          gap: 8px;
          padding: 10px 12px;
        }
        .app-header::after {
          display: none;
        }
        .brand-sub {
          display: none;
        }
        .header-actions {
          width: 100%;
          margin-left: 0;
        }
        .hdr-btn {
          flex: 1 1 0;
          justify-content: center;
          min-width: 0;
        }
        .app-body {
          padding-left: 12px;
          padding-right: 12px;
        }
        .card-row {
          flex-direction: column;
          align-items: stretch;
          gap: 7px;
        }
        .card-row-label {
          flex: none;
          width: 100%;
        }
        .card-input {
          min-width: 0;
          width: 100%;
        }
        .result-sub {
          flex-direction: column;
        }
        .copy-btn {
          align-self: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <div class="app page-shell">

      <header class="app-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>LOGIX</div>
        <div class="brand-sub">OUTIL RECOUVREMENT</div>
        <div class="header-actions">
          <button type="button" id="themeBtn" class="hdr-btn"
            title="Basculer entre le mode jour (clair) et le mode nuit (sombre)">

            title="Revenir d'un seul niveau en arrière (conserve COMPTE et STATUT)">

          </button>
          <button type="button" id="resetBtn" class="hdr-btn hdr-btn-strong"
            title="Nouveau dossier : remet le parcours à zéro mais conserve COMPTE et STATUT">

      <div class="app-body">

        <aside class="sidebar">
          <section class="panel">
            <h2 class="panel-title">CONTEXTE</h2>
            <div id="contextPanel" class="context-dock"></div>
          </section>

          <section class="panel">

            <div id="pathPanel" class="path-list"></div>
            <button type="button" id="copyPathBtn" class="path-copy-btn"
              title="Copier le chemin actuel dans le presse-papier">

            </button>

        <div class="main-col">
          <section id="breadcrumbsSection" class="hidden">

            </div>
          </section>

          <section id="categoryTabs"></section>
          <section id="questionZone" class="hidden"></section>

          <section id="entryLayout">
            <section id="mainPanel" class="stack">
              <section id="inlineTitleContainer"></section>
              <section id="togglesContainer" class="stack"></section>
              <section id="cascadeFlow" class="stack"></section>
              <section id="leafQuestionsContainer" class="stack"></section>
              <section id="checklistContainer" class="stack"></section>
              <!-- Conservés pour compat (vides désormais, gérés via cascadeFlow) -->
              <section id="inputsContainer" class="hidden"></section>
              <section id="choicesHeader" class="hidden"></section>
              <section id="choicesContainer" class="hidden"></section>

          <section id="resultsContainer" class="stack results-stack"></section>

      </div>
    </div>

    <script src="./data.js"></script>
    <!-- Tutos en images : dossier tutos/ gardé sur le PC (jamais envoyé sur
         GitHub, voir .gitignore). S'il n'existe pas, aucun « i » n'apparaît. -->
    <script src="./tutos/tutos.js" onerror="window.logixTutos = window.logixTutos || {}"></script>
    <script>
      (function () {
        if (!window.treeData) {
          alert("Erreur: treeData est introuvable. Verifiez le fichier data.js");
          return;
        }

        const questionZone = document.getElementById("questionZone");
        const inlineTitleContainer = document.getElementById("inlineTitleContainer");
        const choicesContainer = document.getElementById("choicesContainer");
        const choicesHeader = document.getElementById("choicesHeader");
        const inputsContainer = document.getElementById("inputsContainer");
        const togglesContainer = document.getElementById("togglesContainer");
        const cascadeFlow = document.getElementById("cascadeFlow");
        const contextPanel = document.getElementById("contextPanel");
        const entryLayout = document.getElementById("entryLayout");
        const resultsContainer = document.getElementById("resultsContainer");
        const breadcrumbsSection = document.getElementById("breadcrumbsSection");
        const breadcrumbs = document.getElementById("breadcrumbs");
        const categoryTabs = document.getElementById("categoryTabs");
        const leafQuestionsContainer = document.getElementById("leafQuestionsContainer");
        // Sections de checklist « bas: true » : après le motif / sous-motif.
        const checklistBas = document.createElement("section");
        checklistBas.id = "checklistContainerBas";
        checklistBas.className = "stack";
        leafQuestionsContainer.after(checklistBas);
        // Bloc unique du mode opératoire ANV (créé une fois, inséré au besoin).
        const processBloc = document.createElement("div");
        processBloc.id = "processBloc";
        // Étapes à cocher d'un toggle actif (whenOn.etapes), dans la barre du haut.
        const toggleEtapes = document.createElement("div");
        toggleEtapes.id = "toggleEtapes";
        // … et celles affichées SOUS ses questions (whenOn.etapesApres).
        const toggleEtapesApres = document.createElement("div");
        toggleEtapesApres.id = "toggleEtapesApres";
        // … et celles de fin (whenOn.etapesFin), sous les choix de la cascade.
        const toggleEtapesFin = document.createElement("div");
        toggleEtapesFin.id = "toggleEtapesFin";
        // Sections « fin: true » : après les textes à copier, dans le bloc.
        const checklistFin = document.createElement("section");
        checklistFin.id = "checklistContainerFin";
        checklistFin.className = "stack";
        const checklistContainer = document.getElementById("checklistContainer");
        const pathPanel = document.getElementById("pathPanel");
        const pathCount = document.getElementById("pathCount");
        const backBtn = document.getElementById("backBtn");
        const resetBtn = document.getElementById("resetBtn");
        const globalContextOptions = window.globalContextOptions || [];

        // Libellé de la rangée CATÉGORIE. Défini UNE seule fois et partagé par la
        // cascade et le panneau CHEMIN, pour qu'ils ne puissent jamais diverger.
        // Si treeData reçoit un jour un choicesTitle à la racine, il fait autorité.
        const CATEGORY_LABEL = (window.treeData && window.treeData.choicesTitle) || "CATÉGORIE";

        // trail = historique de navigation
        // Chaque entree: { label: "Texte du choix", node: objet suite }
        let trail = [{ label: "", node: window.treeData }];
        let globalSelections = {};
        let nodeInputs = {};
        let nodeSelections = {};
        let inlineRootNode = null;
        let inlineChain = [];
        let leafAnswers = {};
        let leafInputs = {};
        let lastScrollTargetId = null;
        // Stack des toggles activés (ex: AMIABLE RELDET, puis DETTE NON EXIGIBLE
        // imbriqué dedans). Chaque entrée = { savedRootNode, toggle }. Quand on
        // active un toggle, on push (avec savedRootNode = inlineRootNode courant)
        // puis on swap inlineRootNode vers toggle.whenOn. Quand on désactive, on
        // pop tout depuis cet idx et on restore le savedRootNode.
        let activeToggleStack = [];

        // Réponses aux topQuestions (questions optionnelles affichées dans la rangée
        // des toggles). Format : { questionId: "oui" | "non" | undefined }.
        // Utilisé par substituteTemplate pour adapter globalement le résultat.
        let topAnswers = {};

        // État de la checklist du MODE OPÉRATOIRE (catégorie DCD).
        // Format : { idEtape: true | false, idQuestion: "oui" | "non" }.
        // Remis à zéro par RECOMMENCER et au changement de catégorie.
        let checkState = {};

        function saveNodeInputValue(inputId, value) {
          nodeInputs[inputId] = value;
          noterHeure("input-" + inputId, String(value || "").trim() !== "");
        }

        function saveNodeSelection(selectionKey, value) {
          nodeSelections[selectionKey] = value;
        }

        function getCurrentNode() {
          return trail[trail.length - 1].node;
        }

        function getDisplayNode() {
          return inlineRootNode || getCurrentNode();
        }

        function escapeHtml(input) {
          return String(input)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function isChoiceEmpty(option) {
          if (!option || !option.suite || typeof option.suite !== "object") return true;
          const hasChoix = Array.isArray(option.suite.choix) && option.suite.choix.length > 0;
          const hasResultats = Array.isArray(option.suite.resultats) && option.suite.resultats.length > 0;
          const hasChecklist = !!option.suite.checklist;
          return !hasChoix && !hasResultats && !hasChecklist;
        }

        function showToast(message, duration) {
          const existing = document.getElementById("taff-toast");
          if (existing) existing.remove();
          const toast = document.createElement("div");
          toast.id = "taff-toast";
          toast.textContent = message;
          toast.className = "toast";
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), duration || 1800);
        }

        function stripHtmlToText(html) {
          // Conversion robuste HTML → texte avec préservation des sauts de ligne.
          // (Important : Word/Outlook collent parfois en text/plain plutôt qu'en
          // text/html selon la config — il faut donc que le text/plain soit propre.)
          return String(html || "")
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<\/p>\s*<p[^>]*>/gi, "\n\n")
            .replace(/<li[^>]*>/gi, "\n- ")
            .replace(/<\/li>/gi, "")
            .replace(/<\/?ul[^>]*>/gi, "\n")
            .replace(/<\/?ol[^>]*>/gi, "\n")
            .replace(/<\/?[^>]+>/g, "")
            .replace(/&nbsp;/gi, " ")
            .replace(/&amp;/gi, "&")
            .replace(/&lt;/gi, "<")
            .replace(/&gt;/gi, ">")
            .replace(/&quot;/gi, '"')
            .replace(/&#039;/gi, "'");
        }

        function splitMotifLabel(label) {
          if (!label) return { code: "", text: "" };
          const parts = label.split(" - ");
          if (parts.length < 2) return { code: "", text: label };
          return { code: parts[0], text: parts.slice(1).join(" - ") };
        }

        // Échappement des VALEURS substituées (et non du template).
        // Le template lui-même (resultats[].texte) reste du HTML riche volontaire :
        // c'est ce qui permet au bouton Copier de coller du gras/souligné dans Word.
        // Mais ce que TU tapes (ADRESSE, ÉCRITURES…) ne doit jamais être interprété
        // comme du HTML. On n'échappe pas l'apostrophe : elle est très fréquente en
        // français et sans danger dans un attribut délimité par des guillemets.
        function escapeValue(input) {
          return String(input)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function substituteTemplate(template, vars) {
          if (typeof template !== "string") return "";
          let result = template.replace(/\{\{([^}]+)\}\}/g, (match, key) => {
            const val = vars[key.trim()];
            if (val == null) return "";
            // On convertit les sauts de ligne en <br> pour le rendu HTML
            // (utile pour les inputs de type textarea, ex: ÉCRITURES).
            return escapeValue(val).replaceAll("\n", "<br>");
          });
          // Post-traitement : convertit toute date au format JJ/MM/AAAA en JJ/MM/AA.
          // Skip dans la catégorie RÉEXÉCUTION (où on veut au contraire 4 chiffres
          // pour la date de prescription) et dans DCD (date d'effet ADM NV en
          // JJ/MM/AAAA, comme dans le mode opératoire).
          if (vars.__category !== "reexecution" && vars.__category !== "dcd") {
            // Une image collée est stockée en data URL base64. Or le base64 contient
            // des "/" et des chiffres : une suite du type 12/34/5678 peut y apparaître
