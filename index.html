        }

        // Grande image (bouton ⤢) : une seule fenêtre, créée une fois.
        const tutoBig = document.createElement("div");
        tutoBig.className = "tuto-big hidden";
        tutoBig.innerHTML = '<button type="button" class="tuto-x tuto-big-x">✕ FERMER</button>' +
          '<div class="tuto-big-box"></div>' +
          '<div class="tuto-big-nav"><button type="button" data-go="-1" title="Étape précédente (↑)">▲</button>' +
          '<button type="button" data-go="1" title="Étape suivante (↓)">▼</button></div>' +
          '<div class="tuto-big-hint">MOLETTE OU FLÈCHES ↑ ↓ POUR CHANGER D’ÉTAPE · ÉCHAP POUR FERMER</div>';
        document.body.appendChild(tutoBig);
        const tutoBigBox = tutoBig.querySelector(".tuto-big-box");
        // Visionneuse : les écrans du tuto ouvert, un par un, puis une page de fin.
        let bigEtapes = [], bigIdx = 0, bigWheelAt = 0, bigKey = null;
        // Dernière étape vue par tuto (le temps de la session) : on reprend là.
        const tutoVu = {};

        function closeBig() {
          tutoBig.classList.add("hidden");
          // Le bouton « reprendre » du panneau suit la dernière étape vue.
          const play = document.querySelector(".tuto-play");
          if (play && bigKey === openTutoKey) play.textContent = playLabel(bigKey);
        }

        function playLabel(key) {
          const n = tutoVu[key] || 0;
          return n > 0 ? "▶ REPRENDRE À L’ÉTAPE " + (n + 1) : "▶ VOIR EN GRAND, ÉTAPE PAR ÉTAPE";
        }

        function showBig(i) {
          bigIdx = Math.max(0, Math.min(i, bigEtapes.length));
          // Arrivé à la fin : la prochaine fois, on recommence au début.
          if (bigKey) tutoVu[bigKey] = bigIdx === bigEtapes.length ? 0 : bigIdx;
          tutoBigBox.innerHTML = "";
          if (bigIdx === bigEtapes.length) {
            const end = document.createElement("div");
            end.className = "tuto-big-end";
            end.innerHTML = '<div class="ok">✓</div><div class="t1">C’EST BON !</div>' +
              '<div class="t2">Tu as vu les ' + bigEtapes.length + ' étape(s) de ce tuto.</div>' +
              '<div class="row"><button type="button" class="tuto-x" data-act="debut">↺ REVOIR DEPUIS LE DÉBUT</button>' +
              '<button type="button" class="tuto-x" data-act="fin">✓ FERMER</button></div>';
            tutoBigBox.appendChild(end);
          } else {
            const e = bigEtapes[bigIdx];
            const count = document.createElement("div");
            count.className = "tuto-big-count";
            count.textContent = "ÉTAPE " + (bigIdx + 1) + " / " + bigEtapes.length;
            const img = document.createElement("img");
            img.src = e.src;
            img.alt = e.texte || "";
            tutoBigBox.appendChild(count);
            tutoBigBox.appendChild(img);
            if (e.texte) {
              const cap = document.createElement("div");
              cap.className = "tuto-big-cap";
              cap.textContent = e.texte;
              tutoBigBox.appendChild(cap);
            }
          }
          // Points de progression : un par étape + un pour la page de fin.
          const dots = document.createElement("div");
          dots.className = "tuto-big-dots";
          for (let k = 0; k <= bigEtapes.length; k++) {
            const d = document.createElement("button");
            d.type = "button";
            d.dataset.dot = String(k);
            d.title = k === bigEtapes.length ? "Fin" : "Étape " + (k + 1);
            if (k < bigIdx) d.classList.add("is-done");
            if (k === bigIdx) d.classList.add("is-here");
            dots.appendChild(d);
          }
          tutoBigBox.appendChild(dots);
          tutoBig.querySelector('[data-go="-1"]').disabled = bigIdx === 0;
          tutoBig.querySelector('[data-go="1"]').disabled = bigIdx === bigEtapes.length;
        }

        function openBig(key, etapes, i) {
          bigKey = key;
          bigEtapes = etapes;
          tutoBig.classList.remove("hidden");
          showBig(i);
        }

        tutoBig.addEventListener("click", (e) => {
          const go = e.target.closest("[data-go]");
          const act = e.target.closest("[data-act]");
          const dot = e.target.closest("[data-dot]");
          if (dot) showBig(Number(dot.dataset.dot));
          else if (go) showBig(bigIdx + Number(go.dataset.go));
          else if (act && act.dataset.act === "debut") showBig(0);
          else if (act || e.target === tutoBig || e.target.classList.contains("tuto-big-x")) closeBig();
        });
        // Molette : un geste = une étape (on ignore la suite du même geste).
        tutoBig.addEventListener("wheel", (e) => {
          e.preventDefault();
          const now = Date.now();
          if (now - bigWheelAt < 450 || Math.abs(e.deltaY) < 4) return;
          bigWheelAt = now;
          showBig(bigIdx + (e.deltaY > 0 ? 1 : -1));
        }, { passive: false });
        document.addEventListener("keydown", (e) => {
          if (tutoBig.classList.contains("hidden")) return;
          if (["ArrowDown", "ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); showBig(bigIdx + 1); }
          else if (["ArrowUp", "ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); showBig(bigIdx - 1); }
        });

        let tutoWrap = null;
        // Position choisie en glissant le panneau (coordonnées écran), gardée
        // pour la session ; null = place par défaut (à droite, hauteur du « i »).
        let tutoPos = null;

        function placeTuto() {
          const panel = document.querySelector(".tuto-panel");
          if (!panel || !tutoWrap || !tutoWrap.isConnected) return;
          const vw = document.documentElement.clientWidth, vh = window.innerHeight;
          if (tutoPos) {
            panel.style.position = "fixed";
            panel.style.right = "auto";
            panel.style.left = Math.max(0, Math.min(tutoPos.left, vw - 80)) + "px";
            panel.style.top = Math.max(0, Math.min(tutoPos.top, vh - 40)) + "px";
            return;
          }
          panel.style.position = "";
          panel.style.left = "";
          panel.style.right = "";
          const r = tutoWrap.getBoundingClientRect();
          const sy = window.scrollY;
          const panelLeft = vw - 16 - panel.offsetWidth;
          // Écran trop étroit : le panneau passe sous le « i ».
          panel.style.top = (r.right + 40 <= panelLeft ? Math.max(sy + 8, r.top + sy - 14) : r.bottom + sy + 10) + "px";
        }
        window.addEventListener("resize", placeTuto);

        // Glisser le titre du panneau = le déplacer ; double-clic = remettre à droite.
        function makeDraggable(panel, head) {
          head.title = "Glisser pour déplacer · double-clic pour remettre à droite";
          head.addEventListener("mousedown", (e) => {
            if (e.button !== 0 || e.target.closest("button")) return;
            e.preventDefault();
            const r = panel.getBoundingClientRect();
            const dx = e.clientX - r.left, dy = e.clientY - r.top;
            const move = (ev) => { tutoPos = { left: ev.clientX - dx, top: ev.clientY - dy }; placeTuto(); };
            const up = () => { document.removeEventListener("mousemove", move); document.removeEventListener("mouseup", up); };
            document.addEventListener("mousemove", move);
            document.addEventListener("mouseup", up);
          });
          head.addEventListener("dblclick", (e) => {
            if (e.target.closest("button")) return;
            tutoPos = null;
            placeTuto();
          });
        }

        function closeTutos() {
          openTutoKey = null;
          tutoWrap = null;
          document.querySelectorAll(".tuto-panel").forEach((p) => p.remove());
          document.querySelectorAll(".tuto-i.is-on").forEach((b) => b.classList.remove("is-on"));
        }

        function openTutoPanel(wrap, key) {
          const t = getTuto(key);
          if (!t) return;
          const panel = document.createElement("div");
          panel.className = "tuto-panel";
          const head = document.createElement("div");
          head.className = "tuto-head";
          const title = document.createElement("span");
          title.className = "tuto-title";
          title.textContent = t.titre || "TUTO";
          head.appendChild(title);
          const x = document.createElement("button");
          x.type = "button";
          x.className = "tuto-x";
          x.textContent = "✕";
          x.setAttribute("aria-label", "Fermer le tuto");
          x.addEventListener("click", (e) => { e.stopPropagation(); closeTutos(); });
          head.appendChild(x);
          panel.appendChild(head);
          makeDraggable(panel, head);
          const etapesBig = t.etapes.filter((e) => e.image).map((e) => ({ src: "tutos/" + e.image, texte: e.texte || "" }));
          let nImg = 0;
          if (etapesBig.length) {
            const play = document.createElement("button");
            play.type = "button";
            play.className = "tuto-play";
            play.textContent = playLabel(key);
            play.addEventListener("click", (e) => { e.stopPropagation(); openBig(key, etapesBig, tutoVu[key] || 0); });
            panel.appendChild(play);
          }
          t.etapes.forEach((etape, i) => {
            const step = document.createElement("div");
            step.className = "tuto-step";
            const n = document.createElement("span");
            n.className = "tuto-n";
            n.textContent = String(i + 1);
            step.appendChild(n);
            const box = document.createElement("div");
            if (etape.image) {
              const sw = document.createElement("div");
              sw.className = "tuto-shot-wrap";
              const img = document.createElement("img");
              img.className = "tuto-shot";
              img.alt = etape.texte || "";
              img.src = "tutos/" + etape.image;
              const pos = nImg++;
              img.title = "Cliquer pour agrandir";
              img.addEventListener("click", (e) => { e.stopPropagation(); openBig(key, etapesBig, pos); });
              sw.appendChild(img);
              const zoom = document.createElement("button");
              zoom.type = "button";
              zoom.className = "tuto-zoom";
              zoom.textContent = "⤢";
              zoom.title = "Voir en grand";
              zoom.addEventListener("click", (e) => {
                e.stopPropagation();
                openBig(key, etapesBig, pos);
              });
              sw.appendChild(zoom);
              box.appendChild(sw);
            }
            // La phrase est facultative : pas de légende vide.
            if (etape.texte) {
              const cap = document.createElement("div");
              cap.className = "tuto-cap";
              cap.textContent = etape.texte;
              box.appendChild(cap);
            }
            step.appendChild(box);
            panel.appendChild(step);
          });
          panel.addEventListener("click", (e) => e.stopPropagation());
          document.body.appendChild(panel);
          tutoWrap = wrap;
          placeTuto();
        }

        // Renvoie le bouton « i » d'une clé, ou null si aucun tuto n'existe.
        function makeTutoButton(key) {
          if (!getTuto(key)) return null;
          const wrap = document.createElement("span");
          wrap.className = "tuto-wrap";
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tuto-i";
          btn.textContent = "i";
          btn.title = "Voir le tuto en images";
          btn.setAttribute("aria-label", "Voir le tuto en images");
          btn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            const dejaOuvert = openTutoKey === key;
            closeTutos();
            if (!dejaOuvert) {
              openTutoKey = key;
              btn.classList.add("is-on");
              openTutoPanel(wrap, key);
            }
          });
          wrap.appendChild(btn);
          // La page s'est redessinée alors que ce tuto était ouvert : on le rouvre.
          if (openTutoKey === key) {
            btn.classList.add("is-on");
            setTimeout(() => { if (wrap.isConnected && openTutoKey === key) { document.querySelectorAll(".tuto-panel").forEach((p) => p.remove()); openTutoPanel(wrap, key); } }, 0);
          }
          return wrap;
        }

        document.addEventListener("keydown", (e) => {
          if (e.key !== "Escape") return;
          if (!tutoBig.classList.contains("hidden")) closeBig();
          else if (openTutoKey) closeTutos();
        });

        // ====================================================================
        // MODE OPÉRATOIRE : checklist (catégorie DCD)
        // --------------------------------------------------------------------
        // Une feuille peut avoir un champ "checklist" (voir l'en-tête de la
        // branche DCD dans data.js). Elle s'affiche entre les questions et les
        // résultats. Cocher une case relance render() : les "if" des résultats
        // (ex : lignes du commentaire WATT) se mettent à jour tout seuls.
        // ====================================================================

        // Remplace les {{variables}} d'un libellé par du TEXTE brut (affiché
        // ensuite via textContent : jamais interprété comme du HTML).
        function fillPlain(text, vars) {
          return String(text || "").replace(/\{\{([^}]+)\}\}/g, (m, key) => {
            const v = vars[key.trim()];
            return v == null ? "" : String(v);
          });
        }

        // Construit la liste des sections et éléments VISIBLES (conditions "if"
        // appliquées, bloc "chambres" déplié en une carte par chambre).
        // Partagée par l'affichage, le compteur et l'alerte de RECOMMENCER.
        function buildChecklistModel(leaf, vars) {
          const cl = leaf && leaf.checklist;
          if (!cl || !Array.isArray(cl.sections)) return [];
          const sections = [];
          // Une alerte « stop » visible arrête la checklist : rien n'est
          // affiché après elle (et checklistStops() masque motifs / résultats).
          let stopped = false;
          cl.sections.forEach((section) => {
            if (stopped) return;
            if (section.if && !contextMatches(section.if, vars)) return;
            const items = [];
            (section.items || []).forEach((item) => {
              if (stopped) return;
              if (item.if && !contextMatches(item.if, vars)) return;
              if (item.sauf && contextMatches(item.sauf, vars)) return; // ex : pas pour le motif 16
              if (item.type === "chambres") {
                items.push(...buildChambresItems(cl, vars));
              } else if (item.type === "liste") {
                items.push(...buildListeItems(item));
              } else {
                items.push(item);
              }
              if (item.type === "alerte" && item.stop) stopped = true;
            });
            if (items.length > 0) sections.push({ id: section.id, titre: section.titre, bas: !!section.bas, fin: !!section.fin, items });
          });
          sections.stopped = stopped;
          return sections;
        }

        // Liste répétable (ex : une contrainte par bloc) : le modèle est copié
        // autant de fois que demandé, {n} remplacé par 1, 2, 3… Le nombre de
        // blocs est gardé dans checkState["<id>-nb"].
        function listeNb(item) {
          return Math.max(1, parseInt(checkState[item.id + "-nb"], 10) || 1);
        }
        function listeBloc(item, n) {
          return JSON.parse(JSON.stringify(item.modele || []).split("{n}").join(String(n)));
        }
        function buildListeItems(item) {
          const nb = listeNb(item);
          const out = [];
          for (let n = 1; n <= nb; n++) {
            out.push({ type: "groupe", label: String(item.titre || "").split("{n}").join(String(n)), items: listeBloc(item, n) });
          }
          out.push({ type: "ajout", liste: item, nb });
          return out;
        }

        function buildChambresItems(cl, vars) {
          const out = [];
          (cl.chambresNotaires || []).forEach((ch) => {
            if (vars["chambre-" + ch.id] !== "oui") return;
            out.push({
              type: "groupe",
              label: ch.label,
              lien: { label: "OUVRIR LE SITE", url: ch.url },
              lienDansAide: true,
              aide: "remplir le formulaire de recherche de succession.",
              items: [
                {
                  type: "check",
                  id: "dcd-notaire-" + ch.id + "-demande",
                  label: "FORMULAIRE REMPLI, IMPRIMÉ EN PDF AVANT ENVOI, ENVOYÉ, PDF RATTACHÉ À L'AFFAIRE",
                },
                {
                  type: "check",
                  id: "dcd-notaire-" + ch.id + "-ar",
                  label: "ACCUSÉ DE RÉCEPTION REÇU PAR MAIL ET RATTACHÉ À L'AFFAIRE",
                },
              ],
            });
          });
          // Autres départements : un bloc par département (même procédé chacun).
          const autre = cl.chambreAutre || {};
          String(vars["depts-autres"] || "").split(" ET ").filter(Boolean).forEach((d) => {
            const base = "dcd-notaire-autre-" + d;
            const envoi = checkState[base + "-envoi"] || "";
            const parScribe = envoi === "mail" || envoi === "courrier";
            out.push({
              type: "groupe",
              label: "AUTRE CHAMBRE — DÉPT " + deptAvecNom(d).toUpperCase(),
              lien: autre.url ? { label: "OUVRIR LE SITE CSN", url: autre.url } : null,
              lienDansAide: true,
              aide: "chambre interdépartementale → département " + deptAvecNom(d) + " → RECHERCHER : voir son mode d'envoi.",
              items: [
                {
                  type: "question",
                  id: base + "-envoi",
                  label: "DEMANDE FAITE PAR",
                  choix: [
                    { val: "formulaire", label: "FORMULAIRE EN LIGNE" },
                    { val: "mail", label: "SCRIBE PAR MAIL" },
                    { val: "courrier", label: "SCRIBE PAR COURRIER" },
                  ],
                },
                ...(envoi === "formulaire"
                  ? [{
                      type: "check",
                      id: base + "-demande",
                      label: "FORMULAIRE REMPLI, IMPRIMÉ EN PDF AVANT ENVOI, ENVOYÉ, PDF RATTACHÉ À L'AFFAIRE",
                    }]
                  : []),
                ...(parScribe
                  ? [
                      {
                        type: "check",
                        id: base + "-demande",
                        label: "SCRIBE ENVOYÉ PAR " + (envoi === "mail" ? "MAIL" : "COURRIER"),
                        copie: autre.modeleScribe
                          ? [{
                              label: "MODÈLE SCRIBE",
                              texte: autre.modeleScribe,
                              rappel: vars["dcd-acte-ged"] === "oui" ? "+ JOINDRE L'ACTE" : "",
                            }]
                          : null,
                      },
                      // Acte de décès présent en GED : joint au SCRIBE.
                      ...(vars["dcd-acte-ged"] === "oui"
                        ? [{
                            type: "check",
                            id: base + "-pj-acte",
                            label: "ACTE DE DÉCÈS (GED) JOINT EN PIÈCE JOINTE DU SCRIBE",
                          }]
                        : []),
                    ]
                  : []),
                // AR seulement pour le formulaire en ligne (pas par SCRIBE).
                ...(envoi === "formulaire"
                  ? [{
                      type: "check",
                      id: base + "-ar",
                      label: "ACCUSÉ DE RÉCEPTION RATTACHÉ À L'AFFAIRE (S'IL Y EN A UN)",
                      facultatif: true,
                      tag: "SI RETOUR",
                    }]
                  : []),
              ],
            });
          });
          if (out.length === 0) {
            out.push({
              type: "alerte",
              niveau: "warning",
              texte: "SAISIR CI-DESSUS LE DÉPARTEMENT DE NAISSANCE ET CELUI DU DERNIER DOMICILE : LES BONS SITES S'AFFICHERONT ICI.",
            });
          }
          return out;
        }

        // Compte les étapes : questions répondues + cases cochées.
        // Les étapes "facultatif" (accusés de réception, qui arrivent plus tard)
        // ne sont pas comptées.
        function countChecklist(sections) {
          let done = 0;
          let total = 0;
          const visit = (item) => {
            if (item.type === "groupe") {
              (item.items || []).forEach(visit);
              return;
            }
            if (item.facultatif) return;
            if (item.type === "check") {
              total += 1;
              if (checkState[item.id] === true) done += 1;
            } else if (item.type === "question") {
              total += 1;
              if (checkState[item.id]) done += 1;
            }
          };
          sections.forEach((s) => s.items.forEach(visit));
          return { done, total };
        }

        function makeChecklistCopy(copie, vars) {
          const wrap = document.createElement("span");
          wrap.className = "chk-copy";
          if (copie.label) {
            const lbl = document.createElement("span");
            lbl.className = "chk-copy-label";
            lbl.textContent = copie.label;
            wrap.appendChild(lbl);
          }
          const html = substituteTemplate(copie.texte || "", vars);
          const txt = document.createElement("span");
          txt.className = "chk-copy-text";
          // Même exception que resultats[].texte : HTML riche venant de data.js,
          // les valeurs saisies y sont déjà échappées par substituteTemplate.
          txt.innerHTML = html;
          // Petit rappel orange collé au texte (ex : « + JOINDRE L'ACTE »).
          if (copie.rappel) {
            const rap = document.createElement("span");
            rap.className = "chk-copy-rappel";
            rap.textContent = copie.rappel;
            txt.appendChild(document.createTextNode(" "));
            txt.appendChild(rap);
          }
          wrap.appendChild(txt);
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "copy-btn";
          btn.textContent = "COPIER";
          btn.addEventListener("click", () => copyRichHtml(html, btn));
          wrap.appendChild(btn);
          return wrap;
        }

        // Textes générés (post-it, WATT…) affichés dans une étape « montre ».
        function makeEtapeTextes(item, vars) {
          const wrap = document.createElement("div");
          const blocs = computeResultBlocks(getDeepestNode(), vars).filter((rb) => [].concat(rb.source.etape || []).includes(item.montre));
          blocs.forEach((rb) => {
            rb.subBlocs.filter((sub) => !sub.horsEtape).forEach((sub) => {
              const line = document.createElement("span");
              line.className = "chk-copy";
              const txt = document.createElement("span");
              txt.className = "chk-copy-text";
              txt.innerHTML = sub.texte || ""; // déjà passé par substituteTemplate
              line.appendChild(txt);
              const btn = document.createElement("button");
              btn.type = "button";
              btn.className = "copy-btn";
              btn.textContent = "COPIER";
              btn.addEventListener("click", () => copyRichHtml(sub.texte || "", btn));
              line.appendChild(btn);
              wrap.appendChild(line);
            });
          });
          if (!wrap.firstChild) {
            const vide = document.createElement("div");
            vide.className = "chk-aide";
            vide.textContent = item.attente || "Le texte apparaîtra ici une fois le motif et le sous-motif choisis.";
            wrap.appendChild(vide);
          }
          return wrap;
        }

        function makeChecklistLink(lien) {
          // Uniquement des liens https (ouverts dans un nouvel onglet).
          if (!lien || !/^https:\/\//i.test(lien.url || "")) return null;
          const a = document.createElement("a");
          a.className = "chk-link";
          a.href = lien.url;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = (lien.label || "OUVRIR") + " ↗";
          return a;
        }

        function makeChecklistAide(text) {
          const el = document.createElement("div");
          el.className = "chk-aide";
          el.textContent = text;
          return el;
        }

        // Champs à remplir DANS une étape (type "champs", ou "champs" d'un
        // check). Mêmes champs que la cascade (createFieldElement) : la valeur
        // va dans nodeInputs, donc dans les {{variables}} et les conditions.
        function makeChecklistFields(champs) {
          // Cadre orange en pointillés « À REMPLIR » tant qu'un champ est vide,
          // vert « REMPLI ✓ » quand tout est saisi. Taper re-dessine la
          // checklist (renderChecklist), donc l'état se met à jour en direct.
          const filled = champs.every((c) => String(nodeInputs[c.id] || "").trim() !== "");
          const wrap = document.createElement("div");
          wrap.className = "chk-fields" + (filled ? " is-filled" : "");
          const tag = document.createElement("span");
          tag.className = "chk-fields-tag";
          tag.textContent = filled ? "REMPLI ✓" : "À REMPLIR";
          wrap.appendChild(tag);
          champs.forEach((input) => {
            const field = document.createElement("span");
            field.className = "leaf-input-wrap";
            const lbl = document.createElement("span");
            lbl.className = "leaf-input-label";
            lbl.textContent = input.label || "";
            field.appendChild(lbl);
            const el = createFieldElement(input);
            // large: true → champ plus large (noms, adresses…) pour lire et
            // corriger toute la saisie sans qu'elle soit coupée.
            if (input.large) el.classList.add("is-large");
            field.appendChild(el);
            wrap.appendChild(field);
          });
          return wrap;
        }

        function renderChecklistItem(item, vars, parent, sectionId) {
          if (item.type === "champs") {
            const row = document.createElement("div");
            // Tous les champs remplis : ligne verte, comme une étape faite.
            const remplis = (item.champs || []).length > 0 && champsRemplis(item);
            row.className = "chk-row chk-fields-row" + (remplis ? " is-checked" : "");
            row.appendChild(makeChecklistFields(item.champs || []));
            parent.appendChild(row);
            return;
          }

          if (item.type === "ajout") {
            const liste = item.liste;
            const cleFini = liste.id + "-fini";
            const el = document.createElement("div");
            // « Pas d'autre » validé : ligne verte, on peut encore en rajouter.
            const fini = checkState[cleFini] === true;
            el.className = "chk-ajout" + (fini ? " is-fini" : "");
            if (fini) {
              const ok = document.createElement("span");
              ok.className = "chk-ajout-ok";
              ok.textContent = liste.fini || "✓ C'EST TOUT";
              el.appendChild(ok);
            }
            const plus = document.createElement("button");
            plus.type = "button";
            plus.className = "context-option pill-btn";
            plus.textContent = liste.ajout || "+ AJOUTER";
            plus.addEventListener("click", () => {
              checkState[liste.id + "-nb"] = item.nb + 1;
              delete checkState[cleFini];
              render();
            });
            el.appendChild(plus);
            if (!fini) {
              const stop = document.createElement("button");
              stop.type = "button";
              stop.className = "context-option pill-btn";
              stop.textContent = liste.fini || "✓ C'EST TOUT";
              stop.addEventListener("click", () => {
                checkState[cleFini] = true;
                noterHeure(cleFini, true);
                render();
              });
              el.appendChild(stop);
            }
            if (item.nb > 1) {
              const moins = document.createElement("button");
              moins.type = "button";
              moins.className = "context-option pill-btn";
              moins.textContent = "− RETIRER LA DERNIÈRE";
              moins.addEventListener("click", () => {
                // On efface aussi ce qui avait été saisi / coché dans ce bloc.
                const vider = (it) => {
                  if (it.id) { delete checkState[it.id]; delete nodeInputs[it.id]; }
                  (it.champs || []).forEach((c) => delete nodeInputs[c.id]);
                  (it.items || []).forEach(vider);
                };
                listeBloc(liste, item.nb).forEach(vider);
                checkState[liste.id + "-nb"] = item.nb - 1;
                render();
              });
              el.appendChild(moins);
            }
            parent.appendChild(el);
            return;
          }

          if (item.type === "alerte") {
            const el = document.createElement("div");
            // valideePar : l'alerte passe au vert quand l'étape qui y répond est cochée.
            const validee = item.valideePar && checkState[item.valideePar] === true;
            el.className = "chk-alert is-" + (validee ? "ok" : item.niveau || "info");
            const txt = document.createElement("span");
            txt.textContent = fillPlain(item.texte, vars);
            el.appendChild(txt);
            parent.appendChild(el);
            return;
          }

          if (item.type === "groupe") {
            const grp = document.createElement("div");
            // Toutes ses étapes faites (hors facultatives) : le titre passe en vert.
            const aFaire = [];
            const visiteGrp = (it) => {
              if (it.if && !contextMatches(it.if, vars)) return;
              if (it.type === "groupe") return (it.items || []).forEach(visiteGrp);
              if (it.facultatif) return;
              if (it.type === "check") aFaire.push(checkState[it.id] === true);
              if (it.type === "question") aFaire.push(!!checkState[it.id]);
            };
            (item.items || []).forEach(visiteGrp);
            const grpFait = aFaire.length > 0 && aFaire.every(Boolean);
            grp.className = "chk-group" + (grpFait ? " is-done" : "");
            const head = document.createElement("div");
            head.className = "chk-group-head";
            const title = document.createElement("span");
            title.className = "chk-group-title";
            title.textContent = fillPlain(item.label, vars);
            head.appendChild(title);
            const tutoG = item.tuto ? makeTutoButton(item.tuto) : null;
            if (tutoG) head.insertBefore(tutoG, title.nextSibling);
            const link = makeChecklistLink(item.lien);
            // lienDansAide : le bouton du site ouvre la consigne (1re chose à faire).
            if (link && !(item.lienDansAide && item.aide)) head.appendChild(link);
            grp.appendChild(head);
            if (item.aide) {
              const aide = makeChecklistAide(item.aide);
              if (link && item.lienDansAide) {
                aide.classList.add("chk-aide-lien");
                aide.textContent = "";
                aide.appendChild(link);
                aide.appendChild(document.createTextNode(" puis " + item.aide));
              }
              grp.appendChild(aide);
            }
            (item.items || []).forEach((sub) => renderChecklistItem(sub, vars, grp, sectionId));
            parent.appendChild(grp);
            return;
          }

          if (item.type === "question") {
            const row = document.createElement("div");
            row.className = "chk-row chk-question" + (checkState[item.id] ? " is-checked" : "");
            row.id = "chk-row-" + item.id;
            const body = document.createElement("div");
            body.className = "chk-body";
            const line = document.createElement("div");
            line.className = "chk-line";
            const lbl = document.createElement("span");
            lbl.className = "chk-label";
            lbl.textContent = fillPlain(item.label, vars);
            line.appendChild(lbl);
            const tutoQ = makeTutoButton(item.tuto || item.id);
            if (tutoQ) line.appendChild(tutoQ);
            const groupeCtx = item.contexte && (window.globalContextOptions || []).find((g) => g.id === item.contexte);
            const current = groupeCtx ? globalSelections[item.contexte] : checkState[item.id];
            const choix = groupeCtx
              ? groupeCtx.choix.map((v) => ({ val: v, label: v }))
              : Array.isArray(item.choix) && item.choix.length > 0
                ? item.choix
                : [{ val: "oui", label: "OUI" }, { val: "non", label: "NON" }];
            choix.forEach(({ val, label }) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = label;
              btn.className = `context-option pill-btn ${current === val ? "is-selected" : ""}`;
              btn.setAttribute("aria-pressed", current === val ? "true" : "false");
              btn.addEventListener("click", () => {
                if (groupeCtx) { choisirContexte(item.contexte, val); return; }
                // Re-cliquer sur la réponse choisie l'efface (comme les topQuestions).
                if (checkState[item.id] === val) delete checkState[item.id];
                else checkState[item.id] = val;
                noterHeure(item.id, checkState[item.id] != null);
                // fixeContexte : la réponse choisit aussi le CONTEXTE à gauche
                // (ex. DCD « usager radié ? » OUI → COMPTE = RADIÉ).
                const fixe = item.fixeContexte && checkState[item.id] && item.fixeContexte[checkState[item.id]];
                if (fixe) Object.assign(globalSelections, fixe);
                render();
              });
              line.appendChild(btn);
            });
            // Bouton d'action (ex : FAIRE L'AMIABLE RELDET) qui active un toggle.
            const act = item.action;
            const actToggle = act && inlineRootNode && (inlineRootNode.toggles || []).find((t) => t.id === act.toggle);
            if (actToggle && (!act.if || contextMatches(act.if, vars))) {
              const ab = document.createElement("button");
              ab.type = "button";
              ab.className = "chk-action";
              ab.textContent = act.label;
              ab.addEventListener("click", () => activateToggle(actToggle));
              line.appendChild(ab);
            }
            body.appendChild(line);
            if (item.aide) body.appendChild(makeChecklistAide(item.aide));
            row.appendChild(body);
            parent.appendChild(row);
            return;
          }

          if (item.type === "check") {
            const checked = checkState[item.id] === true;
            const row = document.createElement("div");
            row.className = "chk-row" + (checked ? " is-checked" : "");
            row.id = "chk-row-" + item.id;

            const box = document.createElement("input");
            box.type = "checkbox";
            box.className = "chk-box";
            box.id = "chk-" + item.id;
            box.checked = checked;
            if (item.autoCoche) {
              box.disabled = true;
              box.title = "Se coche tout seul selon le CONTEXTE à gauche";
            }
            box.addEventListener("change", () => {
              // Champs obligatoires (ex : DATE DU JUSTIFICATIF) : pas de coche sans eux.
              if (box.checked && item.champsObligatoires && !champsRemplis(item)) {
                box.checked = false;
                const vide = item.champs.find((c) => String(nodeInputs[c.id] || "").trim() === "");
                showToast("REMPLIS D'ABORD : " + vide.label, 2600);
                const f = document.querySelector(`#chk-row-${item.id} [data-input-id="${vide.id}"]`);
                if (f) f.focus();
                return;
              }
              if (box.checked && openTutoKey === (item.tuto || item.id)) closeTutos();
              checkState[item.id] = box.checked;
              noterHeure(item.id, box.checked);
              render();
              if (box.checked && Array.isArray(item.champs) && !champsRemplis(item)) {
                // Coché quand même : simple rappel de ce qu'il reste à saisir.
                const vides = item.champs
                  .filter((c) => String(nodeInputs[c.id] || "").trim() === "")
                  .map((c) => c.label);
                showToast("CONSEILLÉ : REMPLIR " + vides.join(", "), 2600);
              }
            });
            row.appendChild(box);

            const body = document.createElement("div");
            body.className = "chk-body";
            const line = document.createElement("div");
            line.className = "chk-line";
            const lbl = document.createElement("label");
            lbl.className = "chk-label";
            lbl.htmlFor = box.id;
            lbl.textContent = fillPlain(item.label, vars);
            line.appendChild(lbl);
            const tutoC = makeTutoButton(item.tuto || item.id);
            if (tutoC) line.appendChild(tutoC);
            if (item.tag) {
              const tag = document.createElement("span");
              tag.className = "chk-tag";
              tag.textContent = item.tag;
              line.appendChild(tag);
            }
            const link = makeChecklistLink(item.lien);
            // lienAvant : le bouton du site vient en premier (« OUVRIR LE SITE ↗ puis … »).
            if (link && item.lienAvant) {
              line.insertBefore(link, lbl);
              lbl.textContent = "puis " + lbl.textContent;
            } else if (link) line.appendChild(link);
            body.appendChild(line);
            if (item.aide) body.appendChild(makeChecklistAide(fillPlain(item.aide, vars)));
            if (Array.isArray(item.champs) && item.champs.length > 0) {
              body.appendChild(makeChecklistFields(item.champs));
            }
            if (Array.isArray(item.copie) && item.copie.length > 0) {
              const tools = document.createElement("div");
              tools.className = "chk-tools";
              item.copie.forEach((c) => tools.appendChild(makeChecklistCopy(c, vars)));
              body.appendChild(tools);
            }
            // sousCoches : petites cases de contrôle (non comptées) sous l'étape.
            const sous = (item.sousCoches || []).filter((sc) =>
              (!sc.if || contextMatches(sc.if, vars)) && !(sc.sauf && contextMatches(sc.sauf, vars)));
            if (sous.length) {
              const box = document.createElement("div");
              box.className = "chk-sous";
              sous.forEach((sc) => {
                const lab = document.createElement("label");
                lab.className = "chk-sous-item" + (checkState[sc.id] === true ? " is-on" : "");
                const cb = document.createElement("input");
                cb.type = "checkbox";
                cb.checked = checkState[sc.id] === true;
                cb.addEventListener("change", () => {
                  checkState[sc.id] = cb.checked;
                  noterHeure(sc.id, cb.checked);
                  render();
                });
                lab.appendChild(cb);
                lab.appendChild(document.createTextNode(" " + sc.label));
                box.appendChild(lab);
              });
              body.appendChild(box);
            }
            if (item.montre) {
              const tools = makeEtapeTextes(item, vars);
              tools.classList.add("chk-tools");
              body.appendChild(tools);
            }
            row.appendChild(body);
            parent.appendChild(row);
          }
        }

        function renderChecklist() {
          const active = document.activeElement;
          const activeId =
            active && (checklistContainer.contains(active) || checklistBas.contains(active) || toggleEtapes.contains(active) || toggleEtapesApres.contains(active)) ? active.getAttribute("data-input-id") : null;
          // Un même champ peut apparaître 2 fois (ex : N° D'ACTE dans SNGI et
          // dans MAIRIE) : on retient lequel des deux avait le curseur.
          const activeIdx = activeId
            ? [...document.querySelectorAll(`#checklistContainer [data-input-id="${activeId}"], #checklistContainerBas [data-input-id="${activeId}"], #toggleEtapes [data-input-id="${activeId}"]`)].indexOf(active)
            : -1;
          const selStart = activeId ? active.selectionStart : null;
          const selEnd = activeId ? active.selectionEnd : null;
          const scrollY = window.scrollY;

          drawChecklist();
          if (activeToggleStack.length) renderToggleEtapes();

          if (activeId) {
            const again = document.querySelectorAll(`#checklistContainer [data-input-id="${activeId}"], #checklistContainerBas [data-input-id="${activeId}"], #toggleEtapes [data-input-id="${activeId}"]`)[Math.max(activeIdx, 0)];
            if (again) {
              again.focus();
              try { again.setSelectionRange(selStart, selEnd); } catch (err) { /* type sans sélection */ }
            }
          }
          if (window.scrollY !== scrollY) window.scrollTo(0, scrollY);
        }

        // Étapes encore à faire (mêmes règles que le compteur) : questions sans
        // réponse et cases non cochées, hors étapes facultatives.
        function listMissing(sections, vars) {
          const out = [];
          sections.forEach((section) => {
            const visit = (item) => {
              if (item.type === "groupe") {
                (item.items || []).forEach(visit);
                return;
              }
              if (item.facultatif) return;
              const manque =
                (item.type === "check" && checkState[item.id] !== true) ||
                (item.type === "question" && !checkState[item.id]);
              if (manque) {
                out.push({ id: item.id, section: section.titre || "", label: fillPlain(item.label, vars) });
              }
            };
            section.items.forEach(visit);
          });
          return out;
        }

        // Fait défiler jusqu'à une étape et la fait clignoter une fois (couleur
        // seulement) pour que l'œil la trouve.
        function goToStep(id) {
          const el = document.getElementById("chk-row-" + id);
          if (!el) return;
          el.scrollIntoView({ behavior: "auto", block: "center" });
          el.classList.add("is-flash");
          setTimeout(() => el.classList.remove("is-flash"), 1400);
        }

        let resultsHome = null; // place d'origine des résultats (hors bloc ANV)
        function drawChecklist() {
          checklistContainer.innerHTML = "";
          checklistBas.innerHTML = "";
          checklistFin.innerHTML = "";
          syncAutoChecks();
          const leaf = getChecklistNode();
          // Checklist de la racine (position "haut", ANV) : UN SEUL BLOC qui
          // contient étapes du haut + motifs + questions de fin + étapes du bas,
          // comme la DCD. Les sections gardent leurs ids, on les déplace juste
          // dans le bloc (et on les remet à leur place pour les autres catégories).
          const enHaut = !!(leaf && leaf.checklist.position === "haut");
          // Aussi un seul bloc pour les parcours ouverts depuis ce mode
          // opératoire (VERSEMENT RÉCENT, DETTE NON EXIGIBLE) : barre du haut,
          // écritures / raison et textes dans la même carte.
          const depuisProcess = activeToggleStack.length > 0 &&
            !!(activeToggleStack[0].savedRootNode && activeToggleStack[0].savedRootNode.checklist &&
               activeToggleStack[0].savedRootNode.checklist.position === "haut");
          const enBloc = enHaut || depuisProcess;
          if (enBloc && checklistContainer.parentElement !== processBloc) {
            if (!resultsHome) resultsHome = { parent: resultsContainer.parentElement, next: resultsContainer.nextSibling };
            togglesContainer.before(processBloc);
            processBloc.append(togglesContainer, checklistContainer, cascadeFlow, leafQuestionsContainer, checklistBas, resultsContainer, checklistFin);
          } else if (!enBloc && checklistContainer.parentElement === processBloc) {
            processBloc.replaceWith(togglesContainer, cascadeFlow, leafQuestionsContainer, checklistContainer, checklistBas);
            resultsHome.parent.insertBefore(resultsContainer, resultsHome.next);
            checklistFin.innerHTML = "";
          }
          if (!leaf) return;

          const vars = buildTemplateVars();
          const sections = buildChecklistModel(leaf, vars);
          const { done, total } = countChecklist(sections);

          const head = document.createElement("div");
          head.className = "chk-head";
          const title = document.createElement("span");
          title.className = "chk-head-title";
          title.textContent = "MODE OPÉRATOIRE";
          head.appendChild(title);
          const count = document.createElement("span");
          count.className = "chk-head-count" + (total > 0 && done === total ? " is-complete" : "");
          count.textContent = done + " / " + total;
          head.appendChild(count);
          const bar = document.createElement("div");
          bar.className = "chk-bar";
          const fill = document.createElement("span");
          fill.style.width = (total > 0 ? Math.round((done / total) * 100) : 0) + "%";
          const missing = listMissing(sections, vars);
          // Bouton dans la barre collée en haut : aller directement à ce qui manque.
          if (missing.length > 0) {
            const go = document.createElement("button");
            go.type = "button";
            go.className = "chk-head-go";
            go.textContent = "→ ÉTAPE MANQUANTE";
            go.title = "Aller à la première étape pas encore faite";
            go.addEventListener("click", () => goToStep(missing[0].id));
            head.insertBefore(go, count);
          }
          bar.appendChild(fill);
          head.appendChild(bar);
          checklistContainer.appendChild(head);

          let zoneFin = checklistContainer;
          sections.forEach((section) => {
            const sec = document.createElement("div");
            sec.className = "chk-section";
            sec.id = "chk-sec-" + section.id;
            if (section.titre) {
              const st = document.createElement("div");
              st.className = "chk-section-title";
              st.textContent = section.titre;
              sec.appendChild(st);
            }
            section.items.forEach((item) => renderChecklistItem(item, vars, sec, section.id));
            if (section.fin) {
              // Après les textes à copier (double vérification, clôture…).
              checklistFin.appendChild(sec);
              zoneFin = checklistFin;
            } else if (section.bas) {
              // Sous le motif.
              checklistBas.appendChild(sec);
              zoneFin = checklistBas;
            } else {
              checklistContainer.appendChild(sec);
            }
          });

          // BILAN en fin de checklist : tout est fait, ou la liste de ce qui
          // manque (chaque ligne est cliquable) + un bouton pour y remonter.
          if (checklistStops()) return; // le bandeau rouge suffit
          const recap = document.createElement("div");
          recap.className = "chk-recap " + (missing.length === 0 ? "is-ok" : "is-todo");
          const rt = document.createElement("div");
          rt.className = "chk-recap-title";
          rt.textContent = missing.length === 0
            ? (leaf.checklist.recapOk || "✓ TOUT EST FAIT : TU PEUX COPIER LE COMMENTAIRE WATT")
            : "IL MANQUE " + missing.length + (missing.length > 1 ? " ÉTAPES" : " ÉTAPE");
          recap.appendChild(rt);
          if (missing.length === 0 && leaf.checklist.recapDocument) {
            const doc = document.createElement("button");
            doc.type = "button";
            doc.className = "chk-recap-go";
            doc.textContent = "📄 RÉCAP DES ÉTAPES (À ENREGISTRER EN PDF)";
            doc.title = "Ouvre le récapitulatif daté des étapes : Ctrl+P → Enregistrer au format PDF, puis rattacher à l'affaire";
            doc.addEventListener("click", () => ouvrirRecap(leaf.checklist.recapDocument.titre, sections, vars));
            recap.appendChild(doc);
          }
          if (missing.length > 0) {
            const list = document.createElement("div");
            list.className = "chk-recap-list";
            missing.forEach((m) => {
              const b = document.createElement("button");
              b.type = "button";
              b.className = "chk-recap-item";
              b.textContent = (m.section ? m.section + " — " : "") + m.label;
              b.addEventListener("click", () => goToStep(m.id));
              list.appendChild(b);
            });
            recap.appendChild(list);
            const up = document.createElement("button");
            up.type = "button";
            up.className = "chk-recap-go";
            up.textContent = "↑ REMONTER À LA PREMIÈRE ÉTAPE MANQUANTE";
            up.addEventListener("click", () => goToStep(missing[0].id));
            recap.appendChild(up);
          }
          zoneFin.appendChild(recap);
        }

        // ------------------------------------------------------------------
        // RÉCAP DES ÉTAPES (PDF à rattacher à l'affaire)
        // Page autonome ouverte dans un nouvel onglet : date de génération,
        // contexte, chaque étape avec sa réponse, ses saisies et l'heure à
        // laquelle elle a été faite, les textes copiés, et une EMPREINTE
        // (SHA-256 du contenu) : si on retouche une ligne à la main, elle ne
        // correspond plus. Ce n'est pas une preuve absolue (tout se passe sur
        // le PC) : ce qui fait foi, c'est la date de rattachement dans l'affaire.
        // ------------------------------------------------------------------
        const deux = (n) => String(n).padStart(2, "0");
        const dateFr = (d) => deux(d.getDate()) + "/" + deux(d.getMonth() + 1) + "/" + d.getFullYear();
        const heureFr = (d) => deux(d.getHours()) + ":" + deux(d.getMinutes()) + ":" + deux(d.getSeconds());

        async function empreinte(texte) {
          try {
            const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(texte));
            return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
          } catch (e) {
            // Repli sans crypto.subtle : FNV-1a (détecte aussi une retouche).
            let h = 0x811c9dc5;
            for (let i = 0; i < texte.length; i++) { h ^= texte.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
            return h.toString(16).padStart(8, "0");
          }
        }

        async function ouvrirRecap(titreBase, sections, vars, contexteFourni) {
          const now = new Date();
          const titre = (titreBase || "Mode opératoire complété") +
            " - " + deux(now.getDate()) + "-" + deux(now.getMonth() + 1) + "-" + now.getFullYear() +
            " à " + deux(now.getHours()) + "h" + deux(now.getMinutes());
          const lignes = [];   // texte brut, base de l'empreinte
          const rows = [];     // HTML du tableau
          const heureDe = (id) => {
            const t = checkState["@t:" + id];
            return t ? heureFr(new Date(t)) + " (" + dateFr(new Date(t)) + ")" : "";
          };
          const textesEtape = (item) => {
            const out = [];
            (item.copie || []).forEach((c) => out.push(stripHtmlToText(substituteTemplate(c.texte || "", vars))));
            if (item.montre) {
              computeResultBlocks(getDeepestNode(), vars)
                .filter((rb) => [].concat(rb.source.etape || []).includes(item.montre))
                .forEach((rb) => rb.subBlocs.filter((sb) => !sb.horsEtape).forEach((sb) => out.push(stripHtmlToText(sb.texte || ""))));
            }
            return out;
          };
          const visit = (item, groupe) => {
            if (item.type === "groupe") {
              rows.push('<tr class="grp"><td colspan="3">' + escapeHtml(fillPlain(item.label || "", vars)) + "</td></tr>");
              lignes.push("== " + fillPlain(item.label || "", vars));
              (item.items || []).forEach((it) => visit(it, true));
              return;
            }
            if (item.type === "info") {
              // Choix ou saisie hors checklist (raison, écritures…) : pas d'heure.
              const hi = item.tKey ? heureDe(item.tKey) : "";
              rows.push("<tr><td>" + escapeHtml(item.label) + "</td><td>" +
                escapeHtml(item.reponse).replace(/\n/g, "<br>") + "</td><td>" + escapeHtml(hi) + "</td></tr>");
              lignes.push(item.label + " | " + item.reponse + " | " + hi);
              return;
            }
            if (item.type !== "check" && item.type !== "question") return;
            const label = fillPlain(item.label || "", vars);
            const val = checkState[item.id];
            const reponse = item.type === "question"
              ? String(((item.choix || []).find((c) => c.val === val) || {}).label || val || "").toUpperCase()
              : (val === true ? "✓ FAIT" : "—");
            const details = [];
            (item.champs || []).forEach((c) => details.push(c.label + " : " + String(nodeInputs[c.id] || "").trim()));
            textesEtape(item).forEach((t) => details.push("Texte : " + t));
            (item.sousCoches || []).filter((sc) =>
              (!sc.if || contextMatches(sc.if, vars)) && !(sc.sauf && contextMatches(sc.sauf, vars)))
              .forEach((sc) => details.push(sc.label + " : " + (checkState[sc.id] === true ? "✓ " + heureDe(sc.id) : "—")));
            const h = heureDe(item.id);
            rows.push("<tr><td>" + escapeHtml(label) +
              (details.length ? '<div class="det">' + details.map((d) => escapeHtml(d).replace(/\n/g, "<br>")).join("<br>") + "</div>" : "") +
              "</td><td>" + escapeHtml(reponse) + "</td><td>" + escapeHtml(h) + "</td></tr>");
            lignes.push(label + " | " + reponse + " | " + details.join(" ; ") + " | " + h);
          };
          sections.forEach((sec) => sec.items.forEach((it) => visit(it, false)));

          // Contexte : compte, statut, puis chaque choix de la cascade avec le
          // titre de son niveau (MOTIF / SOUS-MOTIF en ANV, ÉTAPE / SITUATION en DCD).
          const contexte = contexteFourni || [
            ["Compte", vars.compte || "—"],
            ["Statut", vars.statut || "—"],
          ].concat(inlineChain.map((c, i) => {
            const parent = i === 0 ? inlineRootNode : inlineChain[i - 1].node;
            const titreNiv = (parent && parent.choicesTitle) || "Choix";
            return [titreNiv.charAt(0) + titreNiv.slice(1).toLowerCase(), c.label];
          }));
          const base = [titre, "Généré le " + dateFr(now) + " à " + heureFr(now)]
            .concat(contexte.map(([k, v]) => k + " : " + v)).concat(lignes).join("\n");
          const hash = await empreinte(base);
          const court = hash.slice(0, 16).toUpperCase().match(/.{4}/g).join("-");

          const html = "<!doctype html><html lang='fr'><head><meta charset='utf-8'><title>" + escapeHtml(titre) + "</title>" +
            "<style>body{font-family:Aptos,Calibri,Arial,sans-serif;color:#1a140c;margin:28px;font-size:10.5pt}" +
            "h1{font-size:15pt;letter-spacing:.08em;margin:0 0 4px}.sub{color:#7a6c58;margin-bottom:14px}" +
            "table{border-collapse:collapse;width:100%;margin-top:10px}td,th{border:1px solid #cdbfa8;padding:5px 7px;vertical-align:top;text-align:left}" +
            "th{background:#f1ebe0}.grp td{background:#f4ede1;font-weight:700}.det{color:#5a4d3b;font-size:9pt;margin-top:3px}" +
            ".ctx td:first-child{width:120px;font-weight:700}.hash{margin-top:16px;font-size:9pt;color:#5a4d3b}" +
            ".hash b{font-family:Consolas,monospace;letter-spacing:.06em;color:#1a140c}" +
            ".btn{margin:0 0 14px;padding:8px 14px;font-weight:700;border:1.5px solid #0f766e;background:#0f766e;color:#fff;border-radius:6px;cursor:pointer}" +
            "@media print{.btn{display:none}body{margin:10mm}}</style></head><body>" +
            "<button class='btn' onclick='window.print()'>🖨 ENREGISTRER EN PDF (Ctrl+P → « Enregistrer au format PDF »)</button>" +
            "<h1>" + escapeHtml(titre.toUpperCase()) + "</h1>" +
            "<div class='sub'>Généré le " + dateFr(now) + " à " + heureFr(now) + " — LOGIX</div>" +
            "<table class='ctx'>" + contexte.map(([k, v]) => "<tr><td>" + escapeHtml(k) + "</td><td>" + escapeHtml(v) + "</td></tr>").join("") + "</table>" +
            "<table><tr><th>Étape</th><th>Réponse</th><th>Faite à</th></tr>" + rows.join("") + "</table>" +
            "<div class='hash'>Empreinte de contrôle (SHA-256 du contenu) : <b>" + court + "</b><br>" +
            "Toute modification du contenu de ce document change cette empreinte. " +
            "La date qui fait foi est celle du rattachement à l'affaire.</div>" +
            "</body></html>";
          const w = window.open("", "_blank");
          if (!w) { showToast("LE NAVIGATEUR A BLOQUÉ L'OUVERTURE : AUTORISE LES FENÊTRES POUR LOGIX", 3500); return; }
          w.document.open();
          w.document.write(html);
          w.document.close();
        }

        // Nombre d'étapes restantes dans la checklist affichée (0 si aucune).
        function remainingChecklistSteps() {
          const leaf = getChecklistNode();
          if (!leaf) return 0;
          const { done, total } = countChecklist(buildChecklistModel(leaf, buildTemplateVars()));
          return total - done;
        }

        // Repli pour les navigateurs d'entreprise anciens (ou les contextes où
        // navigator.clipboard n'existe pas, ex. page ouverte en file:// sur
        // certaines configs). On sélectionne un bloc invisible et on demande au
        // navigateur de copier : c'est la méthode historique, elle préserve le
        // format riche (gras / souligné / puces) tout comme ClipboardItem.
        function legacyCopyHtml(html, plainText) {
          try {
            const holder = document.createElement("div");
            holder.setAttribute("contenteditable", "true");
            holder.innerHTML = html;
            holder.style.cssText =
              "position:fixed;left:-99999px;top:0;white-space:pre-wrap;";
            document.body.appendChild(holder);
            const range = document.createRange();
            range.selectNodeContents(holder);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            const done = document.execCommand("copy");
            sel.removeAllRanges();
            document.body.removeChild(holder);
            if (done) return true;
          } catch (err) {
            console.error(err);
          }
          // Dernier recours : texte brut via un textarea temporaire.
          try {
            const ta = document.createElement("textarea");
            ta.value = plainText;
            ta.style.cssText = "position:fixed;left:-99999px;top:0;";
            document.body.appendChild(ta);
            ta.select();
            const done = document.execCommand("copy");
            document.body.removeChild(ta);
            return done;
          } catch (err) {
            console.error(err);
            return false;
          }
        }

        // Copie texte simple avec le même repli (utilisé par COPIER LE CHEMIN).
        async function copyPlainText(text) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {
            console.error(err);
          }
          return legacyCopyHtml("", text) === true;
        }

        async function copyRichHtml(html, button) {
          const originalText = button.textContent;
          const plainText = stripHtmlToText(html);
          let ok = false;

          try {
            if (navigator.clipboard && window.ClipboardItem) {
              const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([plainText], { type: "text/plain" }),
              });
              await navigator.clipboard.write([item]);
              ok = true;
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(plainText);
              ok = true;
            }
          } catch (err) {
            console.error(err);
          }

          if (!ok) ok = legacyCopyHtml(html, plainText);

          if (ok) {
            button.textContent = "COPIÉ ✓";
            button.classList.add("copy-success");
            setTimeout(() => {
              button.textContent = originalText;
              button.classList.remove("copy-success");
            }, 1200);
          } else {
            button.textContent = "ERREUR COPIE";
            setTimeout(() => {
              button.textContent = originalText;
            }, 1400);
          }
        }

        // Calcule les blocs résultat d'une feuille (sans rien afficher) :
        // utilisé par renderResults et par les étapes « montre » de la checklist.
        function computeResultBlocks(node, vars) {
          if (!node || !Array.isArray(node.resultats) || node.resultats.length === 0) return [];
          const subBlocsById = {};
          const resultBlocks = [];

          // 1ère passe : enregistrer les fragments dans subBlocsById, indépendamment
          // de leur position dans le tableau resultats. Comme ça les composites
          // peuvent les référencer via "combine" même s'ils sont définis après.
          node.resultats.forEach((res) => {
            if (res.if && !contextMatches(res.if, vars)) return;
            if ((res.type || "simple") !== "fragment") return;
            if (res.id) {
              const texte = substituteTemplate(res.texte || "", vars);
              subBlocsById[res.id] = { id: res.id, texte };
            }
          });

          // 2ème passe : construire les articles visibles (simple/multi/composite).
          node.resultats.forEach((res) => {
            if (res.if && !contextMatches(res.if, vars)) return;
            const kind = res.type || "simple";

            if (kind === "fragment") return; // déjà traité plus haut

            if (kind === "simple") {
              const texte = substituteTemplate(res.texte || "", vars);
              const sub = { id: res.id || res.label, texte };
              if (res.id) subBlocsById[res.id] = sub;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: [sub],
                source: res,
              });
            } else if (kind === "multi") {
              const subs = (res.blocs || [])
                .filter((b) => !b.if || contextMatches(b.if, vars))
                .map((b) => {
                  const texte = substituteTemplate(b.texte || "", vars);
                  const sub = { id: b.id, texte, horsEtape: !!b.horsEtape };
                  if (b.id) subBlocsById[b.id] = sub;
                  return sub;
                });
              if (subs.length === 0) return;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: subs,
                source: res,
              });
            } else if (kind === "composite") {
              const sep = res.separator != null ? res.separator : "\n";
              const parts = (res.combine || [])
                .map((refId) => subBlocsById[refId])
                .filter(Boolean)
                .map((sub) => sub.texte);
              if (parts.length === 0) return;
              let texte = parts.join(sep);
              // Fragments append-only (séparateur différent du combine).
              // Ex: WATT du motif 12 → "(Pas de FICOBA car site KO)" en suffixe
              // avec "<br><br>" au lieu de "<br>+<br>".
              if (Array.isArray(res.appendFragments)) {
                const appendSep = res.appendSeparator != null ? res.appendSeparator : "\n";
                res.appendFragments.forEach((refId) => {
                  const sub = subBlocsById[refId];
                  if (sub) texte += appendSep + sub.texte;
                });
              }
              const sub = { id: res.id || res.label, texte };
              if (res.id) subBlocsById[res.id] = sub;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: [sub],
                source: res,
              });
            }
          });

          for (let i = 0; i < resultBlocks.length; i++) {
            const rb = resultBlocks[i];
            const src = rb.source;
            if (!src.mergeWithCompositeIfSingle) continue;
            if (src.etape) continue; // rangés dans des étapes séparées : pas de fusion
            if (rb.subBlocs.length !== 1) continue;
            const compIdx = resultBlocks.findIndex((o) => o.id === src.mergeWithCompositeIfSingle);
            if (compIdx < 0) continue;
            const comp = resultBlocks[compIdx];
            if (comp.subBlocs.length === 1 && comp.subBlocs[0].texte === rb.subBlocs[0].texte) {
              resultBlocks[i] = {
                id: rb.id,
                label: src.mergedLabel || `${rb.label} & ${comp.label}`,
                subBlocs: rb.subBlocs,
                source: rb.source,
              };
              resultBlocks.splice(compIdx, 1);
              break;
            }
          }

          return resultBlocks;
        }

        // Étapes « montre » visibles dans la checklist affichée (ANV) : leurs
        // textes y sont déjà, on ne les répète pas en dessous.
        function etapesMontrees() {
          const n = getChecklistNode();
          const out = new Set();
          const visit = (it) => {
            if (it.montre) out.add(it.montre);
            (it.items || []).forEach(visit);
          };
          if (n) buildChecklistModel(n, buildTemplateVars()).forEach((sec) => sec.items.forEach(visit));
          // Étapes des parcours ouverts (VERSEMENT RÉCENT, DETTE NON EXIGIBLE).
          activeToggleStack.forEach((entry) =>
            ["etapes", "etapesApres", "etapesFin"].forEach((cle) => (entry.toggle.whenOn[cle] || []).forEach(visit)));
          return out;
        }

        function renderResults(node) {
          resultsContainer.innerHTML = "";
          const vars = buildTemplateVars();
          const montrees = etapesMontrees();
          const resultBlocks = computeResultBlocks(node, vars).filter((rb) => ![].concat(rb.source.etape || []).some((e) => montrees.has(e)));

          // Fabrique un bouton COPIER pour un texte donné.
          const makeCopyButton = (texte) => {
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "copy-btn";
            copyBtn.textContent = "COPIER";
            copyBtn.addEventListener("click", () => copyRichHtml(texte || "", copyBtn));
            return copyBtn;
          };

          resultBlocks.forEach((rb) => {
            const card = document.createElement("article");
            // Courrier (TEXTE DU COURRIER, OBJET) = rendu fidèle à Word.
            // Tout le reste (commentaires WATT, post-it…) = style de la page.
            // Purement visuel : COPIER colle toujours le texte d'origine.
            const estCourrier = /COURRIER|^OBJET/.test(rb.label || "");
            card.className = "result-card " + (estCourrier ? "is-courrier" : "is-note");

            const header = document.createElement("div");
            header.className = "result-header";

            const title = document.createElement("span");
            title.className = "result-title";
            title.textContent = rb.label || "Résultat";
            header.appendChild(title);

            // Bloc unique → le bouton COPIER va dans le bandeau, en haut à droite.
            // Bloc multi → un bouton par sous-bloc (chacun se copie séparément).
            const singleSub = rb.subBlocs.length === 1;
            if (singleSub) {
              header.appendChild(makeCopyButton(rb.subBlocs[0].texte));
            }
            card.appendChild(header);

            const body = document.createElement("div");
            body.className = "result-body";

            rb.subBlocs.forEach((sub) => {
              const subWrap = document.createElement("div");
              subWrap.className = "result-sub";

              const content = document.createElement("div");
              content.className = "result-content";
              content.innerHTML = sub.texte || "";
              subWrap.appendChild(content);

              if (!singleSub) subWrap.appendChild(makeCopyButton(sub.texte));

              body.appendChild(subWrap);
            });

            card.appendChild(body);
            resultsContainer.appendChild(card);
          });
        }

        // ====================================================================
        // PANNEAU CHEMIN / TODO
        // --------------------------------------------------------------------
        // Reconstruit uniquement à partir de l'état existant de l'application
        // (inlineRootNode, inlineChain, activeToggleStack, nodeInputs,
        // leafAnswers, leafInputs, topAnswers). Aucune donnée métier n'est
        // ajoutée dans data.js pour l'alimenter.
        //
        // Chaque étape a un état :
        //   "done"    ✓ étape franchie (et cliquable si on peut y revenir)
        //   "current" › étape en cours (la 1ère non franchie)
        //   "todo"    ○ étape restante
        // ====================================================================

        // Est-on dans le cas particulier "une seule catégorie" ? Dans ce cas
        // l'application entre automatiquement dedans et on ne peut pas en sortir.
        const singleCategoryMode = !!(
          Array.isArray(window.treeData.choix) &&
          window.treeData.choix.length === 1 &&
          window.treeData.choix[0].suite &&
          typeof window.treeData.choix[0].suite === "object"
        );

        // Le libellé affiché est TOUJOURS celui des données (label du groupe de
        // contexte, choicesTitle du niveau, label de la question ou de l'input).
        // Rien n'est écrit en dur : si data.js évolue, le CHEMIN suit.
        // Le « ? » final est conservé tel quel (ex : « COMPTE EN LIGNE OU MAIL ? »).
        function pushQuestionStep(steps, q, answers) {
          const ans = answers[q.id];
          steps.push({
            label: (q.label || q.id || "").trim(),
            value: ans ? String(ans).toUpperCase() : "",
            state: ans ? "done" : "todo",
          });
        }

        function buildPathSteps() {
          const vars = buildTemplateVars();
          const steps = [];

          // 1. Contexte global : COMPTE puis STATUT. Toujours atteints (ils sont
          //    visibles dès l'ouverture), donc toujours listés — avec « / » tant
          //    qu'ils ne sont pas renseignés.
          (globalContextOptions || []).forEach((group) => {
            const v = globalSelections[group.id];
            steps.push({
              label: group.label || group.id || "",
              value: v || "",
              state: v ? "done" : "todo",
            });
          });

          // 2. Catégorie active
          const categoryNode = activeToggleStack.length > 0
            ? activeToggleStack[0].savedRootNode
            : inlineRootNode;

          if (!categoryNode) {
            steps.push({ label: CATEGORY_LABEL, value: "", state: "todo" });
            return steps;
          }

          const cat = (window.treeData.choix || []).find((c) => c.suite === categoryNode);
          steps.push({
            label: CATEGORY_LABEL,
            value: cat && cat.label ? cat.label : "",
            state: "done",
            goTo: { type: "category" },
          });

          // 3. Toggles activés (AMIABLE RELDET, DETTE NON EXIGIBLE…).
          //    Un toggle REMPLACE les choix de son nœud hôte : on l'affiche donc
          //    comme le choix qu'il remplace, « <titre du niveau hôte> : <toggle> ».
          //    Ex. AMIABLE RELDET est posé sur le nœud dont choicesTitle vaut
          //    « MOTIF » → « MOTIF : AMIABLE RELDET ». Tout vient des données.
          activeToggleStack.forEach((entry) => {
            const host = entry.savedRootNode;
            const hostTitle = host && host.choicesTitle ? host.choicesTitle : "";
            const toggleLabel = (entry.toggle && entry.toggle.label) || "";
            steps.push(
              hostTitle
                ? { label: hostTitle, value: toggleLabel, state: "done" }
                : { label: toggleLabel, value: "OUI", state: "done" }
            );
          });

          // 3. topQuestions rattachées aux toggles : elles s'affichent dans la
          //    rangée des toggles, donc juste après eux dans le chemin.
          //    (Même condition que renderToggles : seulement si un toggle est actif.)
          if (activeToggleStack.length > 0) {
            const sources = new Set();
            activeToggleStack.forEach((entry) => sources.add(entry.toggle.whenOn));
            if (inlineRootNode) sources.add(inlineRootNode);
            const seen = new Set();
            sources.forEach((level) => {
              if (!level || !Array.isArray(level.topQuestions)) return;
              level.topQuestions.forEach((q) => {
                if (seen.has(q.id)) return;
                seen.add(q.id);
                pushQuestionStep(steps, q, topAnswers);
              });
            });
          }

          // 4. Cascade : pour chaque niveau, inputs → choix → topQuestions,
          //    dans le même ordre que renderCascade.
          const cascade = [inlineRootNode, ...inlineChain.map((s) => s.node).filter(Boolean)];
          cascade.forEach((levelNode, levelIdx) => {
            if (!levelNode) return;

            getVisibleInputs(levelNode, vars).forEach((input) => {
              const raw = nodeInputs[input.id];
              const filled = raw != null && raw !== "";
              const isImage = (input.type || "text") === "image";
              steps.push({
                label: input.label || input.id || "",
                value: filled ? (isImage ? "IMAGE COLLÉE" : String(raw)) : "",
                state: filled ? "done" : "todo",
              });
            });

            if (Array.isArray(levelNode.choix) && levelNode.choix.length > 0) {
              const visibleChoix = levelNode.choix.filter(
                (option) => !option.conditions || contextMatches(option.conditions, vars)
              );
              if (visibleChoix.length > 0) {
                const chosen = inlineChain[levelIdx];
                steps.push({
                  label: levelNode.choicesTitle || "CHOIX",
                  value: chosen ? chosen.label || "" : "",
                  state: chosen ? "done" : "todo",
                  // Cliquer = revenir directement à ce niveau (on coupe la suite).
                  goTo: chosen ? { type: "level", levelIdx: levelIdx } : null,
                });
              }
            }

            if (levelIdx > 0 && Array.isArray(levelNode.topQuestions)) {
              levelNode.topQuestions.forEach((q) => pushQuestionStep(steps, q, topAnswers));
            }
          });

          // 5. leafQuestions du nœud le plus profond (DRETAF, DCA, AE/TI…)
          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions)) {
            leaf.leafQuestions.forEach((q) => {
              if (!contextMatches(q.conditions, vars)) return;
              pushQuestionStep(steps, q, leafAnswers);
              if (leafAnswers[q.id] === "oui" && Array.isArray(q.inputsOnYes)) {
                q.inputsOnYes.forEach((input) => {
                  const v = leafInputs[input.id];
                  steps.push({
                    label: input.label || input.id || "",
                    value: v || "",
                    state: v ? "done" : "todo",
                  });
                });
              }
            });
          }

          // 5 bis. Checklist du MODE OPÉRATOIRE (DCD) : une seule ligne de
          //        progression, le détail est dans la colonne principale.
          const clNode = getChecklistNode();
          if (clNode) {
            const { done, total } = countChecklist(buildChecklistModel(clNode, vars));
            steps.push({
              label: "MODE OPÉRATOIRE",
              value: done + "/" + total + " ÉTAPES",
              state: total > 0 && done === total ? "done" : "todo",
            });
          }

          // 6. Résultat — renseigné après coup par renderPathPanel, qui est
          //    appelé APRÈS renderResults et peut donc compter les blocs réels.
          return steps;
        }

        function applyPathGoTo(goTo) {
          if (!goTo) return;
          if (goTo.type === "category") {
            // Retour à la racine de la catégorie : on vide la cascade.
            inlineChain = [];
          } else if (goTo.type === "level") {
            inlineChain = inlineChain.slice(0, goTo.levelIdx);
          }
          // COMPTE / STATUT (globalSelections) ne sont jamais touchés.
          render();
        }

        // Valeur affichée pour une étape. « / » signifie : étape atteinte, mais
        // pas encore renseignée. Attention : NON est une vraie valeur, elle ne
        // doit jamais devenir « / ».
        const PATH_EMPTY = "/";
        function pathStepValue(step) {
          return step.value === "" || step.value == null ? PATH_EMPTY : String(step.value);
        }

        // Marque les étapes : la 1ère non franchie devient l'étape en cours.
        function markPathSteps(steps) {
          let currentFound = false;
          steps.forEach((step) => {
            if (!currentFound && step.state !== "done") {
              step.state = "current";
              currentFound = true;
            }
          });
          return steps;
        }

        function renderPathPanel() {
          pathPanel.innerHTML = "";

          const steps = markPathSteps(buildPathSteps());

          const doneCount = steps.filter((s) => s.state === "done").length;
          pathCount.textContent = doneCount + "/" + steps.length;

          steps.forEach((step, idx) => {
