            // par hasard et se faire mutiler par le raccourcissement de date, ce qui
            // casserait l'image. On met donc les data URL de côté le temps du
            // remplacement, puis on les remet telles quelles.
            const dataUris = [];
            result = result.replace(
              /data:[a-z0-9.+-]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/gi,
              (uri) => {
                dataUris.push(uri);
                return "\u0001DATAURI" + (dataUris.length - 1) + "\u0001";
              }
            );
            result = result.replace(/(\b\d{2}\/\d{2}\/)\d{2}(\d{2}\b)/g, "$1$2");
            result = result.replace(
              /\u0001DATAURI(\d+)\u0001/g,
              (whole, idx) => dataUris[Number(idx)]
            );
          }
          return result;
        }

        // Transforme un copié-collé brut "Ecritures du compte" en lignes propres :
        //   "Ecritures du compte 31/03/2026    86  €    TELEPAIEMENT     COTISANT"
        //   → "31/03/2026 86€ TELEPAIEMENT COTISANT"
        function cleanEcritures(text) {
          return String(text || "")
            .split("\n")
            .map((line) =>
              line
                .replace(/Ecritures du compte/gi, "")
                .replace(/(\d)\s+€/g, "$1€")
                .replace(/\s+/g, " ")
                .trim()
            )
            .filter((line) => line.length > 0)
            .join("\n");
        }

        function contextMatches(conditions, vars) {
          if (!conditions || typeof conditions !== "object") return true;
          return Object.entries(conditions).every(([key, allowed]) => {
            const currentValue = vars[key];
            if (Array.isArray(allowed)) return allowed.includes(currentValue);
            // Conditions numériques : { ">=": 36, "<": 50, ... }
            if (allowed && typeof allowed === "object") {
              const num = parseFloat(currentValue);
              if (Number.isNaN(num)) return false;
              return Object.entries(allowed).every(([op, v]) => {
                const target = parseFloat(v);
                if (Number.isNaN(target)) return false;
                switch (op) {
                  case ">": return num > target;
                  case "<": return num < target;
                  case ">=": return num >= target;
                  case "<=": return num <= target;
                  case "==": case "===": return num === target;
                  case "!=": case "!==": return num !== target;
                  default: return false;
                }
              });
            }
            return currentValue === allowed;
          });
        }

        function buildTemplateVars() {
          const vars = {};
          (globalContextOptions || []).forEach((opt) => {
            vars[opt.id] = globalSelections[opt.id] || "";
          });
          Object.assign(vars, nodeInputs || {});
          Object.assign(vars, leafAnswers || {});
          Object.assign(vars, leafInputs || {});
          Object.assign(vars, topAnswers || {});

          // Préfixe métier : "ANV PARTIELLE" par défaut (ACTIF + non sélectionné),
          // "ANV" uniquement si RADIÉ explicitement choisi.
          vars["motif-prefix"] = globalSelections.compte === "RADIÉ" ? "ANV" : "ANV PARTIELLE";
          // "Compte actif" par défaut (et si rien n'est coché), "Compte radié" si RADIÉ
          vars["compte-display"] = globalSelections.compte === "RADIÉ" ? "radié" : "actif";
          // Date du jour au format JJ/MM/AA, recalculée à chaque rendu.
          // Utilisée pour les templates qui demandent "date du jour" (ex: motif 13 RELANCE).
          const _now = new Date();
          vars["today"] =
            String(_now.getDate()).padStart(2, "0") + "/" +
            String(_now.getMonth() + 1).padStart(2, "0") + "/" +
            String(_now.getFullYear()).slice(-2);

          // Variable dérivée pour DÉLAI : "oui" si l'input MOIS > 36, sinon "non"
          // (incluant le cas où MOIS est vide → on affiche le texte par défaut ≤ 36).
          const _moisNum = parseFloat(nodeInputs.mois);
          vars["mois-gt-36"] = !Number.isNaN(_moisNum) && _moisNum > 36 ? "oui" : "non";

          // Deuxième seuil pour DÉLAI, à ne pas confondre avec les 36 mois ci-dessus :
          //   36 mois → pilote quelle version du TEXTE DU COURRIER s'affiche
          //   18 mois → pilote le motif de refus écrit dans l'AFFAIRE WATT
          // Même règle de défaut : MOIS vide → "non", donc aucune mention de seuil.
          vars["mois-gt-18"] = !Number.isNaN(_moisNum) && _moisNum > 18 ? "oui" : "non";

          // Motif du refus dans l'AFFAIRE WATT de DÉLAI / REFUS - PAS DE PJ
          // (PO REFUS 06 en A/C, 65 en PL — seul le code change, pas le motif).
          // Deux critères INDÉPENDANTS peuvent justifier le refus : une dette
          // supérieure à 50 000€, et/ou une durée supérieure à 18 mois. D'où les
          // 4 combinaisons ci-dessous, dont le cas où aucun des deux n'est rempli :
          // on n'invente alors aucun seuil, la phrase s'arrête après "de délai".
          // La variable porte l'espace qui la précède ET le point final, sinon le
          // cas "aucun critère" laisserait une espace en trop avant le point.
          // Source unique : si tu changes ces formulations, c'est ici et nulle part
          // ailleurs — les 4 blocs WATT de DÉLAI utilisent tous cette variable.
          const _delai50k = vars.plus50k === "oui";
          const _delai18m = vars["mois-gt-18"] === "oui";
          vars["phrase-refus-delai"] =
            _delai50k && _delai18m
              ? " avec une dette supérieure à 50 000€ et supérieur à 18 mois."
              : _delai50k
              ? " avec une dette supérieure à 50 000€."
              : _delai18m
              ? " supérieur à 18 mois."
              : ".";

          // Phrase finale "-> RELDET..." centralisée : version V2 si la topQuestion
          // "COMPTE EN LIGNE OU MAIL ?" est répondue NON, version standard sinon.
          // Source unique : si tu changes la phrase, tu la changes ici, point.
          vars["phrase-reldet"] = topAnswers["compte-en-ligne"] === "non"
            ? "-> RELDET fait en v2 car pas de compte en ligne ni de mail pour envoyer par SCRIBE"
            : "-> RELDET + formulaire de demande délai envoyé par SCRIBE";

          // ACCORD SINGULIER / PLURIEL DES VERSEMENTS (AMIABLE RELDET).
          // Le nombre de versements n'est pas une question posée à l'utilisateur :
          // il se lit dans le textarea ÉCRITURES, où chaque ligne correspond à
          // une écriture de compte (cleanEcritures supprime déjà les lignes vides).
          //   2 lignes ou plus  → pluriel
          //   0 ou 1 ligne      → singulier
          // On expose 3 formes pour couvrir les tournures existantes, plutôt que
          // de faire un remplacement de mots sur le texte final, qui produirait
          // des phrases fausses ailleurs. Source unique : ici, et nulle part ailleurs.
          const _nbEcritures = String(nodeInputs.ecritures || "")
            .split("\n")
            .map((l) => l.trim())
            .filter((l) => l.length > 0).length;
          const _versementsPluriel = _nbEcritures >= 2;
          // Début de segment, avec majuscule : "Plusieurs versements récents :"
          vars["versements-intro"] = _versementsPluriel
            ? "Plusieurs versements récents"
            : "Versement récent";
          // Après "suite" : "suite aux versements récents" / "suite au versement récent"
          vars["versements-suite"] = _versementsPluriel
            ? "aux versements récents"
            : "au versement récent";
          // Groupe nominal nu : "et versements récents" / "et versement récent"
          vars["versements-nom"] = _versementsPluriel
            ? "versements récents"
            : "versement récent";

          // Phrase "ET RECH EOPPS [+ FICOBA] RECENTE" centralisée : sans le "+ FICOBA"
          // si la topQuestion FICOBA est répondue NON (motif 12 A/C). Source unique.
          // Motif 12 (A/C et PL) : mention ajoutée seulement si la recherche EOPPS
          // est cochée dans le mode opératoire, « + FICOBA » seulement si la
          // recherche FICOBA l'est aussi. Commence par une espace (vide sinon).
          vars["phrase-eopps"] = checkState["psa-eopps"] !== true ? ""
            : checkState.ficoba === "oui" && checkState["psa-ficoba"] === true ? " ET RECH EOPPS + FICOBA RECENTE"
            : " ET RECH EOPPS RECENTE";

          // Phrase "frais frustratoires" centralisée : en ACTIF (et par défaut) on
          // précise qu'on attend d'autres contraintes pour une réexécution groupée ;
          // en RADIÉ, plus de contraintes à venir, donc phrase courte. Source unique.
          vars["phrase-frustratoires"] = vars.compte === "RADIÉ"
            ? "Pas de réexécution car frais frustratoires"
            : "Pas de réexécution car frais frustratoires, en attente d'autres contraintes pour faire une réexécution groupée";

          // RÉEXÉCUTION : "date-prescription-full" expand JJ/MM/AA en JJ/MM/AAAA
          // (l'inverse du raccourcissement global). Si l'user tape déjà 4 chiffres,
          // c'est un no-op.
          const _dp = nodeInputs["date-prescription"];
          vars["date-prescription-full"] = _dp
            ? String(_dp).replace(
                /(\b\d{2}\/\d{2}\/)(\d{2})\b(?!\d)/g,
                (_m, prefix, yy) => prefix + "20" + yy
              )
            : "";

          // RÉEXÉCUTION : adresse forcée en majuscules dans le résultat copié,
          // peu importe la casse tapée par l'utilisateur.
          if (vars.adresse) vars.adresse = String(vars.adresse).toUpperCase();

          // Catégorie active (pour skip le raccourcissement dans RÉEXÉCUTION)
          const _categoryNode = activeToggleStack.length > 0
            ? activeToggleStack[0].savedRootNode
            : inlineRootNode;
          const _cat = (window.treeData.choix || []).find((c) => c.suite === _categoryNode);
          vars.__category = _cat ? _cat.id : "";

          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions)) {
            leaf.leafQuestions.forEach((q) => {
              if (!contextMatches(q.conditions, vars)) {
                delete vars[q.id];
                if (Array.isArray(q.inputsOnYes)) {
                  q.inputsOnYes.forEach((inp) => {
                    delete vars[inp.id];
                  });
                }
              }
            });
          }

          const levels = inlineRootNode ? [inlineRootNode, ...inlineChain.map((s) => s.node)] : [];
          levels.forEach((levelNode, idx) => {
            if (!levelNode || !levelNode.choicesTitle) return;
            const slug = levelNode.choicesTitle
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");
            const choice = inlineChain[idx];
            if (!choice) return;
            const parts = splitMotifLabel(choice.label || "");
            vars[`${slug}-id`] = choice.id || "";
            vars[`${slug}-label`] = choice.label || "";
            vars[`${slug}-code`] = parts.code;
            vars[`${slug}-text`] = parts.text;
            // Abréviation dépendante du STATUT (pour sous-motifs avec abbrevAC / abbrevPL)
            const opt = choice.option || {};
            if (vars.statut === "A/C" && opt.abbrevAC) {
              vars[`${slug}-abbrev`] = opt.abbrevAC;
            } else if (vars.statut === "PL" && opt.abbrevPL) {
              vars[`${slug}-abbrev`] = opt.abbrevPL;
            }
          });

          addChecklistVars(vars, getChecklistNode());

          return vars;
        }

        // --------------------------------------------------------------------
        // MODE OPÉRATOIRE (checklist DCD) : variables calculées.
        // Source unique : si une règle du mode op change (6 mois, + 1 mois,
        // reroutage GCC, phrase des chambres…), c'est ici et nulle part ailleurs.
        // --------------------------------------------------------------------

        // Lit une date tapée "JJ/MM/AA" ou "JJ/MM/AAAA" (/, . ou - acceptés).
        // Renvoie null si la saisie n'est pas (encore) une date complète.
        function parseDateFr(text) {
          const m = String(text || "").trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2}|\d{4})$/);
          if (!m) return null;
          const day = Number(m[1]);
          const month = Number(m[2]) - 1;
          const year = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
          const d = new Date(year, month, day);
          if (d.getFullYear() !== year || d.getMonth() !== month || d.getDate() !== day) return null;
          return d;
        }

        // Ajoute N mois sans déborder : le 31/01 + 1 mois donne le 28 (ou 29)/02,
        // et pas le 03/03 comme le ferait un calcul naïf.
        function addMonths(date, n) {
          const target = new Date(date.getFullYear(), date.getMonth() + n, 1);
          const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
          target.setDate(Math.min(date.getDate(), lastDay));
          return target;
        }

        function formatDateLong(d) {
          return (
            String(d.getDate()).padStart(2, "0") + "/" +
            String(d.getMonth() + 1).padStart(2, "0") + "/" +
            d.getFullYear()
          );
        }

        // Met une adresse sur 2 lignes : « 15 rue de Paris 75005 Paris »
        //   → « 15 rue de Paris » / « 75005 Paris ».
        // - déjà sur plusieurs lignes : on garde ses lignes (nettoyées) ;
        // - sur une ligne : on coupe juste avant le DERNIER code postal
        //   (5 chiffres, ou « 75 005 ») ; sans code postal, on ne touche à rien.
        function formatAdresse(text) {
          const lines = String(text || "")
            .split("\n")
            .map((l) => l.replace(/\s+/g, " ").trim())
            .filter((l) => l.length > 0);
          if (lines.length !== 1) return lines.join("\n");
          const one = lines[0];
          const matches = [...one.matchAll(/(?:^|[\s,])(\d{2}\s?\d{3})(?=[\s,]|$)/g)];
          if (matches.length === 0) return one;
          const m = matches[matches.length - 1];
          const cut = m.index + m[0].indexOf(m[1]);
          const rue = one.slice(0, cut).replace(/[\s,;-]+$/, "").trim();
          const ville = one.slice(cut).replace(/^(\d{2})\s(\d{3})/, "$1$2").replace(/^(\d{5}),?\s*/, "$1 ").trim();
          return rue ? rue + "\n" + ville : ville;
        }

        // "93" → "93", "1" → "01", "2a" → "2A". Vide si la saisie n'est pas un département.
        // Nom des départements, pour les consignes (« département 37 (Indre-et-Loire) »).
        const NOMS_DEPTS = { "01": "Ain", "02": "Aisne", "03": "Allier", "04": "Alpes-de-Haute-Provence", "05": "Hautes-Alpes", "06": "Alpes-Maritimes", "07": "Ardèche", "08": "Ardennes", "09": "Ariège", "10": "Aube", "11": "Aude", "12": "Aveyron", "13": "Bouches-du-Rhône", "14": "Calvados", "15": "Cantal", "16": "Charente", "17": "Charente-Maritime", "18": "Cher", "19": "Corrèze", "2A": "Corse-du-Sud", "2B": "Haute-Corse", "21": "Côte-d'Or", "22": "Côtes-d'Armor", "23": "Creuse", "24": "Dordogne", "25": "Doubs", "26": "Drôme", "27": "Eure", "28": "Eure-et-Loir", "29": "Finistère", "30": "Gard", "31": "Haute-Garonne", "32": "Gers", "33": "Gironde", "34": "Hérault", "35": "Ille-et-Vilaine", "36": "Indre", "37": "Indre-et-Loire", "38": "Isère", "39": "Jura", "40": "Landes", "41": "Loir-et-Cher", "42": "Loire", "43": "Haute-Loire", "44": "Loire-Atlantique", "45": "Loiret", "46": "Lot", "47": "Lot-et-Garonne", "48": "Lozère", "49": "Maine-et-Loire", "50": "Manche", "51": "Marne", "52": "Haute-Marne", "53": "Mayenne", "54": "Meurthe-et-Moselle", "55": "Meuse", "56": "Morbihan", "57": "Moselle", "58": "Nièvre", "59": "Nord", "60": "Oise", "61": "Orne", "62": "Pas-de-Calais", "63": "Puy-de-Dôme", "64": "Pyrénées-Atlantiques", "65": "Hautes-Pyrénées", "66": "Pyrénées-Orientales", "67": "Bas-Rhin", "68": "Haut-Rhin", "69": "Rhône", "70": "Haute-Saône", "71": "Saône-et-Loire", "72": "Sarthe", "73": "Savoie", "74": "Haute-Savoie", "75": "Paris", "76": "Seine-Maritime", "77": "Seine-et-Marne", "78": "Yvelines", "79": "Deux-Sèvres", "80": "Somme", "81": "Tarn", "82": "Tarn-et-Garonne", "83": "Var", "84": "Vaucluse", "85": "Vendée", "86": "Vienne", "87": "Haute-Vienne", "88": "Vosges", "89": "Yonne", "90": "Territoire de Belfort", "91": "Essonne", "92": "Hauts-de-Seine", "93": "Seine-Saint-Denis", "94": "Val-de-Marne", "95": "Val-d'Oise", "971": "Guadeloupe", "972": "Martinique", "973": "Guyane", "974": "La Réunion", "976": "Mayotte" };
        const deptAvecNom = (d) => (NOMS_DEPTS[d] ? d + " (" + NOMS_DEPTS[d] + ")" : d);

        function normalizeDept(text) {
          let v = String(text || "").trim().toUpperCase().replace(/\s+/g, "");
          if (/^\d$/.test(v)) v = "0" + v;
          return /^(\d{2,3}|2A|2B)$/.test(v) ? v : "";
        }

        // Étape avec des champs (N° D'ACTE, NOM…) : on CONSEILLE de les remplir
        // avant de cocher (ils servent aux textes à copier et au commentaire
        // WATT), sans l'interdire.
        function champsRemplis(item) {
          return (item.champs || []).every((c) => String(nodeInputs[c.id] || "").trim() !== "");
        }

        function addChecklistVars(vars, leaf) {
          // 1. Cases cochées / questions : utilisables dans les "if" par leur id.
          //    Une question pas encore répondue vaut "" (ex : if ["non", ""] =
          //    "afficher tant qu'on n'a pas répondu OUI").
          const clDef = leaf && leaf.checklist;
          if (clDef && Array.isArray(clDef.sections)) {
            clDef.sections.forEach((sec) =>
              (sec.items || []).forEach((it) => {
                if (it.type === "question") vars[it.id] = "";
              })
            );
          }
          Object.entries(checkState).forEach(([id, val]) => {
            if (val === true) vars[id] = "oui";
            else if (val === false) vars[id] = "non";
            else if (val != null) vars[id] = val;
          });

          // 1 quater. ANV SUSPEN (versement récent, compte radié) : 7 mois après
          //          la date du dernier versement.
          const dernierVersement = parseDateFr(nodeInputs["date-dernier-versement"]);
          vars["date-anv-suspen"] = dernierVersement
            ? formatDateLong(addMonths(dernierVersement, 7))
            : "… (saisir la date du dernier versement)";

          // 1 quinquies. ANV : phrase de la double vérification selon les choix
          //   (ANV SUSPEN, DRETAF, A/C = post-it / PL = ESDC), avec les accords.
          {
            const radie = vars.compte === "RADIÉ";
            const suspenOui = radie && checkState.suspen === "oui";
            const nbCo = checkState.dretaf === "oui" ? Math.max(1, parseInt(checkState["co-nb"], 10) || 1) : 0;
            const pl = vars.statut === "PL";
            // Documents à rattacher : justificatif (sauf motif 16), pages EOPPS / FICOBA.
            const motif12 = vars["motif-id"] === "motif-12-psa";
            const docs = [];
            if (vars["motif-id"] !== "motif-16-creance-seuil") docs.push("justificatif");
            if (motif12 && checkState["psa-eopps-adresse"] === "non") docs.push("page EOPPS");
            if (motif12 && checkState.ficoba === "oui" && checkState["psa-ficoba-adresse"] === "non") docs.push("page FICOBA");
            const nbDocs = docs.length;
            const parts = ["l'ANV est bien codifiée"];
            if (suspenOui) parts.push("l'ANV SUSPEN bien codifiée");
            if (nbCo === 1) parts.push("le DRETAF bien codifié");
            if (nbCo > 1) parts.push("les " + nbCo + " DRETAF bien codifiés");
            if (pl) {
              parts.push(suspenOui ? "les ESDC (codes ANV et INCX) bien renseignés" : "l'ESDC bien renseigné");
              if (nbCo === 1) parts.push("le post-it DRETAF bien renseigné");
              if (nbCo > 1) parts.push("les post-its DRETAF bien renseignés");
            } else {
              const nbPostits = 1 + (suspenOui ? 1 : 0) + nbCo;
              parts.push(nbPostits > 1 ? "les post-its bien renseignés" : "le post-it bien renseigné");
            }
            if (nbDocs === 1) parts.push("le " + docs[0] + " bien rattaché à l'affaire");
            if (nbDocs > 1) parts.push("les documents bien rattachés à l'affaire (" + docs.join(", ") + ")");
            vars["double-check"] = parts.length > 1
              ? parts.slice(0, -1).join(", ") + " et " + parts[parts.length - 1]
              : parts[0];
          }

          // 1 sexies. Parcours RELDET (VERSEMENT RÉCENT / DETTE NON EXIGIBLE) :
          //   phrase de la double vérification selon les choix.
          {
            const parcours = activeToggleStack.length ? activeToggleStack[activeToggleStack.length - 1].toggle.id : "";
            vars["parcours-reldet"] = parcours;
            const p = [];
            const enLigne = topAnswers["compte-en-ligne"];
            if (enLigne === "oui") p.push("le relevé de dette bien envoyé par SCRIBE");
            else if (enLigne === "non") p.push("le RELDET bien codifié en V2");
            if (parcours === "amiable-reldet" && vars.compte === "RADIÉ") {
              p.push("l'ANV SUSPEN bien codifiée", "son post-it bien renseigné");
            }
            p.push("le commentaire WATT bien renseigné");
            vars["double-check-reldet"] = p.length > 1 ? p.slice(0, -1).join(", ") + " et " + p[p.length - 1] : p[0];
          }

          // 1 ter. ANV : ce qui est choisi à gauche (CONTEXTE), pour les deux
          //        premières étapes cochées toutes seules.
          vars["compte-affiche"] = vars.compte || "à choisir à gauche";
          vars["statut-affiche"] = vars.statut || "à choisir à gauche";
          // ANV SUSPEN ne concerne que les comptes radiés : une réponse donnée
          // avant de repasser en ACTIF ne doit pas rester dans les textes.
          if (vars.compte !== "RADIÉ") vars.suspen = "";

          // 1 bis. ANV : une ligne de post-it « DRETAF CO … pour passer ANV » par
          //        contrainte saisie dans les vérifications (au moins une).
          const nbCo = Math.max(1, parseInt(checkState["co-nb"], 10) || 1);
          const lignesCo = [];
          for (let k = 1; k <= nbCo; k++) {
            const num = String(nodeInputs["co-" + k] || "").trim();
            if (num || k === 1) lignesCo.push("DRETAF CO " + num + " pour passer ANV");
          }
          vars["dretaf-postits"] = lignesCo.join("\n");

          // 2. Date d'effet de l'ADM NV : date du jour + 1 mois (JJ/MM/AAAA).
          vars["date-effet-m1"] = formatDateLong(addMonths(new Date(), 1));

          // 3. Décès de plus de 6 mois ? "" tant que la date n'est pas saisie.
          const deces = parseDateFr(nodeInputs["date-deces"]);
          //    Une date dans le futur est signalée (deces-futur) et traitée
          //    comme "pas encore saisie". deces-date-lue / deces-mois servent
          //    à afficher ce que l'appli a compris de la saisie.
          const now = new Date();
          const futur = !!deces && deces > now;
          vars["deces-futur"] = futur ? "oui" : "non";
          vars["deces-date-lue"] = deces ? formatDateLong(deces) : "";
          vars["deces-mois"] = deces && !futur
            ? String(
                (now.getFullYear() - deces.getFullYear()) * 12 +
                  (now.getMonth() - deces.getMonth()) -
                  (now.getDate() < deces.getDate() ? 1 : 0)
              )
            : "";
          vars["deces-plus-6-mois"] = deces && !futur ? (addMonths(deces, 6) <= now ? "oui" : "non") : "";

          // 4. Reroutage GCC : seulement si (pas radié DCD OU affaire GCC en cours)
          //    ET que la DLP n'est pas proche.
          const bloque = vars["dcd-dlp-proche"] === "oui";
          const motifReroutage = vars["dcd-radie-dcd"] === "non" || vars["dcd-affaire-gcc"] === "oui";
          vars["reroutage-gcc"] = motifReroutage && !bloque ? "oui" : "non";
          vars["traitement-stop"] =
            vars["reroutage-gcc"] === "oui" || vars["dcd-dlp-proche"] === "oui" ? "oui" : "non";

          // 5 ter. Relevés SNGI rappelés (en lecture seule) sous la demande à la
          //        mairie : en MAJUSCULES, repère entre crochets si vide.
          const numActe = String(nodeInputs["num-acte"] || "").trim();
          const lieuDeces = String(nodeInputs["lieu-deces"] || "").trim();
          vars["num-acte-aff"] = numActe ? numActe.toUpperCase() : "[À RELEVER DANS SNGI]";
          vars["lieu-deces-aff"] = lieuDeces ? lieuDeces.toUpperCase() : "[À RELEVER DANS SNGI]";

          // 5 bis. Courrier aux héritiers : nom et adresse en MAJUSCULES pour
          //        le bloc DESTINATAIRE à copier. Un repère entre crochets
          //        tant que le champ est vide (on voit ce qu'il manque).
          const nomDefunt = String(nodeInputs["nom-defunt"] || "").trim();
          const adresseDefunt = String(nodeInputs["adresse-defunt"] || "").trim();
          vars["nom-defunt-maj"] = nomDefunt ? nomDefunt.toUpperCase() : "[NOM ET PRÉNOM]";
          vars["adresse-defunt-maj"] = adresseDefunt
            ? formatAdresse(adresseDefunt).toUpperCase()
            : "[DERNIÈRE ADRESSE CONNUE]";

          // 5. Mairie du lieu de décès (phrase du commentaire WATT).
          const lieu = String(nodeInputs["lieu-deces"] || "").trim();
          vars["mairie-deces"] = lieu ? "la mairie de " + lieu.toUpperCase() : "la mairie du lieu de décès";

          // 6. Chambres des notaires selon les départements de naissance et de
          //    dernier domicile (sans doublon : 75 + 93 = une seule chambre).
          const cl = leaf && leaf.checklist;
          const chambres = (cl && Array.isArray(cl.chambresNotaires)) ? cl.chambresNotaires : [];
          const depts = [];
          [nodeInputs["dept-naissance"], nodeInputs["dept-domicile"]].forEach((raw) => {
            const d = normalizeDept(raw);
            if (d && !depts.includes(d)) depts.push(d);
          });
          const deptsAutres = [];
          const deptsInterroges = []; // départements dont la demande est cochée
          // Autre chambre : un bloc PAR département, chacun avec son mode
          // d'envoi (ids dcd-notaire-autre-<dépt>-envoi / -demande / -pj-acte / -ar).
          const envoiDe = (d) => checkState["dcd-notaire-autre-" + d + "-envoi"] || "";
          chambres.forEach((ch) => { vars["chambre-" + ch.id] = "non"; });
          depts.forEach((d) => {
            const ch = chambres.find((c) => (c.depts || []).includes(d));
            if (ch) vars["chambre-" + ch.id] = "oui";
            else deptsAutres.push(d);
            // (pour une autre chambre, il faut aussi que le mode d'envoi soit choisi)
            const demandeFaite = ch
              ? checkState["dcd-notaire-" + ch.id + "-demande"] === true
              : checkState["dcd-notaire-autre-" + d + "-demande"] === true && !!envoiDe(d);
            if (demandeFaite) deptsInterroges.push(d);
          });
          vars["chambre-autre"] = deptsAutres.length > 0 ? "oui" : "non";
          vars["depts-autres"] = deptsAutres.join(" ET ");
          // Un PDF de formulaire à rattacher : chambre à formulaire (Paris, 77, 91)
          // ou autre chambre interrogée par formulaire en ligne.
          const nbChambresForm =
            chambres.filter((ch) => vars["chambre-" + ch.id] === "oui").length +
            deptsAutres.filter((d) => envoiDe(d) === "formulaire").length;
          const nbChambres = chambres.filter((ch) => vars["chambre-" + ch.id] === "oui").length + deptsAutres.length;
          vars["dcd-docs-chambres"] = nbChambresForm > 0 ? "oui" : "non";

          // Phrase de la DOUBLE VÉRIFICATION DCD, selon les étapes affichées.
          {
            const p = [];
            if (vars.statut === "A/C") p.push("l'arrêt début motif 25 bien positionné");
            if (vars.statut === "PL") p.push("la transaction CPTS TOP 06 bien faite");
            p.push("le courrier aux héritiers bien envoyé");
            if (vars["dcd-acte-ged"] !== "oui") p.push("la demande d'acte à la mairie bien envoyée");
            if (nbChambres === 1) p.push("la demande à la chambre des notaires bien envoyée");
            if (nbChambres > 1) p.push("les demandes aux " + nbChambres + " chambres des notaires bien envoyées");
            const docs = ["page SNGI"];
            if (nbChambresForm > 0) docs.push(nbChambresForm > 1 ? "PDF des formulaires des chambres" : "PDF du formulaire de la chambre");
            if (vars["deces-plus-6-mois"] !== "non") docs.push("recherche succession vacante");
            p.push("les documents bien rattachés à l'affaire (" + docs.join(", ") + ")");
            p.push("l'ESDC, l'ENQ et l'ADM NV bien codifiés", "le commentaire WATT bien renseigné");
            vars["double-check-dcd"] = p.slice(0, -1).join(", ") + " et " + p[p.length - 1];
          }

          // 7. Phrase WATT : uniquement les départements réellement interrogés,
          //    regroupés par mode d'envoi, avec l'accord singulier / pluriel.
          //    Les chambres de Paris / 77 / 91 passent toujours par leur formulaire.
          vars["dcd-notaires-demande"] = deptsInterroges.length > 0 ? "oui" : "non";
          const modeDe = (d) => (deptsAutres.includes(d) ? envoiDe(d) : "formulaire");
          const deptsForm = deptsInterroges.filter((d) => modeDe(d) === "formulaire");
          const deptsMail = deptsInterroges.filter((d) => modeDe(d) === "mail");
          const deptsCourrier = deptsInterroges.filter((d) => modeDe(d) === "courrier");
          // Acte de décès (GED) joint au SCRIBE : seulement par mail / courrier,
          // et si c'est coché pour tous les départements du groupe.
          const pjActe = (ds) =>
            vars["dcd-acte-ged"] === "oui" &&
            ds.every((d) => checkState["dcd-notaire-autre-" + d + "-pj-acte"] === true);

          const chambresDe = (depts) =>
            (depts.length > 1 ? "Chambres des notaires du " : "Chambre des notaires du ") + depts.join(" et du ");
          const interrogees = (depts) => (depts.length > 1 ? " interrogées" : " interrogée");
          const finJustif = (depts) =>
            depts.length > 1 ? "justificatifs rattachés à l'affaire" : "justificatif rattaché à l'affaire";
          const phrases = [];
          if (deptsForm.length > 0) {
            phrases.push(chambresDe(deptsForm) + interrogees(deptsForm) + " via formulaire en ligne, " + finJustif(deptsForm));
          }
          [[deptsMail, "mail"], [deptsCourrier, "courrier"]].forEach(([ds, mode]) => {
            if (ds.length === 0) return;
            // Par SCRIBE (mail / courrier) : pas de justificatif à rattacher.
            phrases.push(chambresDe(ds) + interrogees(ds) + " par SCRIBE envoyé par " + mode + (pjActe(ds) ? ", acte de décès joint" : ""));
          });
          // Une ligne par mode d'envoi dans le commentaire WATT (le saut de
          // ligne devient <br> à l'insertion, voir substituteTemplate).
          vars["phrase-chambres"] = phrases.join("\n");
        }

        // Lignes de saisie de la cascade (ÉCRITURES, DATE…) : fond vert quand
        // tous leurs champs sont remplis, comme un choix fait. Appelé au rendu
        // et à chaque frappe (sans redessiner le champ, le curseur reste).
        function marquerChampsRemplis() {
          cascadeFlow.querySelectorAll(".card-row").forEach((row) => {
            const champs = [...row.querySelectorAll("input[data-input-id], textarea[data-input-id]")];
            if (!champs.length) return;
            const remplis = champs.every((f) => String(nodeInputs[f.getAttribute("data-input-id")] || "").trim() !== "");
            row.classList.toggle("is-done", remplis);
          });
        }

        function getDeepestNode() {
          const lastChainEntry = inlineChain[inlineChain.length - 1];
          if (lastChainEntry && lastChainEntry.node) return lastChainEntry.node;
          return inlineRootNode || getCurrentNode();
        }

        // Nœud qui porte la checklist affichée : la feuille la plus profonde
        // (DCD), sinon la racine de la catégorie (ANV : vérifications en haut,
        // gardées pendant qu'on choisit le motif).
        function getChecklistNode() {
          const deep = getDeepestNode();
          if (deep && deep.checklist) return deep;
          if (inlineRootNode && inlineRootNode.checklist) return inlineRootNode;
          return null;
        }

        // Checklist avec stopIf vérifié (ex : ANV + versement récent) : motifs,
        // questions et résultats sont masqués, seul le bandeau rouge reste.
        // Heure à laquelle une étape a été cochée / répondue (pour le récap PDF).
        function noterHeure(id, fait) {
          if (fait) checkState["@t:" + id] = Date.now();
          else delete checkState["@t:" + id];
        }

        function choisirContexte(groupId, value) {
          if (globalSelections[groupId] === value) return;
          globalSelections[groupId] = value;
          pruneInlineChain();
          render();
        }

        // Ligne COMPTE [ACTIF][RADIÉ]  STATUT [A/C][PL] en haut des onglets
        // sans mode opératoire (DÉLAI, RÉEXÉCUTION).
        function makeContexteRow() {
          const card = document.createElement("section");
          const complet = (window.globalContextOptions || []).every((g) => !!globalSelections[g.id]);
          card.className = "card-row" + (complet ? " is-done" : "");
          const content = document.createElement("div");
          content.className = "card-row-content";
          (window.globalContextOptions || []).forEach((g) => {
            const lbl = document.createElement("span");
            lbl.className = "leaf-input-label";
            lbl.textContent = g.label;
            content.appendChild(lbl);
            g.choix.forEach((v) => {
              const b = document.createElement("button");
              b.type = "button";
              b.className = "context-option pill-btn" + (globalSelections[g.id] === v ? " is-selected" : "");
              b.textContent = v;
              b.addEventListener("click", () => choisirContexte(g.id, v));
              content.appendChild(b);
            });
          });
          card.appendChild(content);
          return card;
        }

        function syncAutoChecks() {
          const n = getChecklistNode();
          if (!n || !Array.isArray(n.checklist.sections)) return;
          const visit = (it) => {
            if (Array.isArray(it.items)) it.items.forEach(visit);
            if (Array.isArray(it.modele)) for (let k = 1; k <= listeNb(it); k++) listeBloc(it, k).forEach(visit);
            // Question « contexte » : sa réponse = COMPTE / STATUT du dossier.
            if (it.contexte) {
              const v = globalSelections[it.contexte];
              if (v) {
                if (checkState[it.id] !== v) { checkState[it.id] = v; noterHeure(it.id, true); }
              } else if (checkState[it.id]) {
                delete checkState[it.id];
                noterHeure(it.id, false);
              }
            }
            if (it.autoCoche) {
              checkState[it.id] = !!globalSelections[it.autoCoche];
              if (checkState[it.id] && !checkState["@t:" + it.id]) noterHeure(it.id, true);
              if (!checkState[it.id]) noterHeure(it.id, false);
            }
            // Champ obligatoire vidé après coup : la case se décoche.
            if (it.champsObligatoires && checkState[it.id] === true && !champsRemplis(it)) {
              checkState[it.id] = false;
              noterHeure(it.id, false);
            }
          };
          n.checklist.sections.forEach((sec) => (sec.items || []).forEach(visit));
        }

        function checklistStops() {
          const n = getChecklistNode();
          if (!n) return false;
          const vars = buildTemplateVars();
          if (n.checklist.stopIf && contextMatches(n.checklist.stopIf, vars)) return true;
          return !!buildChecklistModel(n, vars).stopped;
        }

        function pruneInlineChain() {
          const vars = buildTemplateVars();
          let validLength = 0;
          for (let i = 0; i < inlineChain.length; i++) {
            const parentNode = i === 0 ? inlineRootNode : inlineChain[i - 1].node;
            if (!parentNode || !Array.isArray(parentNode.choix)) break;
            const option = parentNode.choix.find((o) => o.id === inlineChain[i].id);
            if (!option) break;
            if (option.conditions && !contextMatches(option.conditions, vars)) break;
            validLength = i + 1;
          }
          if (validLength < inlineChain.length) {
            inlineChain = inlineChain.slice(0, validLength);
          }
        }

        function findNextTarget() {
          const vars = buildTemplateVars();
          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions) && leaf.leafQuestions.length > 0) {
            let allAnswered = true;
            for (const q of leaf.leafQuestions) {
              if (!contextMatches(q.conditions, vars)) continue;
              if (leafAnswers[q.id] == null) {
                // Plus de scroll auto vers la carte DRETAF/SUSPEN non répondue.
                // (Comportement précédent jugé perturbant.)
                allAnswered = false;
                continue;
              }
              if (leafAnswers[q.id] === "oui" && Array.isArray(q.inputsOnYes)) {
                for (const inp of q.inputsOnYes) {
                  if (!leafInputs[inp.id]) {
                    return { type: "input", id: `leafInput-${inp.id}` };
                  }
                }
              }
            }
            if (allAnswered) return { type: "element", id: "resultsContainer" };
            return null;
          }
          if (leaf && Array.isArray(leaf.resultats) && leaf.resultats.length > 0) {
            return { type: "element", id: "resultsContainer" };
          }
          if (inlineRootNode) {
            return { type: "element", id: `cascade-level-${inlineChain.length}` };
          }
          return null;
        }

        function scrollToTarget(target) {
          if (!target) return;
          // Ne scrolle que si la cible change (évite de renvoyer aux résultats quand on réédite)
          if (target.id === lastScrollTargetId) return;
          lastScrollTargetId = target.id;
          requestAnimationFrame(() => {
            const el = document.getElementById(target.id);
            if (!el) return;
            el.scrollIntoView({ behavior: "auto", block: "center" });
            if (target.type === "input" && typeof el.focus === "function") el.focus();
          });
        }

        function renderBreadcrumbs() {
          breadcrumbs.innerHTML = "";
          let visibleCount = 0;

          if (inlineRootNode && trail.length === 1) {
            breadcrumbsSection.classList.add("hidden");
            return;
          }

          trail.forEach((item, index) => {
            if (index === 0) {
              return;
            }

            visibleCount += 1;

            const isLast = index === trail.length - 1;

            const crumb = document.createElement("button");
            crumb.type = "button";
            crumb.className = isLast
              ? "font-bold text-strong cursor-default"
              : "text-muted hover:text-strong underline decoration-dotted";
            crumb.textContent = item.label;

            if (!isLast) {
              crumb.addEventListener("click", () => {
                trail = trail.slice(0, index + 1);
                render();
              });
            } else {
              crumb.disabled = true;
            }

            breadcrumbs.appendChild(crumb);

            if (!isLast) {
              const sep = document.createElement("span");
              sep.className = "text-muted";
              sep.textContent = ">";
              breadcrumbs.appendChild(sep);
            }
          });

          breadcrumbsSection.classList.toggle("hidden", visibleCount === 0);
        }

        function renderQuestion(node) {
          inlineTitleContainer.innerHTML = "";

          if (inlineRootNode) {
            questionZone.innerHTML = "";
            return;
          }

          if (!node.question) {
            questionZone.innerHTML = "";
            return;
          }

          questionZone.innerHTML = `
            <div class="fade-in rounded-2xl surface-shell border p-5 shadow-sm text-center">
              <h2 class="text-base md:text-lg font-bold text-muted">${escapeHtml(node.question)}</h2>
            </div>
          `;
        }

        function activateToggle(toggle) {
          activeToggleStack.push({ savedRootNode: inlineRootNode, toggle: toggle });
          inlineRootNode = toggle.whenOn;
          inlineChain = [];
          leafAnswers = {};
          leafInputs = {};
          const auto = toggle.whenOn.autoChoix;
          if (auto && contextMatches(auto.if, buildTemplateVars())) {
            const opt = (toggle.whenOn.choix || []).find((o) => o.id === auto.id);
            if (opt) inlineChain = [{ id: opt.id, label: opt.label, option: opt, node: opt.suite }];
          }
          window.scrollTo(0, 0);
          render();
        }

        // Parcours ouvert depuis le mode opératoire : tout est-il fait ? Si oui,
        // bouton « RÉCAP DES ÉTAPES » (même PDF que l'ANV) sous ses étapes de fin.
        function recapParcours(entry, vars) {
          const whenOn = entry.toggle.whenOn;
          if (!whenOn.recapDocument) return null;
          const visibles = (liste) => (liste || []).filter((it) => !it.if || contextMatches(it.if, vars));
          let toutFait = true;
          const verifier = (it) => {
            if (it.type === "groupe") return (it.items || []).filter((x) => !x.if || contextMatches(x.if, vars)).forEach(verifier);
            if (it.facultatif) return;
            if (it.type === "check" && checkState[it.id] !== true) toutFait = false;
            if (it.type === "question" && !checkState[it.id]) toutFait = false;
          };
          ["etapes", "etapesApres", "etapesFin"].forEach((cle) => visibles(whenOn[cle]).forEach(verifier));
          (whenOn.topQuestions || []).forEach((q) => { if (!topAnswers[q.id]) toutFait = false; });
          const feuille = getDeepestNode();
          if (!feuille || !Array.isArray(feuille.resultats) || !feuille.resultats.length) toutFait = false;
          if (!toutFait) return null;

          const box = document.createElement("div");
          box.className = "chk-recap is-ok";
          const t = document.createElement("div");
          t.className = "chk-recap-title";
          t.textContent = "✓ TOUT EST FAIT";
          box.appendChild(t);
          const b = document.createElement("button");
          b.type = "button";
          b.className = "chk-recap-go";
          b.textContent = "📄 RÉCAP DES ÉTAPES (À ENREGISTRER EN PDF)";
          b.addEventListener("click", () => {
            // Étapes de l'ANV faites avant (jusqu'à la question qui a mené ici),
            // puis celles du parcours, avec ses choix et saisies.
            // (seulement celles faites : le justificatif, par exemple, ne sert pas au RELDET)
            const fait = (it) => (it.type === "check" ? checkState[it.id] === true
              : it.type === "question" ? !!checkState[it.id]
              : it.type === "groupe" ? (it.items || []).some(fait) : false);
            const avant = (entry.savedRootNode && entry.savedRootNode.checklist
              ? buildChecklistModel(entry.savedRootNode, vars) : [])
              .map((sec) => Object.assign({}, sec, { items: sec.items.filter(fait) }))
              .filter((sec) => sec.items.length);
            const items = [];
            visibles(whenOn.etapes).forEach((it) => items.push(it));
            (whenOn.topQuestions || []).forEach((q) =>
              items.push({ type: "info", label: q.label, reponse: String(topAnswers[q.id] || "").toUpperCase(), tKey: "top-" + q.id }));
            visibles(whenOn.etapesApres).forEach((it) => items.push(it));
            (whenOn.inputs || []).forEach((inp) => {
              const v = String(nodeInputs[inp.id] || "").trim();
              if (v) items.push({ type: "info", label: inp.label, reponse: v, tKey: "input-" + inp.id });
            });
            inlineChain.forEach((c, i) => {
              const parent = i === 0 ? inlineRootNode : inlineChain[i - 1].node;
              items.push({ type: "info", label: (parent && parent.choicesTitle) || "CHOIX", reponse: c.label,
                tKey: "choix-" + ((parent && parent.choicesTitle) || i) });
            });
            visibles(whenOn.etapesFin).forEach((it) => items.push(it));
            const sections = avant.concat([{ id: "parcours", titre: entry.toggle.label, items }]);
            ouvrirRecap(whenOn.recapDocument.titre, sections, vars, [
              ["Compte", vars.compte || "—"],
              ["Statut", vars.statut || "—"],
              ["Parcours", entry.toggle.label],
            ]);
          });
          box.appendChild(b);
          return box;
        }

        function renderToggleEtapes() {
          toggleEtapes.innerHTML = "";
          toggleEtapesApres.innerHTML = "";
          toggleEtapesFin.innerHTML = "";
          if (activeToggleStack.length) checklistBas.appendChild(toggleEtapesFin);
          const vars = buildTemplateVars();
          activeToggleStack.forEach((entry) => {
            [["etapes", toggleEtapes], ["etapesApres", toggleEtapesApres], ["etapesFin", toggleEtapesFin]].forEach(([cle, box]) => {
              (entry.toggle.whenOn[cle] || []).forEach((item) => {
                if (item.if && !contextMatches(item.if, vars)) return;
                renderChecklistItem(item, vars, box, "toggle");
              });
            });
            const recap = recapParcours(entry, vars);
            if (recap) toggleEtapesFin.appendChild(recap);
          });
        }

        // Bandeau d'information d'un toggle actif (whenOn.bandeau = { texte, if }).
        function renderToggleBandeaux() {
          // Étapes « après les questions » du toggle, juste avant le bandeau.
          if (activeToggleStack.length) togglesContainer.appendChild(toggleEtapesApres);
          const vars = buildTemplateVars();
          activeToggleStack.forEach((entry, idx) => {
            const b = entry.toggle.whenOn && entry.toggle.whenOn.bandeau;
            if (!b || (b.if && !contextMatches(b.if, vars))) return;
            const el = document.createElement("div");
            el.className = "chk-alert is-warning toggle-bandeau";
            const txt = document.createElement("span");
            txt.textContent = b.texte;
            el.appendChild(txt);
            // Bouton retour : désactive le toggle (comme le bouton du haut) et
            // ramène sur l'étape à corriger dans la checklist.
            if (b.retour) {
              const r = document.createElement("button");
              r.type = "button";
              r.className = "context-option pill-btn";
              r.textContent = b.retour.label;
              r.addEventListener("click", () => {
                inlineRootNode = entry.savedRootNode;
                activeToggleStack = activeToggleStack.slice(0, idx);
                inlineChain = [];
                leafAnswers = {};
                leafInputs = {};
                render();
                if (b.retour.etape) goToStep(b.retour.etape);
              });
              el.appendChild(r);
            }
            // Sur la même ligne que le bouton du toggle, à sa droite.
            const ligne = togglesContainer.querySelector(`[data-toggle="${entry.toggle.id}"] .card-row-content`);
            (ligne || togglesContainer).appendChild(el);
          });
        }

        function renderToggles() {
          togglesContainer.innerHTML = "";
          const cat = buildTemplateVars().__category;
          if (cat === "delai" || cat === "reexecution") togglesContainer.appendChild(makeContexteRow());

          // Helper pour créer une card-row toggle avec un seul bouton
          const buildToggleCard = (toggle, isOn, onClick) => {
            const card = document.createElement("section");
            card.className = "card-row";
            const content = document.createElement("div");
            content.className = "card-row-content";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `context-option pill-btn ${isOn ? "is-selected" : ""}`;
            btn.setAttribute("aria-pressed", isOn ? "true" : "false");
            btn.textContent = toggle.label || "";
            btn.addEventListener("click", onClick);
            content.appendChild(btn);
            card.appendChild(content);
            return card;
          };

          // 1. Toggles déjà activés (du stack), affichés sélectionnés
          activeToggleStack.forEach((entry, idx) => {
            const card = buildToggleCard(entry.toggle, true, () => {
              // Désactivation : restore au savedRootNode de cette entrée et
              // pop tout depuis cet idx.
              inlineRootNode = entry.savedRootNode;
              activeToggleStack = activeToggleStack.slice(0, idx);
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              render();
            });
            card.dataset.toggle = entry.toggle.id; // pour y poser son bandeau
            togglesContainer.appendChild(card);
          });

          // 2. Toggles disponibles dans le inlineRootNode courant (non encore activés)
          if (inlineRootNode && Array.isArray(inlineRootNode.toggles)) {
            inlineRootNode.toggles.forEach((toggle) => {
              if (activeToggleStack.some((e) => e.toggle.id === toggle.id)) return;
              if (toggle.cache) return; // ouvert seulement par un bouton de la checklist
              // Activation : push dans le stack et swap inlineRootNode
              const card = buildToggleCard(toggle, false, () => activateToggle(toggle));
              togglesContainer.appendChild(card);
            });
          }

          // 2 bis. Étapes à cocher du toggle actif (ex : ANV SUSPEN dans VERSEMENT
          //        RÉCENT), au-dessus de ses questions.
          togglesContainer.appendChild(toggleEtapes);
          renderToggleEtapes();

          // 3. Top questions liées aux toggles (stack + inlineRootNode si toggle actif).
          //    Les topQuestions des nœuds de la cascade (ex: motif-12 → FICOBA) sont
          //    rendues plus bas par renderCascade, à leur niveau.
          //    Re-cliquer sur la valeur sélectionnée la désélectionne (retour défaut).
          if (activeToggleStack.length > 0) {
            const topQuestionSources = new Set();
            activeToggleStack.forEach((entry) => topQuestionSources.add(entry.toggle.whenOn));
            if (inlineRootNode) topQuestionSources.add(inlineRootNode);

            const seenTopQuestionIds = new Set();
            topQuestionSources.forEach((level) => {
              if (!level || !Array.isArray(level.topQuestions)) return;
              level.topQuestions.forEach((q) => {
                if (seenTopQuestionIds.has(q.id)) return;
                seenTopQuestionIds.add(q.id);
                togglesContainer.appendChild(createTopQuestionCard(q));
              });
            });
          }
        }

        // Crée une card-row pour une topQuestion (label + boutons OUI/NON).
        // Re-cliquer sur la valeur sélectionnée la désélectionne (retour au défaut).
        function createTopQuestionCard(q) {
          const card = document.createElement("section");
          // Répondue : fond vert (dans le bloc ANV), comme les autres choix faits.
          card.className = "card-row" + (topAnswers[q.id] ? " is-done" : "");
          const content = document.createElement("div");
          content.className = "card-row-content";

          const lbl = document.createElement("span");
          lbl.className = "leaf-input-label";
          lbl.textContent = q.label || "";
          content.appendChild(lbl);

          const currentAnswer = topAnswers[q.id];
          ["oui", "non"].forEach((val) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = val.toUpperCase();
            btn.className = `context-option pill-btn ${currentAnswer === val ? "is-selected" : ""}`;
            btn.setAttribute("aria-pressed", currentAnswer === val ? "true" : "false");
            btn.addEventListener("click", () => {
              if (topAnswers[q.id] === val) {
                delete topAnswers[q.id];
              } else {
                topAnswers[q.id] = val;
              }
              noterHeure("top-" + q.id, topAnswers[q.id] != null);
              render();
            });
            content.appendChild(btn);
          });

          card.appendChild(content);
          return card;
        }

        // Crée juste l'élément <input> ou <textarea> avec ses listeners.
        function createFieldElement(input) {
          const value = nodeInputs[input.id] || "";
          let field;
          if ((input.type || "text") === "image") {
            // Zone de paste d'image. Tu peux soit cliquer dans la zone et faire Ctrl+V,
            // soit coller depuis n'importe où sur la page (le listener global capture).
            // La data URL est stockée dans nodeInputs.
            field = document.createElement("div");
            field.className = "image-paste-zone";
            field.tabIndex = 0;
            field.style.position = "relative";

            const img = document.createElement("img");
            img.alt = "";
            const placeholder = document.createElement("span");
            placeholder.className = "image-placeholder";
            placeholder.textContent = input.placeholder || "Coller une image (Ctrl+V) — peu importe où sur la page";

            // Bouton ✕ pour supprimer l'image (visible seulement quand une image est là)
            const closeBtn = document.createElement("button");
            closeBtn.type = "button";
            closeBtn.textContent = "✕";
            closeBtn.title = "Supprimer l'image";
            closeBtn.className = "image-clear-btn";
            closeBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              delete nodeInputs[input.id];
              refresh();
              render();
            });

            const refresh = () => {
              const v = nodeInputs[input.id];
              if (v) {
                img.src = v;
                if (!field.contains(img)) field.appendChild(img);
                if (!field.contains(closeBtn)) field.appendChild(closeBtn);
                if (field.contains(placeholder)) field.removeChild(placeholder);
              } else {
                if (field.contains(img)) field.removeChild(img);
                if (field.contains(closeBtn)) field.removeChild(closeBtn);
                if (!field.contains(placeholder)) field.appendChild(placeholder);
              }
            };
            refresh();

            // Paste local sur la zone (équivalent au listener global, mais redondant
            // pour le cas où l'user clique exprès dans la zone avant de coller)
            field.addEventListener("paste", (e) => {
              e.preventDefault();
              const items = (e.clipboardData || window.clipboardData).items || [];
              for (const item of items) {
                if (item.type && item.type.startsWith("image/")) {
                  const blob = item.getAsFile();
                  const reader = new FileReader();
                  reader.onload = () => {
                    saveNodeInputValue(input.id, reader.result);
                    refresh();
                    renderResults(getDeepestNode());
                    renderPathPanel();
                  };
                  reader.readAsDataURL(blob);
                  return;
                }
              }
            });

            field.addEventListener("click", (e) => {
              if (e.target !== closeBtn) field.focus();
            });
            field.setAttribute("data-input-id", input.id);
            return field;
          }
          if ((input.type || "text") === "textarea") {
            field = document.createElement("textarea");
            field.className = "card-textarea";
            field.placeholder = input.placeholder || "";
            field.value = value;
            field.rows = 4;
            if (input.transform === "ecritures-compte") {
              field.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData("text");
                const cleaned = cleanEcritures(pasted);
                const start = field.selectionStart;
                const end = field.selectionEnd;
                const before = field.value.substring(0, start);
                const after = field.value.substring(end);
                field.value = before + cleaned + after;
                const cursorPos = start + cleaned.length;
                field.selectionStart = field.selectionEnd = cursorPos;
                field.dispatchEvent(new Event("input", { bubbles: true }));
              });
            }
          } else {
            field = document.createElement("input");
            field.type = input.type || "text";
            field.className = "card-input";
            field.placeholder = input.placeholder || "";
            field.value = value;
          }

          field.setAttribute("data-input-id", input.id);
          field.addEventListener("input", (event) => {
            saveNodeInputValue(input.id, event.target.value);
            marquerChampsRemplis();
            // On ne rappelle PAS render() ici : cela reconstruirait le champ en
            // cours de saisie et ferait perdre le focus à chaque caractère.
            // On rafraîchit seulement les zones concernées (la checklist DCD
            // dépend des saisies : départements, date du décès…).
            renderChecklist();
            renderResults(getDeepestNode());
            renderPathPanel();
          });
          return field;
        }

        // Crée une card-row pour un input (text ou textarea), label à gauche.
        function createInputCard(input) {
          const card = document.createElement("div");
          card.className = "card-row";

          const lbl = document.createElement("div");
          lbl.className = "card-row-label";
          lbl.textContent = input.label || "";
          card.appendChild(lbl);

          const content = document.createElement("div");
          content.className = "card-row-content";
          content.appendChild(createFieldElement(input));
          card.appendChild(content);
          return card;
        }

        // Si l'option a defaultInputs, on pré-remplit (uniquement si vide).
        // Ex: motif 13 → DATE auto-remplie avec la date du jour.
        // defaultInputsConditions permet de limiter le pré-remplissage à un contexte
        // (ex: motif 14, on ne pré-remplit qu'en A/C, pas en PL où la date est BODACC).
        // Appelée au clic sur un choix, depuis createChoiceCard.
        function applyDefaultInputs(option) {
          if (!option || !option.defaultInputs || typeof option.defaultInputs !== "object") return;
          const conditionsOk =
            !option.defaultInputsConditions ||
            contextMatches(option.defaultInputsConditions, buildTemplateVars());
          if (!conditionsOk) return;
          Object.entries(option.defaultInputs).forEach(([inputId, val]) => {
            if (nodeInputs[inputId]) return; // ne pas écraser une saisie existante
            if (val === "today") {
              const _now = new Date();
              nodeInputs[inputId] =
                String(_now.getDate()).padStart(2, "0") + "/" +
                String(_now.getMonth() + 1).padStart(2, "0") + "/" +
                String(_now.getFullYear()).slice(-2);
            } else {
              nodeInputs[inputId] = val;
            }
          });
        }

        // Crée une card-row pour les choix d'un niveau de cascade.
        function createChoiceCard(levelNode, visibleChoix, levelIdx, isInline, vars) {
          const isMotifLayout = !!(levelNode.choicesTitle && levelNode.choicesTitle.toUpperCase().includes("MOTIF"));
          const isSousMotif = !!(levelNode.choicesTitle && levelNode.choicesTitle.toUpperCase().includes("SOUS"));
          const hideMotifCode = isSousMotif && globalSelections.statut === "PL";
          const selectionKey = levelNode.choicesTitle || levelNode.question || "default";
          const selectedIdAtLevel = isInline
            ? (inlineChain[levelIdx] ? inlineChain[levelIdx].id : null)
            : nodeSelections[selectionKey];

          const card = document.createElement("section");
          card.id = `cascade-level-${levelIdx}`;
          card.className = "card-row" + (selectedIdAtLevel ? " is-done" : "");

          const labelEl = document.createElement("div");
          labelEl.className = "card-row-label";
          labelEl.textContent = levelNode.choicesTitle || "";
          card.appendChild(labelEl);

          const content = document.createElement("div");
          content.className = "card-row-content";

          visibleChoix.forEach((option) => {
            const empty = isChoiceEmpty(option);
            const isSelected = selectedIdAtLevel === option.id;
            const button = document.createElement("button");
            button.type = "button";
            button.className = `context-option pill-btn ${isSelected ? "is-selected" : ""} ${empty ? "empty-choice" : ""}`;
            button.setAttribute("aria-pressed", isSelected ? "true" : "false");
            if (empty) button.title = "Choix non encore codé";

            const rawLabel = option.label || "Choix sans nom";
            let inner;

            if (isMotifLayout) {
              const parts = rawLabel.split(" - ");
              if (parts.length >= 2) {
                const code = escapeHtml(parts.shift());
                const text = escapeHtml(parts.join(" "));
                if (hideMotifCode) {
                  inner = `<span class="motif-label"><span class="motif-text">${text}</span></span>`;
                } else {
                  inner = `<span class="motif-label"><span class="motif-code">${code}</span><span class="motif-text">${text}</span></span>`;
                }
              } else {
                inner = `<span class="motif-label"><span class="motif-text">${escapeHtml(rawLabel)}</span></span>`;
              }
            } else {
              inner = escapeHtml(rawLabel);
            }

            button.innerHTML = `${empty ? `<span class="empty-tag">TODO</span>` : ""}${inner}`;

            button.addEventListener("click", () => {
              if (empty) {
                showToast("CHOIX NON ENCORE CODÉ");
                return;
              }

              applyDefaultInputs(option);

              if (isInline) {
                noterHeure("choix-" + (levelNode.choicesTitle || levelIdx), true);
                const nextNode = option.suite && typeof option.suite === "object" ? option.suite : null;
                inlineChain = inlineChain.slice(0, levelIdx).concat([{ id: option.id, label: option.label, option: option, node: nextNode }]);
                render();
                return;
              }
              if (trail.length === 1 && option.suite && typeof option.suite === "object") {
                inlineRootNode = option.suite;
                inlineChain = [];
                render();
                return;
              }
              if (option.suite && typeof option.suite === "object") {
                inlineRootNode = null;
                inlineChain = [];
                trail.push({
                  label: option.label || "Etape",
                  node: option.suite,
                });
                render();
              }
            });

            content.appendChild(button);
          });

          card.appendChild(content);
          return card;
        }

        // Inputs réellement visibles d'un niveau : filtrés par `conditions` puis
        // dédupliqués par `id` (si 2 inputs partagent le même id, le dernier qui
        // matche gagne — c'est ce qui renomme DATE en "DATE DE PARUTION JUGEMENT
        // BODACC" pour le motif 14 en PL).
        // Extrait de renderCascade pour que le panneau CHEMIN affiche EXACTEMENT
        // les mêmes champs que la cascade, sans risque de divergence.
        function getVisibleInputs(levelNode, vars) {
          if (!levelNode || !Array.isArray(levelNode.inputs)) return [];
          const inputsToRender = [];
          const idToIdx = new Map();
          levelNode.inputs.forEach((input) => {
            if (input.conditions && !contextMatches(input.conditions, vars)) return;
            if (idToIdx.has(input.id)) {
              inputsToRender[idToIdx.get(input.id)] = input;
            } else {
              idToIdx.set(input.id, inputsToRender.length);
              inputsToRender.push(input);
            }
          });
          return inputsToRender;
        }

        // Rendu unifié de la cascade : pour chaque niveau, on rend d'abord les
        // inputs (DATE, ÉCRITURES…) puis les choix (MOTIF, RAISON…).
        // C'est ce qui permet à ÉCRITURES (input du niveau verse-oui) de s'intercaler
        // entre VERSEMENT RÉCENT (choix du niveau racine) et RAISON (choix du verse-oui).
        function renderCascade() {
          cascadeFlow.innerHTML = "";

          const isInline = !!inlineRootNode;
          if (!isInline && trail.length === 1) return;

          const vars = buildTemplateVars();
          const rootNode = isInline ? inlineRootNode : getCurrentNode();
          const cascade = isInline
            ? [rootNode, ...inlineChain.map((step) => step.node).filter(Boolean)]
            : [rootNode];

          cascade.forEach((levelNode, levelIdx) => {
            if (!levelNode) return;

            // 1. Inputs du niveau, filtrés par conditions et dédupliqués par id.
            //    Si plusieurs inputs ont le même id (avec conditions différentes),
            //    le dernier qui matche gagne (override de label/placeholder).
            //    Cas type : motif 14 PL → "date" devient "DATE DE PARUTION JUGEMENT BODACC".
            //    Les inputs avec `inline: true` consécutifs sont regroupés sur la même card-row.
            if (Array.isArray(levelNode.inputs) && levelNode.inputs.length > 0) {
              const inputsToRender = getVisibleInputs(levelNode, vars);

              let currentInlineContent = null;
              inputsToRender.forEach((input) => {
                if (input.inline) {
                  if (!currentInlineContent) {
                    const card = document.createElement("div");
                    card.className = "card-row";
                    const content = document.createElement("div");
                    content.className = "card-row-content card-row-inline";
                    card.appendChild(content);
                    cascadeFlow.appendChild(card);
                    currentInlineContent = content;
                  }
                  const wrap = document.createElement("span");
                  wrap.className = "leaf-input-wrap";
                  const lbl = document.createElement("span");
                  lbl.className = "leaf-input-label";
                  lbl.textContent = input.label || "";
                  wrap.appendChild(lbl);
                  wrap.appendChild(createFieldElement(input));
                  currentInlineContent.appendChild(wrap);
                } else {
                  currentInlineContent = null;
                  cascadeFlow.appendChild(createInputCard(input));
                }
              });
            }

            // 2. Choix du niveau (ex : MOTIF, VERSEMENT RÉCENT, RAISON)
            if (Array.isArray(levelNode.choix) && levelNode.choix.length > 0) {
              const visibleChoix = levelNode.choix.filter((option) =>
                !option.conditions || contextMatches(option.conditions, vars)
              );
              if (visibleChoix.length > 0) {
                cascadeFlow.appendChild(createChoiceCard(levelNode, visibleChoix, levelIdx, isInline, vars));
              }
            }

            // 3. topQuestions du niveau (uniquement pour niveaux > 0 — le niveau 0
            //    est déjà géré par renderToggles s'il vient d'un toggle activé).
            //    Ex : FICOBA DISPONIBLE ? est sur motif-12-psa.suite (niveau 1),
            //    rendu juste après les choix SOUS-MOTIF de ce niveau.
            if (levelIdx > 0 && Array.isArray(levelNode.topQuestions) && levelNode.topQuestions.length > 0) {
              levelNode.topQuestions.forEach((q) => {
                cascadeFlow.appendChild(createTopQuestionCard(q));
              });
            }
          });
        }

        function updateContextSelectionClasses(groupId, value) {
          contextPanel
            .querySelectorAll(`[data-context-group="${groupId}"]`)
            .forEach((button) => {
              button.classList.toggle(
                "is-selected",
                button.getAttribute("data-context-value") === value
              );
            });
        }

        function renderContextPanel() {
          if (!globalContextOptions.length) {
            contextPanel.innerHTML = "";
            contextPanel.classList.add("hidden");
            return;
          }

          contextPanel.classList.remove("hidden");
          contextPanel.innerHTML = globalContextOptions
            .map((group) => {
              const selected = globalSelections[group.id] || "";
              const buttons = group.choix
                .map((value) => {
                  const selectedClass = selected === value ? "is-selected" : "";
                  return `
                    <button
                      type="button"
                      class="context-option pill-btn ${selectedClass}"
                      aria-pressed="${selected === value ? "true" : "false"}"
                      data-context-group="${escapeHtml(group.id)}"
                      data-context-value="${escapeHtml(value)}"
                    >${escapeHtml(value)}</button>
                  `;
                })
                .join("");
              return `
                <div class="card-row">
                  <div class="card-row-label">${escapeHtml(group.label)}</div>
                  <div class="card-row-content">${buttons}</div>
                </div>
              `;
            })
            .join("");

          // Tutos du contexte : clé "<groupe>-<valeur>" (ex : "compte-actif").
          contextPanel.querySelectorAll("[data-context-group]").forEach((button) => {
            const key = tutoKey(button.getAttribute("data-context-group") + "-" + button.getAttribute("data-context-value"));
            const t = makeTutoButton(key);
            if (t) button.insertAdjacentElement("afterend", t);
          });

          contextPanel.querySelectorAll("[data-context-group]").forEach((button) => {
            button.addEventListener("click", () => {
              const groupId = button.getAttribute("data-context-group");
              const value = button.getAttribute("data-context-value");

              if (globalSelections[groupId] === value) {
                return;
              }

              globalSelections[groupId] = value;
              pruneInlineChain();
              render();
            });
          });
        }

        function renderCategoryTabs() {
          categoryTabs.innerHTML = "";
          const categories = Array.isArray(window.treeData.choix) ? window.treeData.choix : [];

          if (categories.length <= 1) {
            categoryTabs.classList.add("hidden");
            return;
          }

          categoryTabs.classList.remove("hidden");

          const card = document.createElement("section");
          card.className = "card-row";

          const labelEl = document.createElement("div");
          labelEl.className = "card-row-label";
          labelEl.textContent = CATEGORY_LABEL;
          card.appendChild(labelEl);

          const content = document.createElement("div");
          content.className = "card-row-content";

          if (inlineRootNode) {
            const back = document.createElement("button");
            back.type = "button";
            back.id = "inlineBackArrow";
            back.className = "back-arrow-btn";
            back.setAttribute("aria-label", "Quitter la catégorie");
            back.title = "Quitter la catégorie (RETOUR dans l'en-tête recule d'un seul niveau)";
            back.textContent = "←";
            back.addEventListener("click", () => {
              inlineRootNode = null;
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              activeToggleStack = [];
              topAnswers = {};
              checkState = {};
              render();
            });
            content.appendChild(back);
          }

          categories.forEach((cat) => {
            const pill = document.createElement("button");
            pill.type = "button";
            const isActive = !!(cat.suite && inlineRootNode === cat.suite);
            pill.className = `context-option pill-btn ${isActive ? "is-selected" : ""}`;
            pill.setAttribute("aria-pressed", isActive ? "true" : "false");
            pill.textContent = cat.label || "";
            pill.addEventListener("click", () => {
              if (isActive) return;
              if (!cat.suite || typeof cat.suite !== "object") {
                showToast("CATÉGORIE NON ENCORE CODÉE");
                return;
              }
              inlineRootNode = cat.suite;
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              activeToggleStack = [];
              topAnswers = {};
              checkState = {};
              render();
            });
            content.appendChild(pill);
          });

          card.appendChild(content);
          categoryTabs.appendChild(card);
        }

        function renderLeafQuestions() {
          leafQuestionsContainer.innerHTML = "";
          const leaf = getDeepestNode();
          if (!leaf || !Array.isArray(leaf.leafQuestions) || leaf.leafQuestions.length === 0) return;

          const vars = buildTemplateVars();

          leaf.leafQuestions.forEach((q) => {
            if (!contextMatches(q.conditions, vars)) return;

            const card = document.createElement("section");
            card.id = `leafQuestion-${q.id}`;
            card.className = "card-row";

            const labelEl = document.createElement("div");
            labelEl.className = "card-row-label";
            labelEl.textContent = q.label || q.id || "";
            const tutoL = makeTutoButton(q.tuto || q.id);
            if (tutoL) labelEl.appendChild(tutoL);
            card.appendChild(labelEl);

            const content = document.createElement("div");
            content.className = "card-row-content";

            const currentAnswer = leafAnswers[q.id];

            // Par défaut OUI/NON ; supporte d'autres valeurs via q.choices (ex: ["ae", "ti"]).
            const choices = Array.isArray(q.choices) && q.choices.length > 0
              ? q.choices
              : ["oui", "non"];
            choices.forEach((val) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = String(val).toUpperCase();
              btn.className = `context-option pill-btn ${currentAnswer === val ? "is-selected" : ""}`;
              btn.setAttribute("aria-pressed", currentAnswer === val ? "true" : "false");
              btn.addEventListener("click", () => {
                if (leafAnswers[q.id] === val) return;
                leafAnswers[q.id] = val;
                if (val === "non" && Array.isArray(q.inputsOnYes)) {
                  q.inputsOnYes.forEach((input) => {
                    delete leafInputs[input.id];
                  });
                }
                render();
              });
              content.appendChild(btn);
            });

            if (currentAnswer === "oui" && Array.isArray(q.inputsOnYes) && q.inputsOnYes.length > 0) {
              q.inputsOnYes.forEach((input) => {
                const wrap = document.createElement("span");
                wrap.className = "leaf-input-wrap";

                const lbl = document.createElement("span");
                lbl.className = "leaf-input-label";
                lbl.textContent = input.label || "";
                wrap.appendChild(lbl);

                const inputEl = document.createElement("input");
                inputEl.id = `leafInput-${input.id}`;
                inputEl.type = input.type || "text";
                inputEl.placeholder = input.placeholder || "";
                inputEl.value = leafInputs[input.id] || "";
                inputEl.className = "card-input";
                inputEl.addEventListener("input", (e) => {
                  leafInputs[input.id] = e.target.value;
                  // Idem : pas de render() complet pour ne pas perdre le focus.
                  renderResults(getDeepestNode());
                  renderPathPanel();
                });
                inputEl.addEventListener("keydown", (e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    inputEl.blur();
                  }
                });
                wrap.appendChild(inputEl);
                content.appendChild(wrap);
              });
            }

            card.appendChild(content);
            leafQuestionsContainer.appendChild(card);
          });
        }

        // ====================================================================
        // TUTOS EN IMAGES (bouton « i » à côté d'une étape)
        // --------------------------------------------------------------------
        // Le contenu vient de tutos/tutos.js (window.logixTutos), un fichier
        // que l'utilisateur remplit lui-même : { "<clé>": { titre, etapes:
        // [{ image, texte }] } }. Les images sont dans le dossier tutos/.
        // Clés : id d'une étape de checklist ou d'une question (ex : "dretaf",
        // "dcd-scribe-ouvrir"), ou "<groupe>-<valeur>" pour le contexte
        // (ex : "compte-actif").
        // Un seul panneau ouvert à la fois ; il reste ouvert pendant qu'on
        // travaille (même si la page se redessine) ; il se ferme avec ✕,
        // Échap, un autre « i », ou quand on coche l'étape correspondante.
        // ====================================================================
        let openTutoKey = null;

        function tutoKey(text) {
          return String(text || "")
            .toLowerCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
        }

        function getTuto(key) {
          const all = window.logixTutos || {};
          const t = all[key];
          return t && Array.isArray(t.etapes) && t.etapes.length > 0 ? t : null;
