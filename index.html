<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOGIX</title>
    <meta name="color-scheme" content="dark" />
    <!-- Favicon inline (data URI) : aucun fichier externe, aucun appel réseau. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0e15'/%3E%3Cpath d='M9 8v16h13' stroke='%2322d3ee' stroke-width='3.2' fill='none' stroke-linecap='square'/%3E%3Ccircle cx='23' cy='9.5' r='2.6' fill='%2322d3ee'/%3E%3C/svg%3E"
    />

    <style>
      /* =========================================================================
         LOGIX — feuille de style unique (aucune dépendance externe, 100 % offline)
         -------------------------------------------------------------------------
         Sommaire :
           1. Jetons (variables CSS) : couleurs, typographie, rayons
           2. Reset minimal + règles globales (police, majuscules, animations)
           3. Utilitaires (remplacent les quelques classes Tailwind utilisées)
           4. Coque de page : header / sidebar / colonne principale
           5. Panneau CHEMIN / TODO
           6. Composants du parcours : card-row, pill-btn, inputs, image
           7. Blocs résultat
           8. Toast
           9. Responsive
         ========================================================================= */

      /* ---------- 1. Jetons ---------------------------------------------------- */
      :root {
        /* Fond sombre légèrement bleuté (encre).
           Trois niveaux seulement : page → carte → contrôle. */
        --bg-1: #090d14;          /* fond général */
        --bg-2: #0d1220;
        --surface: #101825;       /* les CARTES */
        --surface-strong: #101825; /* cartes résultat (même niveau) */
        --surface-raised: #19212f; /* boutons et champs DANS une carte */
        --surface-hover: #202a3a;  /* survol d'un contrôle */
        --surface-input: #0c1220;

        --ink: #dbe5f2;
        --muted: #7f93ad;
        --muted-strong: #eef4fb;

        /* Accent principal : cyan / bleu électrique */
        --accent: #22d3ee;
        --accent-strong: #7ce9f8;
        --accent-deep: #0e7490;
        --accent-ink: #04161c; /* texte posé SUR l'accent */
        --accent-wash: rgba(34, 211, 238, 0.09);
        --accent-wash-2: rgba(34, 211, 238, 0.16);

        /* Bordure des cartes et des contrôles : fine, 1px, discrète. */
        --border: rgba(138, 182, 222, 0.15);
        --border-strong: rgba(34, 211, 238, 0.4);
        /* Filet interne : sépare les lignes À L'INTÉRIEUR d'une carte,
           pour ne pas empiler une carte dans une carte. */
        --hairline: rgba(138, 182, 222, 0.09);
        --hairline-soft: rgba(138, 182, 222, 0.06);
        /* Aplats très légers */
        --wash: rgba(255, 255, 255, 0.025);
        --wash-hover: rgba(255, 255, 255, 0.055);
        /* Ombre de carte : quasi imperceptible, juste un décollement. */
        --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.4);

        /* Fond de page, défini UNE seule fois.
           Le header réutilise exactement la même valeur (avec
           background-attachment: fixed) : comme un fond « fixed » se
           positionne par rapport à la fenêtre et non par rapport à
           l'élément, le header peint rigoureusement les mêmes pixels que la
           page derrière lui. Résultat : aucune démarcation visible, tout en
           restant opaque — le contenu ne transparaît pas quand on défile. */
        --page-bg:
          radial-gradient(1100px 620px at 22% -12%, #14243a 0%, rgba(20, 36, 58, 0) 62%),
          radial-gradient(900px 520px at 108% 4%, #0f2b34 0%, rgba(15, 43, 52, 0) 58%),
          var(--bg-1);

        --ok: #34d399;
        --ok-ink: #04241a;
        --todo: #f0a92e;
        --danger: #fb7185;

        /* Anciens jetons conservés (référencés par .brand-button) */
        --button-bg: #e8f4f8;
        --button-text: #0a0e15;
        --button-hover: #ffffff;

        /* Échelle typographique — remplace l'ancien font-size: 13pt !important.
           --fs-body est la TAILLE HISTORIQUE : elle est conservée à l'identique
           pour les blocs résultat, pour ne rien changer à ta lecture. */
        --fs-micro: 9.5pt;
        --fs-label: 10.5pt;
        --fs-choice: 11pt;
        --fs-body: 13pt;
        --fs-title: 14pt;
        --fs-brand: 17pt;

        /* Échelle d'interlettrage — RÉFÉRENCE TYPOGRAPHIQUE DE L'INTERFACE.
           Le style de « CATÉGORIE » et « OUTIL RECOUVREMENT » (petites
           capitales largement espacées) est la langue commune de toute l'UI.
           L'espacement suit la taille, comme en typographie soignée : plus le
           texte est petit, plus il respire. C'est ce qui donne une identité
           unique et évite l'effet « texte de bouton banal ».
             --ls-wide   : 9.5pt  → titres de section, titres de blocs, boutons
             --ls-mid    : 10.5pt → valeurs affichées (CHEMIN)
             --ls-choice : 11pt   → les choix de la cascade
             --ls-ui     : base, et données saisies (dates, montants) */
        --ls-wide: 0.18em;
        --ls-mid: 0.13em;
        --ls-choice: 0.12em;
        --ls-ui: 0.08em;

        --r-sm: 4px;
        --r-md: 6px;
        --r-lg: 8px;

        --ctrl-h: 2.5rem; /* hauteur commune boutons + champs */

        /* Durée unique pour TOUTES les transitions autorisées (≤ 120 ms) */
        --t: 110ms;
      }

      /* ---------- 2. Reset minimal + globales --------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        overflow-anchor: none;
      }

      html {
        overflow-anchor: none;
        scroll-behavior: auto;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif;
        font-size: var(--fs-choice);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: var(--ls-ui);
        line-height: 1.25;
        color: var(--ink);
        background: var(--page-bg);
        background-attachment: fixed;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
      }

      /* La police est imposée partout (contrainte poste de travail).
         La TAILLE, elle, n'est plus imposée : c'est ce qui permet une vraie
         hiérarchie typographique. */
      body,
      body * {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif !important;
      }

      h1,
      h2,
      h3,
      p,
      figure,
      ul,
      ol {
        margin: 0;
        padding: 0;
      }

      ul,
      ol {
        list-style: none;
      }

      button,
      input,
      textarea,
      select {
        font-family: "Aptos", "Aptos (Corps)", Calibri, Arial, sans-serif !important;
        font-size: inherit;
        font-weight: 700;
        text-transform: inherit;
        letter-spacing: inherit;
        color: inherit;
        margin: 0;
        border: 0;
        background: none;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
      }

      /* ANIMATIONS — règle stricte.
         Interdit  : tout ce qui DÉPLACE, REDIMENSIONNE ou fait APPARAÎTRE
                     (transform, width, height, opacity, keyframes, delay).
         Autorisé  : uniquement les couleurs / bordures / ombres, ≤ 120 ms,
                     ce qui ne retarde jamais l'action de l'utilisateur.
         Les propriétés autorisées sont déclarées composant par composant
         (recherche « transition: » plus bas), jamais globalement. */
      *,
      *::before,
      *::after {
        animation: none !important;
        transition-property: background-color, border-color, box-shadow, color;
        transition-duration: var(--t);
        transition-timing-function: linear;
        transition-delay: 0s !important;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }

      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* ---------- 3. Utilitaires (ex-Tailwind) -------------------------------- */
      /* .hidden est manipulée par le JS (classList.toggle("hidden", …)) : elle
         venait de Tailwind, elle doit donc exister ici maintenant qu'il est retiré. */
      .hidden {
        display: none !important;
      }

      /* À l'intérieur d'une carte, les lignes s'enchaînent sans écart : c'est
         le filet des card-row qui sépare. Entre les CARTES, on remet une
         gouttière (voir #mainPanel plus bas). */
      .stack {
        display: flex;
        flex-direction: column;
        gap: 0;
      }

      /* #mainPanel n'est pas une carte : c'est l'empilement des cartes du
         parcours (TOGGLES, CASCADE, QUESTIONS). Il lui faut donc une gouttière. */
      #mainPanel {
        gap: 10px;
      }

      .text-muted {
        color: var(--muted);
      }

      .text-strong {
        color: var(--muted-strong);
      }

      .surface-shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
      }

      .surface-card {
        background: var(--surface-strong);
        border: 1px solid var(--border);
        border-radius: var(--r-md);
      }

      .brand-button {
        background: var(--button-bg);
        color: var(--button-text);
      }

      .brand-button:hover {
        background: var(--button-hover);
      }

      /* Classes historiques conservées (référencées par CLAUDE.md / le JS).
         Neutres par choix : aucune animation d'apparition n'est autorisée. */
      .fade-in,
      .pop-in {
        opacity: 1;
      }

      .page-shell {
        width: 100%;
        position: relative;
      }

      .choice-grid-root {
        width: 100%;
        display: flex;
        justify-content: flex-start;
      }

      /* Conservée pour compatibilité : plus aucun bouton flottant aujourd'hui,
         COPIER LE CHEMIN est désormais dans le panneau CHEMIN. */
      .floating-reset {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 50;
      }

      /* ---------- 4. Coque de page + système de CARTES ------------------------- */
      /* Hiérarchie visuelle à 3 niveaux, jamais plus :
         1. le fond de page         (--bg-1)
         2. la CARTE de section     (--surface + bordure 1px + radius 8px)
         3. les contrôles dedans    (--surface-raised + bordure 1px + radius 6px)
         Les lignes à l'intérieur d'une carte ne sont pas des cartes : elles sont
         séparées par un filet. C'est ce qui évite l'effet « boîte dans boîte »
         tout en gardant des rectangles nets et lisibles. */

      .app {
        max-width: 1680px;
        margin: 0 auto;
        padding: 0 0 36px;
      }

      /* --- Header : PAS de carte, fondu dans le décor ------------------------- */
      /* Volontairement sans fond propre, sans cadre et sans ombre : c'est une
         barre d'application posée directement sur le fond de la page.
         Le `background: var(--page-bg)` + `fixed` reproduit exactement le fond
         général (voir le commentaire du jeton --page-bg) : invisible à l'œil,
         mais opaque, ce qui évite que le contenu transparaisse au défilement.
         Seul un filet horizontal très léger marque la limite. */
      .app-header {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 14px;
        width: 100%;
        height: 58px;
        padding: 0 22px;
        margin-bottom: 14px;
        background: var(--page-bg);
        background-attachment: fixed;
        border: 0;
        border-bottom: 1px solid var(--hairline-soft);
        box-shadow: none;
      }

      /* Touche cyan : un trait court sous la marque, rien de plus. */
      .app-header::after {
        content: "";
        position: absolute;
        left: 22px;
        bottom: -1px;
        width: 86px;
        height: 1px;
        background: var(--accent);
        opacity: 0.6;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        flex: 0 0 auto;
        font-size: var(--fs-brand);
        font-weight: 700;
        letter-spacing: 0.26em;
        /* Élément le plus lumineux de la page : posé à même le fond, il doit
           porter seul, sans cadre pour le soutenir. */
        color: #f2f7ff;
        user-select: none;
      }

      .brand-mark {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        flex: 0 0 auto;
      }

      /* Nettement plus discret que LOGIX : plus petit, gris, et il se tronque
         plutôt que de pousser les boutons hors du header. */
      .brand-sub {
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        font-weight: 600;
        opacity: 0.75;
        padding-left: 14px;
        border-left: 1px solid var(--border);
      }

      .header-actions {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 0 0 auto;
      }

      .hdr-btn {
        flex: 0 0 auto;
        height: 2.1rem;
        padding: 0 0.85rem;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        white-space: nowrap;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--ink);
      }

      .hdr-btn:hover:not(:disabled) {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--muted-strong);
      }

      .hdr-btn:disabled {
        opacity: 0.32;
      }

      .hdr-btn-strong:hover:not(:disabled) {
        border-color: rgba(251, 113, 133, 0.45);
        background: rgba(251, 113, 133, 0.1);
        color: #ffd8de;
      }

      /* --- Corps : sidebar + colonne principale ------------------------------ */
      .app-body {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        padding: 0 22px;
      }

      .sidebar {
        width: 320px;
        flex: 0 0 320px;
        min-width: 0;
        position: sticky;
        top: 74px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .main-col {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* --- LA CARTE ---------------------------------------------------------- */
      /* Toutes les grandes sections partagent exactement le même rectangle. */
      .panel,
      #categoryTabs,
      #togglesContainer,
      #cascadeFlow,
      #leafQuestionsContainer,
      .result-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-card);
      }

      /* Une section vide ne doit pas laisser une carte fantôme à l'écran.
         (Le contenu généré par ::before ne compte pas pour :empty.) */
      #togglesContainer:empty,
      #cascadeFlow:empty,
      #leafQuestionsContainer:empty {
        display: none;
      }

      .panel {
        padding: 11px 13px 12px;
      }

      .panel-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        margin-bottom: 9px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--hairline);
      }

      .panel-title::before {
        content: "";
        width: 2px;
        height: 10px;
        border-radius: 1px;
        background: var(--accent);
        flex: 0 0 auto;
      }

      .panel-title .panel-count {
        margin-left: auto;
        letter-spacing: 0.05em;
        color: var(--muted);
        opacity: 0.7;
        font-variant-numeric: tabular-nums;
      }

      .crumbs {
        padding: 7px 13px;
        font-size: var(--fs-label);
      }

      #breadcrumbs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      /* ---------- 5. Panneau CHEMIN / TODO ------------------------------------ */
      /* Timeline compacte : une colonne de marqueurs reliés par un filet. */
      .path-list {
        display: flex;
        flex-direction: column;
      }

      .path-step {
        position: relative;
        display: grid;
        grid-template-columns: 16px 1fr;
        grid-template-rows: auto auto;
        column-gap: 10px;
        row-gap: 0;
        width: 100%;
        text-align: left;
        padding: 4px 6px 5px;
        border-radius: var(--r-sm);
        border: 0;
        background: none;
        font-weight: 600;
      }

      /* Le fil qui relie les étapes entre elles. */
      .path-step:not(:last-child)::after {
        content: "";
        position: absolute;
        left: 13px;
        top: 21px;
        bottom: -1px;
        width: 1px;
        background: var(--hairline);
      }

      .path-mark {
        grid-row: 1 / span 2;
        align-self: start;
        margin-top: 1px;
        width: 16px;
        height: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: var(--fs-micro);
        font-weight: 700;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--muted);
        line-height: 1;
        flex: 0 0 auto;
      }

      .path-label {
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        line-height: 1.4;
      }

      .path-value {
        font-size: var(--fs-label);
        letter-spacing: var(--ls-mid);
        color: var(--ink);
        overflow-wrap: anywhere;
        line-height: 1.3;
      }

      /* Étape franchie */
      .path-step.is-done .path-mark {
        border-color: rgba(52, 211, 153, 0.4);
        background: rgba(52, 211, 153, 0.12);
        color: var(--ok);
      }
      .path-step.is-done .path-value {
        color: var(--muted-strong);
      }

      /* Étape en cours */
      .path-step.is-current {
        background: var(--accent-wash);
      }
      .path-step.is-current .path-mark {
        border-color: var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }
      .path-step.is-current .path-label,
      .path-step.is-current .path-value {
        color: var(--accent-strong);
      }

      /* Étape restante */
      .path-step.is-todo .path-mark {
        border-style: dashed;
        border-color: rgba(240, 169, 46, 0.42);
        background: none;
        color: var(--todo);
      }
      .path-step.is-todo .path-label,
      .path-step.is-todo .path-value {
        color: var(--muted);
      }
      .path-step.is-todo .path-value {
        opacity: 0.8;
      }

      /* Étape cliquable = on peut y revenir directement */
      button.path-step {
        cursor: pointer;
      }
      button.path-step:hover {
        background: var(--surface-hover);
      }
      button.path-step:hover .path-value {
        color: var(--accent-strong);
      }

      .path-empty {
        padding: 6px;
        font-size: var(--fs-label);
        color: var(--muted);
        font-weight: 600;
      }

      .path-copy-btn {
        margin-top: 10px;
        width: 100%;
        height: 2.05rem;
        border-radius: var(--r-md);
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--muted);
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
      }

      .path-copy-btn:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--accent-strong);
      }

      /* ---------- 6. Composants du parcours ----------------------------------- */
      /* Une ligne DANS une carte : libellé à gauche, contrôles à droite,
         séparée de la suivante par un filet. Jamais de cadre par ligne. */
      .card-row {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        background: none;
        border: 0;
        border-bottom: 1px solid var(--hairline);
        border-radius: 0;
        padding: 9px 13px;
        min-height: 0;
      }

      .card-row:last-child {
        border-bottom: 0;
      }

      .card-row-label {
        flex: 0 0 164px;
        width: 164px;
        min-width: 0;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .card-row-content {
        flex: 1 1 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .card-row-inline {
        gap: 18px;
      }

      /* Sidebar : colonne étroite, on empile libellé puis options. */
      .context-dock {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .context-dock .card-row {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
        padding: 8px 0;
      }

      .context-dock .card-row:first-child {
        padding-top: 0;
      }

      .context-dock .card-row-label {
        flex: none;
        width: 100%;
      }

      .context-dock .pill-btn {
        flex: 1 1 0;
        min-width: 0;
        padding: 0 0.5rem;
        height: 2.05rem;
      }

      /* --- Boutons de choix -------------------------------------------------- */
      /* Normal : fond légèrement plus clair que la carte + bordure subtile.
         Survol : bordure cyan un peu plus visible, fond éclairci.
         Sélectionné : fond cyan très légèrement teinté + bordure cyan nette. */
      .pill-btn {
        height: var(--ctrl-h);
        max-width: 100%;
        padding: 0 0.8rem;
        border-radius: var(--r-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        white-space: nowrap;
        font-size: var(--fs-choice);
        /* Même langage que « CATÉGORIE » : capitales espacées, graisse sobre. */
        letter-spacing: var(--ls-choice);
        font-weight: 600;
        line-height: 1;
      }

      .context-option {
        border: 1px solid var(--border);
        background: var(--surface-raised);
        color: var(--ink);
      }

      .context-option:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--muted-strong);
      }

      .context-option.is-selected,
      .context-option.is-selected:hover {
        border-color: var(--accent);
        background: var(--accent-wash-2);
        color: var(--accent-strong);
        /* Graisse volontairement inchangée : la sélection se lit déjà à la
           couleur, au fond et à la bordure. Passer en gras alourdirait le texte
           et ferait légèrement bouger la mise en page à chaque clic. */
        /* Épaissit la bordure sans décaler la mise en page. */
        box-shadow: inset 0 0 0 1px var(--accent);
      }

      .context-option.is-selected .motif-code {
        background: rgba(34, 211, 238, 0.18);
        color: var(--accent-strong);
      }

      .pill-btn.empty-choice {
        opacity: 0.4;
        cursor: not-allowed;
        border-style: dashed;
      }

      .pill-btn .empty-tag {
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        padding: 0.1rem 0.35rem;
        border-radius: var(--r-sm);
        color: var(--todo);
        background: rgba(240, 169, 46, 0.1);
        border: 1px solid rgba(240, 169, 46, 0.28);
      }

      /* MOTIF : code discret dans une pastille sobre, puis intitulé. */
      .motif-label {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        text-align: left;
        font-weight: inherit;
        width: auto;
      }

      .motif-code {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 1.45rem;
        height: 1.35rem;
        padding: 0 0.3rem;
        border-radius: var(--r-sm);
        background: rgba(255, 255, 255, 0.05);
        color: var(--muted);
        font-size: var(--fs-micro);
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.08em;
        flex: 0 0 auto;
      }

      .motif-text {
        display: inline-flex;
        align-items: center;
        min-width: 0;
        line-height: 1;
        font-weight: inherit;
        flex: 0 1 auto;
      }

      /* --- Champs de saisie -------------------------------------------------- */
      .card-input {
        height: var(--ctrl-h);
        max-width: 100%;
        padding: 0 0.7rem;
        border-radius: var(--r-md);
        background: var(--surface-input);
        border: 1px solid var(--border);
        color: var(--muted-strong);
        outline: none;
        min-width: 11rem;
      }

      /* Les champs contiennent des DONNÉES (dates, montants, adresses) :
         graisse allégée et interlettrage de base, la lisibilité prime sur le
         style. C'est la hiérarchie voulue : chrome espacé, données sobres. */
      .card-input,
      .card-textarea {
        font-weight: 600;
        letter-spacing: var(--ls-ui);
      }

      .card-input::placeholder,
      .card-textarea::placeholder {
        color: var(--muted);
        opacity: 0.55;
        text-transform: none;
        letter-spacing: normal;
        font-weight: 600;
      }

      .card-input:hover,
      .card-textarea:hover {
        border-color: var(--border-strong);
      }

      .card-input:focus,
      .card-textarea:focus {
        border-color: var(--accent);
        background: #0e1724;
      }

      .card-textarea {
        min-height: 6.2rem;
        padding: 0.55rem 0.7rem;
        border-radius: var(--r-md);
        background: var(--surface-input);
        border: 1px solid var(--border);
        color: var(--muted-strong);
        outline: none;
        width: 100%;
        max-width: 100%;
        flex: 1 1 100%;
        resize: vertical;
        line-height: 1.45;
      }

      /* Zone de collage d'image (Ctrl+V) */
      .image-paste-zone {
        width: 100%;
        max-width: 100%;
        min-height: 5.2rem;
        padding: 0.55rem;
        border-radius: var(--r-md);
        border: 1px dashed var(--border-strong);
        background: var(--surface-input);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        outline: none;
        flex: 1 1 100%;
      }

      .image-paste-zone:hover {
        border-color: var(--accent);
        background: #0e1724;
      }

      .image-paste-zone:focus {
        border-color: var(--accent);
        border-style: solid;
        background: #0e1724;
      }

      .image-paste-zone .image-placeholder {
        color: var(--muted);
        font-size: var(--fs-label);
        text-transform: none;
        letter-spacing: normal;
        font-weight: 600;
        text-align: center;
      }

      .image-paste-zone img {
        max-width: 100%;
        max-height: 28rem;
        display: block;
        border-radius: var(--r-sm);
      }

      .image-clear-btn {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        width: 1.6rem;
        height: 1.6rem;
        border-radius: var(--r-sm);
        border: 1px solid var(--border);
        background: rgba(8, 12, 20, 0.85);
        color: var(--ink);
        font-size: var(--fs-label);
        font-weight: 700;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .image-clear-btn:hover {
        border-color: rgba(251, 113, 133, 0.5);
        background: rgba(251, 113, 133, 0.18);
        color: #ffd8de;
      }

      .back-arrow-btn {
        flex: 0 0 auto;
        height: var(--ctrl-h);
        width: var(--ctrl-h);
        border-radius: var(--r-md);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        background: var(--surface-raised);
        border: 1px solid var(--border);
      }

      .back-arrow-btn:hover {
        border-color: var(--border-strong);
        background: var(--surface-hover);
        color: var(--accent-strong);
      }

      .leaf-input-wrap {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-width: 0;
        margin-left: 0.25rem;
      }

      .leaf-input-label {
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--muted);
        white-space: nowrap;
      }

      /* ---------- 7. Blocs résultat ------------------------------------------- */
      .results-stack {
        gap: 12px;
        margin-top: 4px;
      }

      /* Un résultat = une carte, comme les autres sections, mais avec un
         bandeau titre légèrement teinté cyan pour l'identifier comme le
         livrable final. */
      .result-card {
        overflow: hidden;
      }

      .result-header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        background: rgba(34, 211, 238, 0.055);
        border-bottom: 1px solid var(--border);
      }

      .result-title {
        flex: 1 1 auto;
        min-width: 0;
        font-size: var(--fs-micro);
        font-weight: 700;
        letter-spacing: var(--ls-wide);
        color: var(--accent-strong);
        overflow-wrap: anywhere;
      }

      .result-body {
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .result-sub {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        min-width: 0;
      }

      .result-sub + .result-sub {
        padding-top: 12px;
        border-top: 1px solid var(--hairline);
      }

      .result-content {
        flex: 1 1 auto;
        min-width: 0;
        color: var(--muted-strong);
        line-height: 1.5;
      }

      /* Bouton COPIER : action principale, aplat cyan plein, sans halo. */
      .copy-btn {
        flex: 0 0 auto;
        height: 1.95rem;
        padding: 0 0.85rem;
        font-size: var(--fs-micro);
        letter-spacing: var(--ls-wide);
        font-weight: 700;
        white-space: nowrap;
        border-radius: var(--r-md);
        border: 1px solid var(--accent);
        background: var(--accent);
        color: var(--accent-ink);
      }

      .copy-btn:hover {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
      }

      .copy-success,
      .copy-success:hover {
        background: var(--ok) !important;
        border-color: var(--ok) !important;
        color: var(--ok-ink) !important;
      }

      /* Les textes du bloc résultat gardent leur casse d'origine (= ce qui sera
         copié dans Word) ET leur taille historique (--fs-body = 13pt).
         Ne pas toucher : c'est ce qui garantit que l'aperçu ressemble au collage. */
      .result-header,
      .result-content,
      .result-content * {
        text-transform: none !important;
        letter-spacing: normal !important;
      }

      .result-content,
      .result-content * {
        font-size: var(--fs-body);
      }

      /* Graisse normale : l'aperçu doit ressembler au texte tel qu'il arrivera
         dans Word, où seuls les <strong> ressortent. */
      .result-content {
        font-weight: 400;
      }

      /* Styles natifs des balises de mise en forme dans l'aperçu, pour qu'il
         ressemble visuellement au rendu Word. */
      .result-content p {
        margin: 0 0 0.6em 0;
      }
      .result-content p:last-child {
        margin-bottom: 0;
      }
      .result-content ul {
        list-style: disc;
        padding-left: 1.5em;
        margin: 0 0 0.6em 0;
      }
      .result-content ul ul {
        list-style: circle;
        margin-bottom: 0;
      }
      .result-content li {
        margin: 0.2em 0;
      }
      .result-content strong,
      .result-content b {
        font-weight: 800;
      }
      .result-content em,
      .result-content i {
        font-style: italic;
      }
      .result-content u {
        text-decoration: underline;
      }
      .result-content img {
        max-width: 100%;
        height: auto;
        border-radius: var(--r-sm);
      }

      /* ---------- 8. Toast ----------------------------------------------------- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 22px;
        margin-left: -170px;
        width: 340px;
        max-width: calc(100vw - 32px);
        text-align: center;
        z-index: 60;
        padding: 11px 14px;
        border-radius: var(--r-lg);
        background: var(--surface-raised);
        border: 1px solid var(--border-strong);
        color: var(--muted-strong);
        font-size: var(--fs-label);
        font-weight: 700;
        letter-spacing: var(--ls-mid);
        box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45);
      }

      /* ---------- 9. Responsive ------------------------------------------------ */
      @media (max-width: 1400px) {
        .sidebar {
          width: 290px;
          flex-basis: 290px;
        }
        .card-row-label {
          flex-basis: 148px;
          width: 148px;
        }
      }

      @media (max-width: 1200px) {
        .app-header,
        .app-body {
          padding-left: 16px;
          padding-right: 16px;
        }
        .app-header::after {
          left: 16px;
        }
        .sidebar {
          width: 260px;

        }
        .card-row-label {

        }

          padding: 0 0.65rem;
        }
      }

      @media (max-width: 980px) {
        .app-body {
          flex-direction: column;
          gap: 10px;
        }
        .sidebar {
          position: static;
          width: 100%;
          flex-basis: auto;
          flex-direction: row;
          flex-wrap: wrap;
          align-items: flex-start;
        }
        .sidebar .panel {
          flex: 1 1 260px;
          min-width: 0;
        }

        }
      }

      @media (max-width: 680px) {

        }
        .app-header::after {

        }
        .brand-sub {
          display: none;
        }
        .header-actions {
          width: 100%;
          margin-left: 0;
        }
        .hdr-btn {
          flex: 1 1 0;
          justify-content: center;
          min-width: 0;
        }
        .app-body {
          padding-left: 12px;
          padding-right: 12px;
        }
        .card-row {
          flex-direction: column;
          align-items: stretch;
          gap: 7px;
        }
        .card-row-label {
          flex: none;
          width: 100%;
        }
        .card-input {
          min-width: 0;
          width: 100%;
        }
        .result-sub {
          flex-direction: column;
        }
        .copy-btn {
          align-self: flex-end;
        }
      }
    </style>
  </head>

  <body>
    <div class="app page-shell">

      <header class="app-header">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>LOGIX</div>
        <div class="brand-sub">OUTIL RECOUVREMENT</div>
        <div class="header-actions">
          <button type="button" id="backBtn" class="hdr-btn"
            title="Revenir d'un seul niveau en arrière (conserve COMPTE et STATUT)">
            ↩ RETOUR
          </button>
          <button type="button" id="resetBtn" class="hdr-btn hdr-btn-strong"
            title="Nouveau dossier : remet le parcours à zéro mais conserve COMPTE et STATUT">
            ⟳ RECOMMENCER
          </button>
        </div>
      </header>

      <div class="app-body">

        <aside class="sidebar">
          <section class="panel">
            <h2 class="panel-title">CONTEXTE</h2>
            <div id="contextPanel" class="context-dock"></div>
          </section>

          <section class="panel">
            <h2 class="panel-title">CHEMIN<span class="panel-count" id="pathCount"></span></h2>
            <div id="pathPanel" class="path-list"></div>
            <button type="button" id="copyPathBtn" class="path-copy-btn"
              title="Copier le chemin actuel dans le presse-papier">
              📋 COPIER LE CHEMIN
            </button>
          </section>
        </aside>

        <div class="main-col">
          <section id="breadcrumbsSection" class="hidden">
            <div class="surface-shell crumbs">
              <nav id="breadcrumbs" class="text-muted"></nav>
            </div>
          </section>

          <section id="categoryTabs"></section>
          <section id="questionZone" class="hidden"></section>

          <section id="entryLayout">
            <section id="mainPanel" class="stack">
              <section id="inlineTitleContainer"></section>
              <section id="togglesContainer" class="stack"></section>
              <section id="cascadeFlow" class="stack"></section>
              <section id="leafQuestionsContainer" class="stack"></section>
              <!-- Conservés pour compat (vides désormais, gérés via cascadeFlow) -->
              <section id="inputsContainer" class="hidden"></section>
              <section id="choicesHeader" class="hidden"></section>
              <section id="choicesContainer" class="hidden"></section>
            </section>
          </section>

          <section id="resultsContainer" class="stack results-stack"></section>
        </div>

      </div>
    </div>

    <script src="./data.js"></script>
    <script>
      (function () {
        if (!window.treeData) {
          alert("Erreur: treeData est introuvable. Verifiez le fichier data.js");
          return;
        }

        const questionZone = document.getElementById("questionZone");
        const inlineTitleContainer = document.getElementById("inlineTitleContainer");
        const choicesContainer = document.getElementById("choicesContainer");
        const choicesHeader = document.getElementById("choicesHeader");
        const inputsContainer = document.getElementById("inputsContainer");
        const togglesContainer = document.getElementById("togglesContainer");
        const cascadeFlow = document.getElementById("cascadeFlow");
        const contextPanel = document.getElementById("contextPanel");
        const entryLayout = document.getElementById("entryLayout");
        const resultsContainer = document.getElementById("resultsContainer");
        const breadcrumbsSection = document.getElementById("breadcrumbsSection");
        const breadcrumbs = document.getElementById("breadcrumbs");
        const categoryTabs = document.getElementById("categoryTabs");
        const leafQuestionsContainer = document.getElementById("leafQuestionsContainer");
        const pathPanel = document.getElementById("pathPanel");
        const pathCount = document.getElementById("pathCount");
        const backBtn = document.getElementById("backBtn");
        const resetBtn = document.getElementById("resetBtn");
        const globalContextOptions = window.globalContextOptions || [];

        // trail = historique de navigation
        // Chaque entree: { label: "Texte du choix", node: objet suite }
        let trail = [{ label: "", node: window.treeData }];
        let globalSelections = {};
        let nodeInputs = {};
        let nodeSelections = {};
        let inlineRootNode = null;
        let inlineChain = [];
        let leafAnswers = {};
        let leafInputs = {};
        let lastScrollTargetId = null;
        // Stack des toggles activés (ex: AMIABLE RELDET, puis DETTE NON EXIGIBLE
        // imbriqué dedans). Chaque entrée = { savedRootNode, toggle }. Quand on
        // active un toggle, on push (avec savedRootNode = inlineRootNode courant)
        // puis on swap inlineRootNode vers toggle.whenOn. Quand on désactive, on
        // pop tout depuis cet idx et on restore le savedRootNode.
        let activeToggleStack = [];

        // Réponses aux topQuestions (questions optionnelles affichées dans la rangée
        // des toggles). Format : { questionId: "oui" | "non" | undefined }.
        // Utilisé par substituteTemplate pour adapter globalement le résultat.
        let topAnswers = {};

        function saveNodeInputValue(inputId, value) {
          nodeInputs[inputId] = value;
        }

        function saveNodeSelection(selectionKey, value) {
          nodeSelections[selectionKey] = value;
        }

        function getCurrentNode() {
          return trail[trail.length - 1].node;
        }

        function getDisplayNode() {
          return inlineRootNode || getCurrentNode();
        }

        function escapeHtml(input) {
          return String(input)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
        }

        function isChoiceEmpty(option) {
          if (!option || !option.suite || typeof option.suite !== "object") return true;
          const hasChoix = Array.isArray(option.suite.choix) && option.suite.choix.length > 0;
          const hasResultats = Array.isArray(option.suite.resultats) && option.suite.resultats.length > 0;
          return !hasChoix && !hasResultats;
        }

        function showToast(message) {
          const existing = document.getElementById("taff-toast");
          if (existing) existing.remove();
          const toast = document.createElement("div");
          toast.id = "taff-toast";
          toast.textContent = message;
          toast.className = "toast";
          document.body.appendChild(toast);
          setTimeout(() => toast.remove(), 1800);
        }

        function stripHtmlToText(html) {
          // Conversion robuste HTML → texte avec préservation des sauts de ligne.
          // (Important : Word/Outlook collent parfois en text/plain plutôt qu'en
          // text/html selon la config — il faut donc que le text/plain soit propre.)
          return String(html || "")
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<\/p>\s*<p[^>]*>/gi, "\n\n")
            .replace(/<li[^>]*>/gi, "\n- ")
            .replace(/<\/li>/gi, "")
            .replace(/<\/?ul[^>]*>/gi, "\n")
            .replace(/<\/?ol[^>]*>/gi, "\n")
            .replace(/<\/?[^>]+>/g, "")
            .replace(/&nbsp;/gi, " ")
            .replace(/&amp;/gi, "&")
            .replace(/&lt;/gi, "<")
            .replace(/&gt;/gi, ">")
            .replace(/&quot;/gi, '"')
            .replace(/&#039;/gi, "'");
        }

        function splitMotifLabel(label) {
          if (!label) return { code: "", text: "" };
          const parts = label.split(" - ");
          if (parts.length < 2) return { code: "", text: label };
          return { code: parts[0], text: parts.slice(1).join(" - ") };
        }

        // Échappement des VALEURS substituées (et non du template).
        // Le template lui-même (resultats[].texte) reste du HTML riche volontaire :
        // c'est ce qui permet au bouton Copier de coller du gras/souligné dans Word.
        // Mais ce que TU tapes (ADRESSE, ÉCRITURES…) ne doit jamais être interprété
        // comme du HTML. On n'échappe pas l'apostrophe : elle est très fréquente en
        // français et sans danger dans un attribut délimité par des guillemets.
        function escapeValue(input) {
          return String(input)
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;");
        }

        function substituteTemplate(template, vars) {
          if (typeof template !== "string") return "";
          let result = template.replace(/\{\{([^}]+)\}\}/g, (match, key) => {
            const val = vars[key.trim()];
            if (val == null) return "";
            // On convertit les sauts de ligne en <br> pour le rendu HTML
            // (utile pour les inputs de type textarea, ex: ÉCRITURES).
            return escapeValue(val).replaceAll("\n", "<br>");
          });
          // Post-traitement : convertit toute date au format JJ/MM/AAAA en JJ/MM/AA.
          // Skip dans la catégorie RÉEXÉCUTION (où on veut au contraire 4 chiffres
          // pour la date de prescription).
          if (vars.__category !== "reexecution") {
            // Une image collée est stockée en data URL base64. Or le base64 contient
            // des "/" et des chiffres : une suite du type 12/34/5678 peut y apparaître
            // par hasard et se faire mutiler par le raccourcissement de date, ce qui
            // casserait l'image. On met donc les data URL de côté le temps du
            // remplacement, puis on les remet telles quelles.
            const dataUris = [];
            result = result.replace(
              /data:[a-z0-9.+-]+\/[a-z0-9.+-]+;base64,[A-Za-z0-9+/=]+/gi,
              (uri) => {
                dataUris.push(uri);
                return "\u0001DATAURI" + (dataUris.length - 1) + "\u0001";
              }
            );
            result = result.replace(/(\b\d{2}\/\d{2}\/)\d{2}(\d{2}\b)/g, "$1$2");
            result = result.replace(
              /\u0001DATAURI(\d+)\u0001/g,
              (whole, idx) => dataUris[Number(idx)]
            );
          }
          return result;
        }

        // Transforme un copié-collé brut "Ecritures du compte" en lignes propres :
        //   "Ecritures du compte 31/03/2026    86  €    TELEPAIEMENT     COTISANT"
        //   → "31/03/2026 86€ TELEPAIEMENT COTISANT"
        function cleanEcritures(text) {
          return String(text || "")
            .split("\n")
            .map((line) =>
              line
                .replace(/Ecritures du compte/gi, "")
                .replace(/(\d)\s+€/g, "$1€")
                .replace(/\s+/g, " ")
                .trim()
            )
            .filter((line) => line.length > 0)
            .join("\n");
        }

        function contextMatches(conditions, vars) {
          if (!conditions || typeof conditions !== "object") return true;
          return Object.entries(conditions).every(([key, allowed]) => {
            const currentValue = vars[key];
            if (Array.isArray(allowed)) return allowed.includes(currentValue);
            // Conditions numériques : { ">=": 36, "<": 50, ... }
            if (allowed && typeof allowed === "object") {
              const num = parseFloat(currentValue);
              if (Number.isNaN(num)) return false;
              return Object.entries(allowed).every(([op, v]) => {
                const target = parseFloat(v);
                if (Number.isNaN(target)) return false;
                switch (op) {
                  case ">": return num > target;
                  case "<": return num < target;
                  case ">=": return num >= target;
                  case "<=": return num <= target;
                  case "==": case "===": return num === target;
                  case "!=": case "!==": return num !== target;
                  default: return false;
                }
              });
            }
            return currentValue === allowed;
          });
        }

        function buildTemplateVars() {
          const vars = {};
          (globalContextOptions || []).forEach((opt) => {
            vars[opt.id] = globalSelections[opt.id] || "";
          });
          Object.assign(vars, nodeInputs || {});
          Object.assign(vars, leafAnswers || {});
          Object.assign(vars, leafInputs || {});
          Object.assign(vars, topAnswers || {});

          // Préfixe métier : "ANV PARTIELLE" par défaut (ACTIF + non sélectionné),
          // "ANV" uniquement si RADIÉ explicitement choisi.
          vars["motif-prefix"] = globalSelections.compte === "RADIÉ" ? "ANV" : "ANV PARTIELLE";
          // "Compte actif" par défaut (et si rien n'est coché), "Compte radié" si RADIÉ
          vars["compte-display"] = globalSelections.compte === "RADIÉ" ? "radié" : "actif";
          // Date du jour au format JJ/MM/AA, recalculée à chaque rendu.
          // Utilisée pour les templates qui demandent "date du jour" (ex: motif 13 RELANCE).
          const _now = new Date();
          vars["today"] =
            String(_now.getDate()).padStart(2, "0") + "/" +
            String(_now.getMonth() + 1).padStart(2, "0") + "/" +
            String(_now.getFullYear()).slice(-2);

          // Variable dérivée pour DÉLAI : "oui" si l'input MOIS > 36, sinon "non"
          // (incluant le cas où MOIS est vide → on affiche le texte par défaut ≤ 36).
          const _moisNum = parseFloat(nodeInputs.mois);
          vars["mois-gt-36"] = !Number.isNaN(_moisNum) && _moisNum > 36 ? "oui" : "non";

          // Phrase finale "-> RELDET..." centralisée : version V2 si la topQuestion
          // "COMPTE EN LIGNE OU MAIL ?" est répondue NON, version standard sinon.
          // Source unique : si tu changes la phrase, tu la changes ici, point.
          vars["phrase-reldet"] = topAnswers["compte-en-ligne"] === "non"
            ? "-> RELDET fait en v2 car pas de compte en ligne ni de mail pour envoyer par SCRIBE"
            : "-> RELDET + formulaire de demande délai envoyé par SCRIBE";

          // Phrase "ET RECH EOPPS [+ FICOBA] RECENTE" centralisée : sans le "+ FICOBA"
          // si la topQuestion FICOBA est répondue NON (motif 12 A/C). Source unique.
          vars["phrase-eopps"] = topAnswers["ficoba"] === "non"
            ? "ET RECH EOPPS RECENTE"
            : "ET RECH EOPPS + FICOBA RECENTE";

          // RÉEXÉCUTION : "date-prescription-full" expand JJ/MM/AA en JJ/MM/AAAA
          // (l'inverse du raccourcissement global). Si l'user tape déjà 4 chiffres,
          // c'est un no-op.
          const _dp = nodeInputs["date-prescription"];
          vars["date-prescription-full"] = _dp
            ? String(_dp).replace(
                /(\b\d{2}\/\d{2}\/)(\d{2})\b(?!\d)/g,
                (_m, prefix, yy) => prefix + "20" + yy
              )
            : "";

          // RÉEXÉCUTION : adresse forcée en majuscules dans le résultat copié,
          // peu importe la casse tapée par l'utilisateur.
          if (vars.adresse) vars.adresse = String(vars.adresse).toUpperCase();

          // Catégorie active (pour skip le raccourcissement dans RÉEXÉCUTION)
          const _categoryNode = activeToggleStack.length > 0
            ? activeToggleStack[0].savedRootNode
            : inlineRootNode;
          const _cat = (window.treeData.choix || []).find((c) => c.suite === _categoryNode);
          vars.__category = _cat ? _cat.id : "";

          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions)) {
            leaf.leafQuestions.forEach((q) => {
              if (!contextMatches(q.conditions, vars)) {
                delete vars[q.id];
                if (Array.isArray(q.inputsOnYes)) {
                  q.inputsOnYes.forEach((inp) => {
                    delete vars[inp.id];
                  });
                }
              }
            });
          }

          const levels = inlineRootNode ? [inlineRootNode, ...inlineChain.map((s) => s.node)] : [];
          levels.forEach((levelNode, idx) => {
            if (!levelNode || !levelNode.choicesTitle) return;
            const slug = levelNode.choicesTitle
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, "-")
              .replace(/^-|-$/g, "");
            const choice = inlineChain[idx];
            if (!choice) return;
            const parts = splitMotifLabel(choice.label || "");
            vars[`${slug}-id`] = choice.id || "";
            vars[`${slug}-label`] = choice.label || "";
            vars[`${slug}-code`] = parts.code;
            vars[`${slug}-text`] = parts.text;
            // Abréviation dépendante du STATUT (pour sous-motifs avec abbrevAC / abbrevPL)
            const opt = choice.option || {};
            if (vars.statut === "A/C" && opt.abbrevAC) {
              vars[`${slug}-abbrev`] = opt.abbrevAC;
            } else if (vars.statut === "PL" && opt.abbrevPL) {
              vars[`${slug}-abbrev`] = opt.abbrevPL;
            }
          });

          return vars;
        }

        function getDeepestNode() {
          const lastChainEntry = inlineChain[inlineChain.length - 1];
          if (lastChainEntry && lastChainEntry.node) return lastChainEntry.node;
          return inlineRootNode || getCurrentNode();
        }

        function pruneInlineChain() {
          const vars = buildTemplateVars();
          let validLength = 0;
          for (let i = 0; i < inlineChain.length; i++) {
            const parentNode = i === 0 ? inlineRootNode : inlineChain[i - 1].node;
            if (!parentNode || !Array.isArray(parentNode.choix)) break;
            const option = parentNode.choix.find((o) => o.id === inlineChain[i].id);
            if (!option) break;
            if (option.conditions && !contextMatches(option.conditions, vars)) break;
            validLength = i + 1;
          }
          if (validLength < inlineChain.length) {
            inlineChain = inlineChain.slice(0, validLength);
          }
        }

        function findNextTarget() {
          const vars = buildTemplateVars();
          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions) && leaf.leafQuestions.length > 0) {
            let allAnswered = true;
            for (const q of leaf.leafQuestions) {
              if (!contextMatches(q.conditions, vars)) continue;
              if (leafAnswers[q.id] == null) {
                // Plus de scroll auto vers la carte DRETAF/SUSPEN non répondue.
                // (Comportement précédent jugé perturbant.)
                allAnswered = false;
                continue;
              }
              if (leafAnswers[q.id] === "oui" && Array.isArray(q.inputsOnYes)) {
                for (const inp of q.inputsOnYes) {
                  if (!leafInputs[inp.id]) {
                    return { type: "input", id: `leafInput-${inp.id}` };
                  }
                }
              }
            }
            if (allAnswered) return { type: "element", id: "resultsContainer" };
            return null;
          }
          if (leaf && Array.isArray(leaf.resultats) && leaf.resultats.length > 0) {
            return { type: "element", id: "resultsContainer" };
          }
          if (inlineRootNode) {
            return { type: "element", id: `cascade-level-${inlineChain.length}` };
          }
          return null;
        }

        function scrollToTarget(target) {
          if (!target) return;
          // Ne scrolle que si la cible change (évite de renvoyer aux résultats quand on réédite)
          if (target.id === lastScrollTargetId) return;
          lastScrollTargetId = target.id;
          requestAnimationFrame(() => {
            const el = document.getElementById(target.id);
            if (!el) return;
            el.scrollIntoView({ behavior: "auto", block: "center" });
            if (target.type === "input" && typeof el.focus === "function") el.focus();
          });
        }

        function renderBreadcrumbs() {
          breadcrumbs.innerHTML = "";
          let visibleCount = 0;

          if (inlineRootNode && trail.length === 1) {
            breadcrumbsSection.classList.add("hidden");
            return;
          }

          trail.forEach((item, index) => {
            if (index === 0) {
              return;
            }

            visibleCount += 1;

            const isLast = index === trail.length - 1;

            const crumb = document.createElement("button");
            crumb.type = "button";
            crumb.className = isLast
              ? "font-bold text-strong cursor-default"
              : "text-muted hover:text-strong underline decoration-dotted";
            crumb.textContent = item.label;

            if (!isLast) {
              crumb.addEventListener("click", () => {
                trail = trail.slice(0, index + 1);
                render();
              });
            } else {
              crumb.disabled = true;
            }

            breadcrumbs.appendChild(crumb);

            if (!isLast) {
              const sep = document.createElement("span");
              sep.className = "text-muted";
              sep.textContent = ">";
              breadcrumbs.appendChild(sep);
            }
          });

          breadcrumbsSection.classList.toggle("hidden", visibleCount === 0);
        }

        function renderQuestion(node) {
          inlineTitleContainer.innerHTML = "";

          if (inlineRootNode) {
            questionZone.innerHTML = "";
            return;
          }

          if (!node.question) {
            questionZone.innerHTML = "";
            return;
          }

          questionZone.innerHTML = `
            <div class="fade-in rounded-2xl surface-shell border p-5 shadow-sm text-center">
              <h2 class="text-base md:text-lg font-bold text-muted">${escapeHtml(node.question)}</h2>
            </div>
          `;
        }

        function renderToggles() {
          togglesContainer.innerHTML = "";

          // Helper pour créer une card-row toggle avec un seul bouton
          const buildToggleCard = (toggle, isOn, onClick) => {
            const card = document.createElement("section");
            card.className = "card-row";
            const content = document.createElement("div");
            content.className = "card-row-content";
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = `context-option pill-btn ${isOn ? "is-selected" : ""}`;
            btn.setAttribute("aria-pressed", isOn ? "true" : "false");
            btn.textContent = toggle.label || "";
            btn.addEventListener("click", onClick);
            content.appendChild(btn);
            card.appendChild(content);
            return card;
          };

          // 1. Toggles déjà activés (du stack), affichés sélectionnés
          activeToggleStack.forEach((entry, idx) => {
            const card = buildToggleCard(entry.toggle, true, () => {
              // Désactivation : restore au savedRootNode de cette entrée et
              // pop tout depuis cet idx.
              inlineRootNode = entry.savedRootNode;
              activeToggleStack = activeToggleStack.slice(0, idx);
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              render();
            });
            togglesContainer.appendChild(card);
          });

          // 2. Toggles disponibles dans le inlineRootNode courant (non encore activés)
          if (inlineRootNode && Array.isArray(inlineRootNode.toggles)) {
            inlineRootNode.toggles.forEach((toggle) => {
              if (activeToggleStack.some((e) => e.toggle.id === toggle.id)) return;
              const card = buildToggleCard(toggle, false, () => {
                // Activation : push dans le stack et swap inlineRootNode
                activeToggleStack.push({
                  savedRootNode: inlineRootNode,
                  toggle: toggle,
                });
                inlineRootNode = toggle.whenOn;
                inlineChain = [];
                leafAnswers = {};
                leafInputs = {};
                render();
              });
              togglesContainer.appendChild(card);
            });
          }

          // 3. Top questions liées aux toggles (stack + inlineRootNode si toggle actif).
          //    Les topQuestions des nœuds de la cascade (ex: motif-12 → FICOBA) sont
          //    rendues plus bas par renderCascade, à leur niveau.
          //    Re-cliquer sur la valeur sélectionnée la désélectionne (retour défaut).
          if (activeToggleStack.length > 0) {
            const topQuestionSources = new Set();
            activeToggleStack.forEach((entry) => topQuestionSources.add(entry.toggle.whenOn));
            if (inlineRootNode) topQuestionSources.add(inlineRootNode);

            const seenTopQuestionIds = new Set();
            topQuestionSources.forEach((level) => {
              if (!level || !Array.isArray(level.topQuestions)) return;
              level.topQuestions.forEach((q) => {
                if (seenTopQuestionIds.has(q.id)) return;
                seenTopQuestionIds.add(q.id);
                togglesContainer.appendChild(createTopQuestionCard(q));
              });
            });
          }
        }

        // Crée une card-row pour une topQuestion (label + boutons OUI/NON).
        // Re-cliquer sur la valeur sélectionnée la désélectionne (retour au défaut).
        function createTopQuestionCard(q) {
          const card = document.createElement("section");
          card.className = "card-row";
          const content = document.createElement("div");
          content.className = "card-row-content";

          const lbl = document.createElement("span");
          lbl.className = "leaf-input-label";
          lbl.textContent = q.label || "";
          content.appendChild(lbl);

          const currentAnswer = topAnswers[q.id];
          ["oui", "non"].forEach((val) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.textContent = val.toUpperCase();
            btn.className = `context-option pill-btn ${currentAnswer === val ? "is-selected" : ""}`;
            btn.setAttribute("aria-pressed", currentAnswer === val ? "true" : "false");
            btn.addEventListener("click", () => {
              if (topAnswers[q.id] === val) {
                delete topAnswers[q.id];
              } else {
                topAnswers[q.id] = val;
              }
              render();
            });
            content.appendChild(btn);
          });

          card.appendChild(content);
          return card;
        }

        // Crée juste l'élément <input> ou <textarea> avec ses listeners.
        function createFieldElement(input) {
          const value = nodeInputs[input.id] || "";
          let field;
          if ((input.type || "text") === "image") {
            // Zone de paste d'image. Tu peux soit cliquer dans la zone et faire Ctrl+V,
            // soit coller depuis n'importe où sur la page (le listener global capture).
            // La data URL est stockée dans nodeInputs.
            field = document.createElement("div");
            field.className = "image-paste-zone";
            field.tabIndex = 0;
            field.style.position = "relative";

            const img = document.createElement("img");
            img.alt = "";
            const placeholder = document.createElement("span");
            placeholder.className = "image-placeholder";
            placeholder.textContent = input.placeholder || "Coller une image (Ctrl+V) — peu importe où sur la page";

            // Bouton ✕ pour supprimer l'image (visible seulement quand une image est là)
            const closeBtn = document.createElement("button");
            closeBtn.type = "button";
            closeBtn.textContent = "✕";
            closeBtn.title = "Supprimer l'image";
            closeBtn.className = "image-clear-btn";
            closeBtn.addEventListener("click", (e) => {
              e.stopPropagation();
              delete nodeInputs[input.id];
              refresh();
              render();
            });

            const refresh = () => {
              const v = nodeInputs[input.id];
              if (v) {
                img.src = v;
                if (!field.contains(img)) field.appendChild(img);
                if (!field.contains(closeBtn)) field.appendChild(closeBtn);
                if (field.contains(placeholder)) field.removeChild(placeholder);
              } else {
                if (field.contains(img)) field.removeChild(img);
                if (field.contains(closeBtn)) field.removeChild(closeBtn);
                if (!field.contains(placeholder)) field.appendChild(placeholder);
              }
            };
            refresh();

            // Paste local sur la zone (équivalent au listener global, mais redondant
            // pour le cas où l'user clique exprès dans la zone avant de coller)
            field.addEventListener("paste", (e) => {
              e.preventDefault();
              const items = (e.clipboardData || window.clipboardData).items || [];
              for (const item of items) {
                if (item.type && item.type.startsWith("image/")) {
                  const blob = item.getAsFile();
                  const reader = new FileReader();
                  reader.onload = () => {
                    saveNodeInputValue(input.id, reader.result);
                    refresh();
                    renderResults(getDeepestNode());
                    renderPathPanel();
                  };
                  reader.readAsDataURL(blob);
                  return;
                }
              }
            });

            field.addEventListener("click", (e) => {
              if (e.target !== closeBtn) field.focus();
            });
            field.setAttribute("data-input-id", input.id);
            return field;
          }
          if ((input.type || "text") === "textarea") {
            field = document.createElement("textarea");
            field.className = "card-textarea";
            field.placeholder = input.placeholder || "";
            field.value = value;
            field.rows = 4;
            if (input.transform === "ecritures-compte") {
              field.addEventListener("paste", (e) => {
                e.preventDefault();
                const pasted = (e.clipboardData || window.clipboardData).getData("text");
                const cleaned = cleanEcritures(pasted);
                const start = field.selectionStart;
                const end = field.selectionEnd;
                const before = field.value.substring(0, start);
                const after = field.value.substring(end);
                field.value = before + cleaned + after;
                const cursorPos = start + cleaned.length;
                field.selectionStart = field.selectionEnd = cursorPos;
                field.dispatchEvent(new Event("input", { bubbles: true }));
              });
            }
          } else {
            field = document.createElement("input");
            field.type = input.type || "text";
            field.className = "card-input";
            field.placeholder = input.placeholder || "";
            field.value = value;
          }

          field.setAttribute("data-input-id", input.id);
          field.addEventListener("input", (event) => {
            saveNodeInputValue(input.id, event.target.value);
            // On ne rappelle PAS render() ici : cela reconstruirait le champ en
            // cours de saisie et ferait perdre le focus à chaque caractère.
            // On rafraîchit seulement les deux zones concernées.
            renderResults(getDeepestNode());
            renderPathPanel();
          });
          return field;
        }

        // Crée une card-row pour un input (text ou textarea), label à gauche.
        function createInputCard(input) {
          const card = document.createElement("div");
          card.className = "card-row";

          const lbl = document.createElement("div");
          lbl.className = "card-row-label";
          lbl.textContent = input.label || "";
          card.appendChild(lbl);

          const content = document.createElement("div");
          content.className = "card-row-content";
          content.appendChild(createFieldElement(input));
          card.appendChild(content);
          return card;
        }

        // Si l'option a defaultInputs, on pré-remplit (uniquement si vide).
        // Ex: motif 13 → DATE auto-remplie avec la date du jour.
        // defaultInputsConditions permet de limiter le pré-remplissage à un contexte
        // (ex: motif 14, on ne pré-remplit qu'en A/C, pas en PL où la date est BODACC).
        // Appelée au clic sur un choix, depuis createChoiceCard.
        function applyDefaultInputs(option) {
          if (!option || !option.defaultInputs || typeof option.defaultInputs !== "object") return;
          const conditionsOk =
            !option.defaultInputsConditions ||
            contextMatches(option.defaultInputsConditions, buildTemplateVars());
          if (!conditionsOk) return;
          Object.entries(option.defaultInputs).forEach(([inputId, val]) => {
            if (nodeInputs[inputId]) return; // ne pas écraser une saisie existante
            if (val === "today") {
              const _now = new Date();
              nodeInputs[inputId] =
                String(_now.getDate()).padStart(2, "0") + "/" +
                String(_now.getMonth() + 1).padStart(2, "0") + "/" +
                String(_now.getFullYear()).slice(-2);
            } else {
              nodeInputs[inputId] = val;
            }
          });
        }

        // Crée une card-row pour les choix d'un niveau de cascade.
        function createChoiceCard(levelNode, visibleChoix, levelIdx, isInline, vars) {
          const isMotifLayout = !!(levelNode.choicesTitle && levelNode.choicesTitle.toUpperCase().includes("MOTIF"));
          const isSousMotif = !!(levelNode.choicesTitle && levelNode.choicesTitle.toUpperCase().includes("SOUS"));
          const hideMotifCode = isSousMotif && globalSelections.statut === "PL";
          const selectionKey = levelNode.choicesTitle || levelNode.question || "default";
          const selectedIdAtLevel = isInline
            ? (inlineChain[levelIdx] ? inlineChain[levelIdx].id : null)
            : nodeSelections[selectionKey];

          const card = document.createElement("section");
          card.id = `cascade-level-${levelIdx}`;
          card.className = "card-row";

          const labelEl = document.createElement("div");
          labelEl.className = "card-row-label";
          labelEl.textContent = levelNode.choicesTitle || "";
          card.appendChild(labelEl);

          const content = document.createElement("div");
          content.className = "card-row-content";

          visibleChoix.forEach((option) => {
            const empty = isChoiceEmpty(option);
            const isSelected = selectedIdAtLevel === option.id;
            const button = document.createElement("button");
            button.type = "button";
            button.className = `context-option pill-btn ${isSelected ? "is-selected" : ""} ${empty ? "empty-choice" : ""}`;
            button.setAttribute("aria-pressed", isSelected ? "true" : "false");
            if (empty) button.title = "Choix non encore codé";

            const rawLabel = option.label || "Choix sans nom";
            let inner;

            if (isMotifLayout) {
              const parts = rawLabel.split(" - ");
              if (parts.length >= 2) {
                const code = escapeHtml(parts.shift());
                const text = escapeHtml(parts.join(" "));
                if (hideMotifCode) {
                  inner = `<span class="motif-label"><span class="motif-text">${text}</span></span>`;
                } else {
                  inner = `<span class="motif-label"><span class="motif-code">${code}</span><span class="motif-text">${text}</span></span>`;
                }
              } else {
                inner = `<span class="motif-label"><span class="motif-text">${escapeHtml(rawLabel)}</span></span>`;
              }
            } else {
              inner = escapeHtml(rawLabel);
            }

            button.innerHTML = `${empty ? `<span class="empty-tag">TODO</span>` : ""}${inner}`;

            button.addEventListener("click", () => {
              if (empty) {
                showToast("CHOIX NON ENCORE CODÉ");
                return;
              }

              applyDefaultInputs(option);

              if (isInline) {
                const nextNode = option.suite && typeof option.suite === "object" ? option.suite : null;
                inlineChain = inlineChain.slice(0, levelIdx).concat([{ id: option.id, label: option.label, option: option, node: nextNode }]);
                render();
                return;
              }
              if (trail.length === 1 && option.suite && typeof option.suite === "object") {
                inlineRootNode = option.suite;
                inlineChain = [];
                render();
                return;
              }
              if (option.suite && typeof option.suite === "object") {
                inlineRootNode = null;
                inlineChain = [];
                trail.push({
                  label: option.label || "Etape",
                  node: option.suite,
                });
                render();
              }
            });

            content.appendChild(button);
          });

          card.appendChild(content);
          return card;
        }

        // Inputs réellement visibles d'un niveau : filtrés par `conditions` puis
        // dédupliqués par `id` (si 2 inputs partagent le même id, le dernier qui
        // matche gagne — c'est ce qui renomme DATE en "DATE DE PARUTION JUGEMENT
        // BODACC" pour le motif 14 en PL).
        // Extrait de renderCascade pour que le panneau CHEMIN affiche EXACTEMENT
        // les mêmes champs que la cascade, sans risque de divergence.
        function getVisibleInputs(levelNode, vars) {
          if (!levelNode || !Array.isArray(levelNode.inputs)) return [];
          const inputsToRender = [];
          const idToIdx = new Map();
          levelNode.inputs.forEach((input) => {
            if (input.conditions && !contextMatches(input.conditions, vars)) return;
            if (idToIdx.has(input.id)) {
              inputsToRender[idToIdx.get(input.id)] = input;
            } else {
              idToIdx.set(input.id, inputsToRender.length);
              inputsToRender.push(input);
            }
          });
          return inputsToRender;
        }

        // Rendu unifié de la cascade : pour chaque niveau, on rend d'abord les
        // inputs (DATE, ÉCRITURES…) puis les choix (MOTIF, RAISON…).
        // C'est ce qui permet à ÉCRITURES (input du niveau verse-oui) de s'intercaler
        // entre VERSEMENT RÉCENT (choix du niveau racine) et RAISON (choix du verse-oui).
        function renderCascade() {
          cascadeFlow.innerHTML = "";

          const isInline = !!inlineRootNode;
          if (!isInline && trail.length === 1) return;

          const vars = buildTemplateVars();
          const rootNode = isInline ? inlineRootNode : getCurrentNode();
          const cascade = isInline
            ? [rootNode, ...inlineChain.map((step) => step.node).filter(Boolean)]
            : [rootNode];

          cascade.forEach((levelNode, levelIdx) => {
            if (!levelNode) return;

            // 1. Inputs du niveau, filtrés par conditions et dédupliqués par id.
            //    Si plusieurs inputs ont le même id (avec conditions différentes),
            //    le dernier qui matche gagne (override de label/placeholder).
            //    Cas type : motif 14 PL → "date" devient "DATE DE PARUTION JUGEMENT BODACC".
            //    Les inputs avec `inline: true` consécutifs sont regroupés sur la même card-row.
            if (Array.isArray(levelNode.inputs) && levelNode.inputs.length > 0) {
              const inputsToRender = getVisibleInputs(levelNode, vars);

              let currentInlineContent = null;
              inputsToRender.forEach((input) => {
                if (input.inline) {
                  if (!currentInlineContent) {
                    const card = document.createElement("div");
                    card.className = "card-row";
                    const content = document.createElement("div");
                    content.className = "card-row-content card-row-inline";
                    card.appendChild(content);
                    cascadeFlow.appendChild(card);
                    currentInlineContent = content;
                  }
                  const wrap = document.createElement("span");
                  wrap.className = "leaf-input-wrap";
                  const lbl = document.createElement("span");
                  lbl.className = "leaf-input-label";
                  lbl.textContent = input.label || "";
                  wrap.appendChild(lbl);
                  wrap.appendChild(createFieldElement(input));
                  currentInlineContent.appendChild(wrap);
                } else {
                  currentInlineContent = null;
                  cascadeFlow.appendChild(createInputCard(input));
                }
              });
            }

            // 2. Choix du niveau (ex : MOTIF, VERSEMENT RÉCENT, RAISON)
            if (Array.isArray(levelNode.choix) && levelNode.choix.length > 0) {
              const visibleChoix = levelNode.choix.filter((option) =>
                !option.conditions || contextMatches(option.conditions, vars)
              );
              if (visibleChoix.length > 0) {
                cascadeFlow.appendChild(createChoiceCard(levelNode, visibleChoix, levelIdx, isInline, vars));
              }
            }

            // 3. topQuestions du niveau (uniquement pour niveaux > 0 — le niveau 0
            //    est déjà géré par renderToggles s'il vient d'un toggle activé).
            //    Ex : FICOBA DISPONIBLE ? est sur motif-12-psa.suite (niveau 1),
            //    rendu juste après les choix SOUS-MOTIF de ce niveau.
            if (levelIdx > 0 && Array.isArray(levelNode.topQuestions) && levelNode.topQuestions.length > 0) {
              levelNode.topQuestions.forEach((q) => {
                cascadeFlow.appendChild(createTopQuestionCard(q));
              });
            }
          });
        }

        function updateContextSelectionClasses(groupId, value) {
          contextPanel
            .querySelectorAll(`[data-context-group="${groupId}"]`)
            .forEach((button) => {
              button.classList.toggle(
                "is-selected",
                button.getAttribute("data-context-value") === value
              );
            });
        }

        function renderContextPanel() {
          if (!globalContextOptions.length) {
            contextPanel.innerHTML = "";
            contextPanel.classList.add("hidden");
            return;
          }

          contextPanel.classList.remove("hidden");
          contextPanel.innerHTML = globalContextOptions
            .map((group) => {
              const selected = globalSelections[group.id] || "";
              const buttons = group.choix
                .map((value) => {
                  const selectedClass = selected === value ? "is-selected" : "";
                  return `
                    <button
                      type="button"
                      class="context-option pill-btn ${selectedClass}"
                      aria-pressed="${selected === value ? "true" : "false"}"
