                      data-context-group="${escapeHtml(group.id)}"
                      data-context-value="${escapeHtml(value)}"
                    >${escapeHtml(value)}</button>
                  `;
                })
                .join("");
              return `
                <div class="card-row">
                  <div class="card-row-label">${escapeHtml(group.label)}</div>
                  <div class="card-row-content">${buttons}</div>
                </div>
              `;
            })
            .join("");

          contextPanel.querySelectorAll("[data-context-group]").forEach((button) => {
            button.addEventListener("click", () => {
              const groupId = button.getAttribute("data-context-group");
              const value = button.getAttribute("data-context-value");

              if (globalSelections[groupId] === value) {
                return;
              }

              globalSelections[groupId] = value;
              pruneInlineChain();
              render();
            });
          });
        }

        function renderCategoryTabs() {
          categoryTabs.innerHTML = "";
          const categories = Array.isArray(window.treeData.choix) ? window.treeData.choix : [];

          if (categories.length <= 1) {
            categoryTabs.classList.add("hidden");
            return;
          }

          categoryTabs.classList.remove("hidden");

          const card = document.createElement("section");
          card.className = "card-row";

          const labelEl = document.createElement("div");
          labelEl.className = "card-row-label";
          labelEl.textContent = "CATÉGORIE";
          card.appendChild(labelEl);

          const content = document.createElement("div");
          content.className = "card-row-content";

          if (inlineRootNode) {
            const back = document.createElement("button");
            back.type = "button";
            back.id = "inlineBackArrow";
            back.className = "back-arrow-btn";
            back.setAttribute("aria-label", "Quitter la catégorie");
            back.title = "Quitter la catégorie (RETOUR dans l'en-tête recule d'un seul niveau)";
            back.textContent = "←";
            back.addEventListener("click", () => {
              inlineRootNode = null;
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              activeToggleStack = [];
              topAnswers = {};
              render();
            });
            content.appendChild(back);
          }

          categories.forEach((cat) => {
            const pill = document.createElement("button");
            pill.type = "button";
            const isActive = !!(cat.suite && inlineRootNode === cat.suite);
            pill.className = `context-option pill-btn ${isActive ? "is-selected" : ""}`;
            pill.setAttribute("aria-pressed", isActive ? "true" : "false");
            pill.textContent = cat.label || "";
            pill.addEventListener("click", () => {
              if (isActive) return;
              if (!cat.suite || typeof cat.suite !== "object") {
                showToast("CATÉGORIE NON ENCORE CODÉE");
                return;
              }
              inlineRootNode = cat.suite;
              inlineChain = [];
              leafAnswers = {};
              leafInputs = {};
              activeToggleStack = [];
              topAnswers = {};
              render();
            });
            content.appendChild(pill);
          });

          card.appendChild(content);
          categoryTabs.appendChild(card);
        }

        function renderLeafQuestions() {
          leafQuestionsContainer.innerHTML = "";
          const leaf = getDeepestNode();
          if (!leaf || !Array.isArray(leaf.leafQuestions) || leaf.leafQuestions.length === 0) return;

          const vars = buildTemplateVars();

          leaf.leafQuestions.forEach((q) => {
            if (!contextMatches(q.conditions, vars)) return;

            const card = document.createElement("section");
            card.id = `leafQuestion-${q.id}`;
            card.className = "card-row";

            const labelEl = document.createElement("div");
            labelEl.className = "card-row-label";
            labelEl.textContent = q.label || q.id || "";
            card.appendChild(labelEl);

            const content = document.createElement("div");
            content.className = "card-row-content";

            const currentAnswer = leafAnswers[q.id];

            // Par défaut OUI/NON ; supporte d'autres valeurs via q.choices (ex: ["ae", "ti"]).
            const choices = Array.isArray(q.choices) && q.choices.length > 0
              ? q.choices
              : ["oui", "non"];
            choices.forEach((val) => {
              const btn = document.createElement("button");
              btn.type = "button";
              btn.textContent = String(val).toUpperCase();
              btn.className = `context-option pill-btn ${currentAnswer === val ? "is-selected" : ""}`;
              btn.setAttribute("aria-pressed", currentAnswer === val ? "true" : "false");
              btn.addEventListener("click", () => {
                if (leafAnswers[q.id] === val) return;
                leafAnswers[q.id] = val;
                if (val === "non" && Array.isArray(q.inputsOnYes)) {
                  q.inputsOnYes.forEach((input) => {
                    delete leafInputs[input.id];
                  });
                }
                render();
              });
              content.appendChild(btn);
            });

            if (currentAnswer === "oui" && Array.isArray(q.inputsOnYes) && q.inputsOnYes.length > 0) {
              q.inputsOnYes.forEach((input) => {
                const wrap = document.createElement("span");
                wrap.className = "leaf-input-wrap";

                const lbl = document.createElement("span");
                lbl.className = "leaf-input-label";
                lbl.textContent = input.label || "";
                wrap.appendChild(lbl);

                const inputEl = document.createElement("input");
                inputEl.id = `leafInput-${input.id}`;
                inputEl.type = input.type || "text";
                inputEl.placeholder = input.placeholder || "";
                inputEl.value = leafInputs[input.id] || "";
                inputEl.className = "card-input";
                inputEl.addEventListener("input", (e) => {
                  leafInputs[input.id] = e.target.value;
                  // Idem : pas de render() complet pour ne pas perdre le focus.
                  renderResults(getDeepestNode());
                  renderPathPanel();
                });
                inputEl.addEventListener("keydown", (e) => {
                  if (e.key === "Enter") {
                    e.preventDefault();
                    inputEl.blur();
                  }
                });
                wrap.appendChild(inputEl);
                content.appendChild(wrap);
              });
            }

            card.appendChild(content);
            leafQuestionsContainer.appendChild(card);
          });
        }

        // Repli pour les navigateurs d'entreprise anciens (ou les contextes où
        // navigator.clipboard n'existe pas, ex. page ouverte en file:// sur
        // certaines configs). On sélectionne un bloc invisible et on demande au
        // navigateur de copier : c'est la méthode historique, elle préserve le
        // format riche (gras / souligné / puces) tout comme ClipboardItem.
        function legacyCopyHtml(html, plainText) {
          try {
            const holder = document.createElement("div");
            holder.setAttribute("contenteditable", "true");
            holder.innerHTML = html;
            holder.style.cssText =
              "position:fixed;left:-99999px;top:0;white-space:pre-wrap;";
            document.body.appendChild(holder);
            const range = document.createRange();
            range.selectNodeContents(holder);
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);
            const done = document.execCommand("copy");
            sel.removeAllRanges();
            document.body.removeChild(holder);
            if (done) return true;
          } catch (err) {
            console.error(err);
          }
          // Dernier recours : texte brut via un textarea temporaire.
          try {
            const ta = document.createElement("textarea");
            ta.value = plainText;
            ta.style.cssText = "position:fixed;left:-99999px;top:0;";
            document.body.appendChild(ta);
            ta.select();
            const done = document.execCommand("copy");
            document.body.removeChild(ta);
            return done;
          } catch (err) {
            console.error(err);
            return false;
          }
        }

        // Copie texte simple avec le même repli (utilisé par COPIER LE CHEMIN).
        async function copyPlainText(text) {
          try {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(text);
              return true;
            }
          } catch (err) {
            console.error(err);
          }
          return legacyCopyHtml("", text) === true;
        }

        async function copyRichHtml(html, button) {
          const originalText = button.textContent;
          const plainText = stripHtmlToText(html);
          let ok = false;

          try {
            if (navigator.clipboard && window.ClipboardItem) {
              const item = new ClipboardItem({
                "text/html": new Blob([html], { type: "text/html" }),
                "text/plain": new Blob([plainText], { type: "text/plain" }),
              });
              await navigator.clipboard.write([item]);
              ok = true;
            } else if (navigator.clipboard && navigator.clipboard.writeText) {
              await navigator.clipboard.writeText(plainText);
              ok = true;
            }
          } catch (err) {
            console.error(err);
          }

          if (!ok) ok = legacyCopyHtml(html, plainText);

          if (ok) {
            button.textContent = "COPIÉ ✓";
            button.classList.add("copy-success");
            setTimeout(() => {
              button.textContent = originalText;
              button.classList.remove("copy-success");
            }, 1200);
          } else {
            button.textContent = "ERREUR COPIE";
            setTimeout(() => {
              button.textContent = originalText;
            }, 1400);
          }
        }

        function renderResults(node) {
          resultsContainer.innerHTML = "";

          if (!node || !Array.isArray(node.resultats) || node.resultats.length === 0) return;

          const vars = buildTemplateVars();
          const subBlocsById = {};
          const resultBlocks = [];

          // 1ère passe : enregistrer les fragments dans subBlocsById, indépendamment
          // de leur position dans le tableau resultats. Comme ça les composites
          // peuvent les référencer via "combine" même s'ils sont définis après.
          node.resultats.forEach((res) => {
            if (res.if && !contextMatches(res.if, vars)) return;
            if ((res.type || "simple") !== "fragment") return;
            if (res.id) {
              const texte = substituteTemplate(res.texte || "", vars);
              subBlocsById[res.id] = { id: res.id, texte };
            }
          });

          // 2ème passe : construire les articles visibles (simple/multi/composite).
          node.resultats.forEach((res) => {
            if (res.if && !contextMatches(res.if, vars)) return;
            const kind = res.type || "simple";

            if (kind === "fragment") return; // déjà traité plus haut

            if (kind === "simple") {
              const texte = substituteTemplate(res.texte || "", vars);
              const sub = { id: res.id || res.label, texte };
              if (res.id) subBlocsById[res.id] = sub;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: [sub],
                source: res,
              });
            } else if (kind === "multi") {
              const subs = (res.blocs || [])
                .filter((b) => !b.if || contextMatches(b.if, vars))
                .map((b) => {
                  const texte = substituteTemplate(b.texte || "", vars);
                  const sub = { id: b.id, texte };
                  if (b.id) subBlocsById[b.id] = sub;
                  return sub;
                });
              if (subs.length === 0) return;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: subs,
                source: res,
              });
            } else if (kind === "composite") {
              const sep = res.separator != null ? res.separator : "\n";
              const parts = (res.combine || [])
                .map((refId) => subBlocsById[refId])
                .filter(Boolean)
                .map((sub) => sub.texte);
              if (parts.length === 0) return;
              let texte = parts.join(sep);
              // Fragments append-only (séparateur différent du combine).
              // Ex: WATT du motif 12 → "(Pas de FICOBA car site KO)" en suffixe
              // avec "<br><br>" au lieu de "<br>+<br>".
              if (Array.isArray(res.appendFragments)) {
                const appendSep = res.appendSeparator != null ? res.appendSeparator : "\n";
                res.appendFragments.forEach((refId) => {
                  const sub = subBlocsById[refId];
                  if (sub) texte += appendSep + sub.texte;
                });
              }
              const sub = { id: res.id || res.label, texte };
              if (res.id) subBlocsById[res.id] = sub;
              resultBlocks.push({
                id: res.id || res.label || "",
                label: res.label || "",
                subBlocs: [sub],
                source: res,
              });
            }
          });

          for (let i = 0; i < resultBlocks.length; i++) {
            const rb = resultBlocks[i];
            const src = rb.source;
            if (!src.mergeWithCompositeIfSingle) continue;
            if (rb.subBlocs.length !== 1) continue;
            const compIdx = resultBlocks.findIndex((o) => o.id === src.mergeWithCompositeIfSingle);
            if (compIdx < 0) continue;
            const comp = resultBlocks[compIdx];
            if (comp.subBlocs.length === 1 && comp.subBlocs[0].texte === rb.subBlocs[0].texte) {
              resultBlocks[i] = {
                id: rb.id,
                label: src.mergedLabel || `${rb.label} & ${comp.label}`,
                subBlocs: rb.subBlocs,
                source: rb.source,
              };
              resultBlocks.splice(compIdx, 1);
              break;
            }
          }

          // Fabrique un bouton COPIER pour un texte donné.
          const makeCopyButton = (texte) => {
            const copyBtn = document.createElement("button");
            copyBtn.type = "button";
            copyBtn.className = "copy-btn";
            copyBtn.textContent = "COPIER";
            copyBtn.addEventListener("click", () => copyRichHtml(texte || "", copyBtn));
            return copyBtn;
          };

          resultBlocks.forEach((rb) => {
            const card = document.createElement("article");
            card.className = "result-card";

            const header = document.createElement("div");
            header.className = "result-header";

            const title = document.createElement("span");
            title.className = "result-title";
            title.textContent = rb.label || "Résultat";
            header.appendChild(title);

            // Bloc unique → le bouton COPIER va dans le bandeau, en haut à droite.
            // Bloc multi → un bouton par sous-bloc (chacun se copie séparément).
            const singleSub = rb.subBlocs.length === 1;
            if (singleSub) {
              header.appendChild(makeCopyButton(rb.subBlocs[0].texte));
            }
            card.appendChild(header);

            const body = document.createElement("div");
            body.className = "result-body";

            rb.subBlocs.forEach((sub) => {
              const subWrap = document.createElement("div");
              subWrap.className = "result-sub";

              const content = document.createElement("div");
              content.className = "result-content";
              content.innerHTML = sub.texte || "";
              subWrap.appendChild(content);

              if (!singleSub) subWrap.appendChild(makeCopyButton(sub.texte));

              body.appendChild(subWrap);
            });

            card.appendChild(body);
            resultsContainer.appendChild(card);
          });
        }

        // ====================================================================
        // PANNEAU CHEMIN / TODO
        // --------------------------------------------------------------------
        // Reconstruit uniquement à partir de l'état existant de l'application
        // (inlineRootNode, inlineChain, activeToggleStack, nodeInputs,
        // leafAnswers, leafInputs, topAnswers). Aucune donnée métier n'est
        // ajoutée dans data.js pour l'alimenter.
        //
        // Chaque étape a un état :
        //   "done"    ✓ étape franchie (et cliquable si on peut y revenir)
        //   "current" › étape en cours (la 1ère non franchie)
        //   "todo"    ○ étape restante
        // ====================================================================

        // Est-on dans le cas particulier "une seule catégorie" ? Dans ce cas
        // l'application entre automatiquement dedans et on ne peut pas en sortir.
        const singleCategoryMode = !!(
          Array.isArray(window.treeData.choix) &&
          window.treeData.choix.length === 1 &&
          window.treeData.choix[0].suite &&
          typeof window.treeData.choix[0].suite === "object"
        );

        function pushQuestionStep(steps, q, answers) {
          const ans = answers[q.id];
          steps.push({
            label: (q.label || q.id || "").replace(/\s*\?\s*$/, "").trim(),
            value: ans ? String(ans).toUpperCase() : "",
            state: ans ? "done" : "todo",
          });
        }

        function buildPathSteps() {
          const vars = buildTemplateVars();
          const steps = [];

          // 1. Catégorie active
          const categoryNode = activeToggleStack.length > 0
            ? activeToggleStack[0].savedRootNode
            : inlineRootNode;

          if (!categoryNode) {
            steps.push({ label: "CATÉGORIE", value: "", state: "todo" });
            return steps;
          }

          const cat = (window.treeData.choix || []).find((c) => c.suite === categoryNode);
          steps.push({
            label: "CATÉGORIE",
            value: cat && cat.label ? cat.label : "",
            state: "done",
            goTo: { type: "category" },
          });

          // 2. Toggles activés (AMIABLE RELDET, DETTE NON EXIGIBLE…)
          activeToggleStack.forEach((entry) => {
            steps.push({
              label: "OPTION",
              value: (entry.toggle && entry.toggle.label) || "",
              state: "done",
            });
          });

          // 3. topQuestions rattachées aux toggles : elles s'affichent dans la
          //    rangée des toggles, donc juste après eux dans le chemin.
          //    (Même condition que renderToggles : seulement si un toggle est actif.)
          if (activeToggleStack.length > 0) {
            const sources = new Set();
            activeToggleStack.forEach((entry) => sources.add(entry.toggle.whenOn));
            if (inlineRootNode) sources.add(inlineRootNode);
            const seen = new Set();
            sources.forEach((level) => {
              if (!level || !Array.isArray(level.topQuestions)) return;
              level.topQuestions.forEach((q) => {
                if (seen.has(q.id)) return;
                seen.add(q.id);
                pushQuestionStep(steps, q, topAnswers);
              });
            });
          }

          // 4. Cascade : pour chaque niveau, inputs → choix → topQuestions,
          //    dans le même ordre que renderCascade.
          const cascade = [inlineRootNode, ...inlineChain.map((s) => s.node).filter(Boolean)];
          cascade.forEach((levelNode, levelIdx) => {
            if (!levelNode) return;

            getVisibleInputs(levelNode, vars).forEach((input) => {
              const raw = nodeInputs[input.id];
              const filled = raw != null && raw !== "";
              const isImage = (input.type || "text") === "image";
              steps.push({
                label: input.label || input.id || "",
                value: filled ? (isImage ? "IMAGE COLLÉE" : String(raw)) : "",
                state: filled ? "done" : "todo",
              });
            });

            if (Array.isArray(levelNode.choix) && levelNode.choix.length > 0) {
              const visibleChoix = levelNode.choix.filter(
                (option) => !option.conditions || contextMatches(option.conditions, vars)
              );
              if (visibleChoix.length > 0) {
                const chosen = inlineChain[levelIdx];
                steps.push({
                  label: levelNode.choicesTitle || "CHOIX",
                  value: chosen ? chosen.label || "" : "",
                  state: chosen ? "done" : "todo",
                  // Cliquer = revenir directement à ce niveau (on coupe la suite).
                  goTo: chosen ? { type: "level", levelIdx: levelIdx } : null,
                });
              }
            }

            if (levelIdx > 0 && Array.isArray(levelNode.topQuestions)) {
              levelNode.topQuestions.forEach((q) => pushQuestionStep(steps, q, topAnswers));
            }
          });

          // 5. leafQuestions du nœud le plus profond (DRETAF, DCA, AE/TI…)
          const leaf = getDeepestNode();
          if (leaf && Array.isArray(leaf.leafQuestions)) {
            leaf.leafQuestions.forEach((q) => {
              if (!contextMatches(q.conditions, vars)) return;
              pushQuestionStep(steps, q, leafAnswers);
              if (leafAnswers[q.id] === "oui" && Array.isArray(q.inputsOnYes)) {
                q.inputsOnYes.forEach((input) => {
                  const v = leafInputs[input.id];
                  steps.push({
                    label: input.label || input.id || "",
                    value: v || "",
                    state: v ? "done" : "todo",
                  });
                });
              }
            });
          }

          // 6. Résultat — renseigné après coup par renderPathPanel, qui est
          //    appelé APRÈS renderResults et peut donc compter les blocs réels.
          return steps;
        }

        function applyPathGoTo(goTo) {
          if (!goTo) return;
          if (goTo.type === "category") {
            // Retour à la racine de la catégorie : on vide la cascade.
            inlineChain = [];
          } else if (goTo.type === "level") {
            inlineChain = inlineChain.slice(0, goTo.levelIdx);
          }
          // COMPTE / STATUT (globalSelections) ne sont jamais touchés.
          render();
        }

        function renderPathPanel() {
          pathPanel.innerHTML = "";

          const steps = buildPathSteps();

          // Étape finale : les blocs à copier. renderPathPanel est appelé après
          // renderResults, donc le conteneur est déjà rempli.
          const blocCount = resultsContainer.childElementCount;
          steps.push({
            label: "RÉSULTAT",
            value: blocCount > 0 ? blocCount + (blocCount > 1 ? " BLOCS À COPIER" : " BLOC À COPIER") : "",
            state: blocCount > 0 ? "done" : "todo",
          });

          // La 1ère étape non franchie devient l'étape "en cours".
          let currentFound = false;
          steps.forEach((step) => {
            if (!currentFound && step.state !== "done") {
              step.state = "current";
              currentFound = true;
            }
          });

          const doneCount = steps.filter((s) => s.state === "done").length;
          pathCount.textContent = doneCount + "/" + steps.length;

          steps.forEach((step) => {
            const clickable = !!step.goTo;
            const el = document.createElement(clickable ? "button" : "div");
            if (clickable) {
              el.type = "button";
              el.title = "Revenir à cette étape";
            }
            el.className = "path-step is-" + step.state;

            const mark = document.createElement("span");
            mark.className = "path-mark";
            mark.textContent = step.state === "done" ? "✓" : step.state === "current" ? "›" : "○";
            el.appendChild(mark);

            const label = document.createElement("span");
            label.className = "path-label";
            label.textContent = step.label;
            el.appendChild(label);

            const value = document.createElement("span");
            value.className = "path-value";
            // textContent : jamais d'innerHTML ici, donc rien à échapper.
            value.textContent = step.value || "À RENSEIGNER";
            el.appendChild(value);

            if (clickable) {
              el.addEventListener("click", () => applyPathGoTo(step.goTo));
            }

            pathPanel.appendChild(el);
          });
        }

        // ====================================================================
        // RETOUR / RECOMMENCER
        // ====================================================================

        // Y a-t-il quelque chose derrière nous ?
        function canGoBack() {
          if (inlineChain.length > 0) return true;
          if (activeToggleStack.length > 0) return true;
          return !!inlineRootNode && !singleCategoryMode;
        }

        // RETOUR = recule d'UN SEUL niveau, dans cet ordre :
        //   1. dernier choix de la cascade
        //   2. sinon, dernier toggle activé
        //   3. sinon, on quitte la catégorie
        // COMPTE / STATUT ne sont jamais touchés.
        function goBackOneStep() {
          if (inlineChain.length > 0) {
            inlineChain = inlineChain.slice(0, inlineChain.length - 1);
            render();
            return;
          }

          if (activeToggleStack.length > 0) {
            const entry = activeToggleStack[activeToggleStack.length - 1];
            inlineRootNode = entry.savedRootNode;
            activeToggleStack = activeToggleStack.slice(0, activeToggleStack.length - 1);
            inlineChain = [];
            leafAnswers = {};
            leafInputs = {};
            render();
            return;
          }

          if (inlineRootNode && !singleCategoryMode) {
            // Sortie de catégorie : même remise à zéro que la flèche ← historique.
            inlineRootNode = null;
            inlineChain = [];
            leafAnswers = {};
            leafInputs = {};
            activeToggleStack = [];
            topAnswers = {};
            render();
          }
        }

        // Réapplique l'entrée automatique dans la catégorie unique, s'il n'y en
        // a qu'une seule dans treeData (comportement d'origine au démarrage).
        function applyInitialInlineRoot() {
          if (singleCategoryMode) {
            inlineRootNode = window.treeData.choix[0].suite;
          }
        }

        // RECOMMENCER = dossier suivant. On remet tout le parcours à zéro MAIS on
        // garde COMPTE et STATUT (globalSelections), qui ne changent pas d'un
        // dossier à l'autre : ça économise 2 clics à chaque dossier.
        function resetDossier() {
          trail = [{ label: "", node: window.treeData }];
          inlineRootNode = null;
          inlineChain = [];
          nodeInputs = {};
          nodeSelections = {};
          leafAnswers = {};
          leafInputs = {};
          topAnswers = {};
          activeToggleStack = [];
          lastScrollTargetId = null;
          applyInitialInlineRoot();
          window.scrollTo(0, 0);
          render();
          showToast("NOUVEAU DOSSIER — COMPTE ET STATUT CONSERVÉS");
        }

        if (backBtn) backBtn.addEventListener("click", goBackOneStep);
        if (resetBtn) resetBtn.addEventListener("click", resetDossier);

        function render() {
          // On capture la position de scroll avant le re-rendu pour la restaurer.
          // Sinon le navigateur peut décaler la vue quand un élément (ex: input N° CO)
          // disparaît du DOM et que la hauteur totale change.
          const _scrollY = window.scrollY;

          const node = getDisplayNode();
          const deepestNode = getDeepestNode();

          renderBreadcrumbs();
          renderCategoryTabs();
          renderQuestion(node);
          renderContextPanel();
          renderToggles();
          renderCascade();
          renderLeafQuestions();
          renderResults(deepestNode);
          // renderPathPanel en dernier : il compte les blocs résultat déjà rendus.
          renderPathPanel();
          if (backBtn) backBtn.disabled = !canGoBack();
          // Plus de scroll auto ni de focus auto : l'utilisateur navigue à son rythme.

          // Restauration de la position : on force avant ET après le reflow
          // (au cas où le navigateur ajusterait après son recalcul de hauteur).
          if (window.scrollY !== _scrollY) {
            window.scrollTo(0, _scrollY);
          }
          requestAnimationFrame(() => {
            if (window.scrollY !== _scrollY) {
              window.scrollTo(0, _scrollY);
            }
          });
        }

        // Entrée automatique s'il n'y a qu'une seule catégorie dans treeData.
        // (Logique inchangée, juste extraite dans une fonction pour être
        // réutilisée par RECOMMENCER.)
        applyInitialInlineRoot();

        // Construit une chaîne décrivant tous les choix actuels (utile pour
        // copier-coller le chemin dans une conversation Claude).
        // Format : "ACTIF + A/C + DÉLAI + REFUS - PAS DE PJ + MOIS=37 + DCA NON + PLUS50K OUI"
        function getCurrentPathString() {
          const parts = [];

          // 1. Contexte global (COMPTE / STATUT)
          (globalContextOptions || []).forEach((opt) => {
            const v = globalSelections[opt.id];
            if (v) parts.push(v);
          });

          // 2. Catégorie active : on retrouve son label en cherchant dans treeData
          //    le choix dont la suite correspond au savedRootNode du 1er toggle ou
          //    au inlineRootNode courant.
          const categoryNode = activeToggleStack.length > 0
            ? activeToggleStack[0].savedRootNode
            : inlineRootNode;
          if (categoryNode) {
            const cat = (window.treeData.choix || []).find((c) => c.suite === categoryNode);
            if (cat && cat.label) parts.push(cat.label);
          }

          // 3. Toggles activés (ex: AMIABLE RELDET, DETTE NON EXIGIBLE)
          activeToggleStack.forEach((entry) => {
            if (entry.toggle && entry.toggle.label) parts.push(entry.toggle.label);
          });

          // 4. Cascade (inlineChain : choix de MOTIF, SOUS-MOTIF, RAISON, etc.)
          inlineChain.forEach((step) => {
            if (step.label) parts.push(step.label);
          });

          // Helper : récupère les leafQuestions et inputs accessibles à tous les
          // niveaux de l'arbre courant pour mapper id → label.
          const idToLabel = {};
          const collectLabels = (node) => {
            if (!node) return;
            if (Array.isArray(node.leafQuestions)) {
              node.leafQuestions.forEach((q) => { idToLabel[q.id] = q.label || q.id; });
            }
            if (Array.isArray(node.inputs)) {
              node.inputs.forEach((i) => { idToLabel[i.id] = i.label || i.id; });
            }
            if (Array.isArray(node.topQuestions)) {
              node.topQuestions.forEach((q) => { idToLabel[q.id] = q.label || q.id; });
            }
          };
          activeToggleStack.forEach((entry) => collectLabels(entry.toggle.whenOn));
          if (inlineRootNode) collectLabels(inlineRootNode);
          inlineChain.forEach((step) => collectLabels(step.node));

          // Helper : ajoute "LABEL VAL" si val est oui/non/ae/ti, sinon "LABEL=VAL"
          const fmt = (id, val) => {
            const label = (idToLabel[id] || id).replace(/\s*\?\s*$/, "").trim();
            const v = String(val).toUpperCase();
            const isFlag = ["OUI", "NON", "AE", "TI"].includes(v);
            return isFlag ? `${label} ${v}` : `${label}=${val}`;
          };

          // 5. Inputs remplis (DATE, MOIS, etc.)
          Object.entries(nodeInputs).forEach(([id, val]) => {
            if (val !== undefined && val !== "") parts.push(fmt(id, val));
          });

          // 6. LeafAnswers (DCA, plus50k, ae-ti, dretaf, suspen, ficoba, etc.)
          Object.entries(leafAnswers).forEach(([id, val]) => {
            if (val) parts.push(fmt(id, val));
          });
          Object.entries(leafInputs).forEach(([id, val]) => {
            if (val) parts.push(fmt(id, val));
          });

          // 7. TopAnswers (compte-en-ligne, ficoba…)
          Object.entries(topAnswers).forEach(([id, val]) => {
            if (val) parts.push(fmt(id, val));
          });

          return parts.join(" + ") || "(aucun choix)";
        }

        // Trouve l'id du 1er input de type "image" présent dans la cascade courante.
        function findActiveImageInputId() {
          const isInline = !!inlineRootNode;
          const cascade = isInline
            ? [inlineRootNode, ...inlineChain.map((s) => s.node).filter(Boolean)]
            : [getCurrentNode()];
          for (const lvl of cascade) {
            if (lvl && Array.isArray(lvl.inputs)) {
              for (const inp of lvl.inputs) {
                if (inp.type === "image") return inp.id;
              }
            }
          }
          return null;
        }

        // Listener paste GLOBAL : si une image est dans le clipboard et qu'un input
        // de type "image" est actif dans la cascade courante, on capture l'image
        // sans qu'il faille avoir cliqué dans la zone.
        document.addEventListener("paste", (e) => {
          const items = (e.clipboardData || window.clipboardData)?.items || [];
          let imageItem = null;
          for (const item of items) {
            if (item.type && item.type.startsWith("image/")) {
              imageItem = item;
              break;
            }
          }
          if (!imageItem) return;

          const imageInputId = findActiveImageInputId();
          if (!imageInputId) return;

          e.preventDefault();
          const blob = imageItem.getAsFile();
          if (!blob) return;
          const reader = new FileReader();
          reader.onload = () => {
            saveNodeInputValue(imageInputId, reader.result);
            render();
          };
          reader.readAsDataURL(blob);
        });

        // Listener du bouton "📋 chemin"
        const copyPathBtn = document.getElementById("copyPathBtn");
        if (copyPathBtn) {
          copyPathBtn.addEventListener("click", async () => {
            const path = getCurrentPathString();
            const ok = await copyPlainText(path);
            showToast(ok ? "CHEMIN COPIÉ" : "ERREUR COPIE");
          });
        }

        render();
      })();
    </script>
  </body>
</html>
