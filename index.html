            // Flèche de progression entre deux étapes, discrète.
            if (idx > 0) {
              const arrow = document.createElement("div");
              arrow.className = "path-arrow";
              arrow.setAttribute("aria-hidden", "true");
              arrow.textContent = "↓";
              pathPanel.appendChild(arrow);
            }

            const clickable = !!step.goTo;
            const el = document.createElement(clickable ? "button" : "div");
            if (clickable) {
              el.type = "button";
              el.title = "Revenir à cette étape";
            }
            el.className = "path-step is-" + step.state;

            const mark = document.createElement("span");
            mark.className = "path-mark";
            mark.textContent = step.state === "done" ? "✓" : step.state === "current" ? "›" : "○";
            el.appendChild(mark);

            // Format « LIBELLÉ : VALEUR », identique à celui de la copie.
            const text = document.createElement("span");
            text.className = "path-text";

            const label = document.createElement("span");
            label.className = "path-label";
            label.textContent = step.label;
            text.appendChild(label);

            const sep = document.createElement("span");
            sep.className = "path-sep";
            sep.textContent = " : ";
            text.appendChild(sep);

            const value = document.createElement("span");
            value.className = "path-value";
            // textContent : jamais d'innerHTML ici, donc rien à échapper.
            value.textContent = pathStepValue(step);
            text.appendChild(value);

            el.appendChild(text);

            if (clickable) {
              el.addEventListener("click", () => applyPathGoTo(step.goTo));
            }

            pathPanel.appendChild(el);
          });
        }

        // ====================================================================
        // RETOUR / RECOMMENCER
        // ====================================================================

        // Y a-t-il quelque chose derrière nous ?
        function canGoBack() {
          if (inlineChain.length > 0) return true;
          if (activeToggleStack.length > 0) return true;
          return !!inlineRootNode && !singleCategoryMode;
        }

        // RETOUR = recule d'UN SEUL niveau, dans cet ordre :
        //   1. dernier choix de la cascade
        //   2. sinon, dernier toggle activé
        //   3. sinon, on quitte la catégorie
        // COMPTE / STATUT ne sont jamais touchés.
        function goBackOneStep() {
          if (inlineChain.length > 0) {
            inlineChain = inlineChain.slice(0, inlineChain.length - 1);
            render();
            return;
          }

          if (activeToggleStack.length > 0) {
            const entry = activeToggleStack[activeToggleStack.length - 1];
            inlineRootNode = entry.savedRootNode;
            activeToggleStack = activeToggleStack.slice(0, activeToggleStack.length - 1);
            inlineChain = [];
            leafAnswers = {};
            leafInputs = {};
            render();
            return;
          }

          if (inlineRootNode && !singleCategoryMode) {
            // Sortie de catégorie : même remise à zéro que la flèche ← historique.
            inlineRootNode = null;
            inlineChain = [];
            leafAnswers = {};
            leafInputs = {};
            activeToggleStack = [];
            topAnswers = {};
            checkState = {};
            render();
          }
        }

        // Réapplique l'entrée automatique dans la catégorie unique, s'il n'y en
        // a qu'une seule dans treeData (comportement d'origine au démarrage).
        function applyInitialInlineRoot() {
          if (singleCategoryMode) {
            inlineRootNode = window.treeData.choix[0].suite;
          }
        }

        // RECOMMENCER = dossier suivant. On remet tout le parcours à zéro MAIS on
        // garde COMPTE et STATUT (globalSelections), qui ne changent pas d'un
        // dossier à l'autre : ça économise 2 clics à chaque dossier.
        // Garde-fou du MODE OPÉRATOIRE : s'il reste des étapes non cochées, le
        // 1er clic sur RECOMMENCER prévient seulement (pas de fenêtre à
        // valider) ; un 2e clic dans les 4 secondes lance le dossier suivant.
        let resetArmedUntil = 0;
        function onResetClick() {
          const remaining = remainingChecklistSteps();
          if (remaining > 0 && Date.now() > resetArmedUntil) {
            resetArmedUntil = Date.now() + 4000;
            showToast(
              remaining + (remaining > 1 ? " ÉTAPES NON FAITES" : " ÉTAPE NON FAITE") +
                " — RECLIQUER POUR PASSER AU DOSSIER SUIVANT",
              4000
            );
            return;
          }
          resetArmedUntil = 0;
          resetDossier();
        }

        function resetDossier() {
          checkState = {};
          globalSelections = {};
          trail = [{ label: "", node: window.treeData }];
          inlineRootNode = null;
          inlineChain = [];
          nodeInputs = {};
          nodeSelections = {};
          leafAnswers = {};
          leafInputs = {};
          topAnswers = {};
          activeToggleStack = [];
          lastScrollTargetId = null;
          applyInitialInlineRoot();
          window.scrollTo(0, 0);
          render();
          showToast("NOUVEAU DOSSIER");
        }

        if (backBtn) backBtn.addEventListener("click", goBackOneStep);

        // Accès discret à l'ATELIER TUTO : raccourci Alt + Maj + T (aucun
        // bouton visible). Ouvre atelier-tuto.html dans un nouvel onglet.
        document.addEventListener("keydown", (e) => {
          if (e.altKey && e.shiftKey && !e.ctrlKey && e.key.toLowerCase() === "t") {
            e.preventDefault();
            window.open("atelier-tuto.html", "_blank");
          }
        });

        // Bouton JOUR / NUIT : bascule l'attribut data-theme de <html> et
        // retient le choix (voir le petit script en tête de page).
        const themeBtn = document.getElementById("themeBtn");
        function syncThemeButton() {
          const nuit = document.documentElement.getAttribute("data-theme") === "nuit";
          themeBtn.textContent = nuit ? "☀ JOUR" : "☾ NUIT";
        }
        if (themeBtn) {
          syncThemeButton();
          themeBtn.addEventListener("click", () => {
            const nuit = document.documentElement.getAttribute("data-theme") !== "nuit";
            if (nuit) document.documentElement.setAttribute("data-theme", "nuit");
            else document.documentElement.removeAttribute("data-theme");
            try { localStorage.setItem("logix-theme", nuit ? "nuit" : "jour"); } catch (e) { /* rien */ }
            syncThemeButton();
          });
        }
        if (resetBtn) resetBtn.addEventListener("click", onResetClick);

        function render() {
          // On capture la position de scroll avant le re-rendu pour la restaurer.
          // Sinon le navigateur peut décaler la vue quand un élément (ex: input N° CO)
          // disparaît du DOM et que la hauteur totale change.
          const _scrollY = window.scrollY;

          syncAutoChecks();
          const node = getDisplayNode();
          const deepestNode = getDeepestNode();

          renderBreadcrumbs();
          renderCategoryTabs();
          renderQuestion(node);
          renderContextPanel();
          renderToggles();
          renderToggleBandeaux();
          renderCascade();
          marquerChampsRemplis();
          renderLeafQuestions();
          renderChecklist();
          renderResults(deepestNode);
          const stop = checklistStops();
          resultsContainer.classList.toggle("hidden", stop);
          // renderPathPanel en dernier : il compte les blocs résultat déjà rendus.
          renderPathPanel();
          if (backBtn) backBtn.disabled = !canGoBack();
          // Plus de scroll auto ni de focus auto : l'utilisateur navigue à son rythme.

          // Restauration de la position : on force avant ET après le reflow
          // (au cas où le navigateur ajusterait après son recalcul de hauteur).
          if (window.scrollY !== _scrollY) {
            window.scrollTo(0, _scrollY);
          }
          requestAnimationFrame(() => {
            if (window.scrollY !== _scrollY) {
              window.scrollTo(0, _scrollY);
            }
          });
        }

        // Entrée automatique s'il n'y a qu'une seule catégorie dans treeData.
        // (Logique inchangée, juste extraite dans une fonction pour être
        // réutilisée par RECOMMENCER.)
        applyInitialInlineRoot();

        // Chaîne texte du CHEMIN, destinée au presse-papier (pour la donner
        // telle quelle à une IA, ou pour décrire son état).
        //
        // Elle est construite à partir des MÊMES étapes que le panneau CHEMIN
        // (buildPathSteps) : il est donc impossible que l'affichage et la copie
        // divergent. Il n'existe plus aucune logique de navigation parallèle ici.
        //
        // Format, une étape par ligne, séparées par une flèche :
        //   COMPTE : ACTIF
        //   ↓
        //   STATUT : A/C
        //   ↓
        //   MOTIF : AMIABLE RELDET
        // « / » = étape atteinte mais pas encore renseignée.
        function getCurrentPathString() {
          const steps = buildPathSteps();
          if (steps.length === 0) return "(aucun choix)";
          return steps
            .map((step) => step.label + " : " + pathStepValue(step))
            .join("\n\u2193\n");
        }

        // Trouve l'id du 1er input de type "image" présent dans la cascade courante.
        function findActiveImageInputId() {
          const isInline = !!inlineRootNode;
          const cascade = isInline
            ? [inlineRootNode, ...inlineChain.map((s) => s.node).filter(Boolean)]
            : [getCurrentNode()];
          for (const lvl of cascade) {
            if (lvl && Array.isArray(lvl.inputs)) {
              for (const inp of lvl.inputs) {
                if (inp.type === "image") return inp.id;
              }
            }
          }
          return null;
        }

        // Listener paste GLOBAL : si une image est dans le clipboard et qu'un input
        // de type "image" est actif dans la cascade courante, on capture l'image
        // sans qu'il faille avoir cliqué dans la zone.
        document.addEventListener("paste", (e) => {
          const items = (e.clipboardData || window.clipboardData)?.items || [];
          let imageItem = null;
          for (const item of items) {
            if (item.type && item.type.startsWith("image/")) {
              imageItem = item;
              break;
            }
          }
          if (!imageItem) return;

          const imageInputId = findActiveImageInputId();
          if (!imageInputId) return;

          e.preventDefault();
          const blob = imageItem.getAsFile();
          if (!blob) return;
          const reader = new FileReader();
          reader.onload = () => {
            saveNodeInputValue(imageInputId, reader.result);
            render();
          };
          reader.readAsDataURL(blob);
        });

        // Listener du bouton "📋 chemin"
        const copyPathBtn = document.getElementById("copyPathBtn");
        if (copyPathBtn) {
          copyPathBtn.addEventListener("click", async () => {
            const path = getCurrentPathString();
            const ok = await copyPlainText(path);
            showToast(ok ? "CHEMIN COPIÉ" : "ERREUR COPIE");
          });
        }

        render();
      })();
    </script>
  </body>
</html>
